y":"<h3>三种最常见的复杂度</h3>\n<table><thead><tr><th>复杂度</th><th>名字</th><th>典型代码</th><th>数据量 1 万时</th></tr></thead><tbody><tr><td>O(1)</td><td>常数</td><td>字典取值 <code>d[key]</code>、<code>list[-1]</code></td><td>1 步</td></tr><tr><td>O(n)</td><td>线性</td><td>一次 for 循环</td><td>1 万步</td></tr><tr><td>O(n²)</td><td>平方</td><td>两层嵌套循环</td><td>1 亿步</td></tr></tbody></table>\n<h3>怎么看代码属于哪一种</h3>\n<pre class=\"snippet\"><code>total = sum(nums)                 # O(n)：内部走一遍\nfound_in_list = target in nums    # O(n)：从头找到尾\nfound_in_set = target in seen     # O(1)：集合查找是瞬间的</code></pre>\n<p>两层循环要小心：</p>\n<pre class=\"snippet\"><code># O(n²)：1 万个元素要做 1 亿次比较，慢到卡住\nfor x in nums:\n    for y in nums:\n        ...\n\n# O(n)：用集合换速度\nseen = set(nums)\nfor x in nums:\n    if (target - x) in seen:\n        ...</code></pre>\n<p><strong>经验法则</strong>：嵌套循环的层数相乘。一层 O(n)，两层 O(n²)，三层 O(n³)。数据量一大就立刻爆炸。</p>\n<h3>常见优化手段</h3>\n<ul><li>把列表换成集合或字典来查找：O(n) → O(1)。</li><li>提前退出：找到就 <code>break</code>。</li><li>少重复计算：把结果存进变量。</li><li>需要多次查找的数据先排序，再用二分。</li></ul>\n<h3>用时间实测一下</h3>\n<pre class=\"snippet\"><code>import time\n\nstart = time.perf_counter()\ntotal = sum(range(1_000_000))\nprint(f\"耗时 {time.perf_counter() - start:.4f} 秒\")</code></pre>\n<p><code>perf_counter()</code> 是最精确的计时方式，写性能测试时用它。</p>\n<div class=\"callout\"><p>提示：不要过早优化。先保证正确，再测量、再优化最慢的那一段。</p></div>","example":{"title":"两种写法的速度差距","code":"import time\n\nnums = list(range(0, 20000, 2))\n\nstart = time.perf_counter()\ncount = 0\nfor n in nums:\n    if n % 3 == 0:\n        count += 1\nprint(f\"一次遍历：{time.perf_counter() - start:.4f} 秒，找到 {count} 个\")\n\nstart = time.perf_counter()\npairs = 0\nfor a in nums[:200]:\n    for b in nums[:200]:\n        if a + b == 1000:\n            pairs += 1\nprint(f\"两层循环（只取 200 个元素）：{time.perf_counter() - start:.4f} 秒，共 {pairs} 对\")","stdin":[],"explain":"第二个循环只用了 200 个元素就已经慢了这么多，如果把 20000 个全放进去会慢上千倍。","runnable":true,"notes":[]},"exercises":[{"title":"练习：用集合把 O(n²) 变成 O(n)","task":"<p>实现 <code>has_pair_sum(nums, target)</code>：判断列表里是否存在两个数相加等于 target。</p>\n<p>要求用集合（seen）一次遍历完成，<strong>不要</strong>用两层嵌套循环。</p>","starter":"def has_pair_sum(nums, target):\n    seen = set()\n    # 一次遍历：对每个数，检查它的“搭档”是否出现过\n","stdin":[],"check":{"type":"test","code":"assert \"has_pair_sum\" in globals(), \"没有找到 has_pair_sum 函数\"\nassert has_pair_sum([2, 7, 11, 15], 9) is True, \"2 + 7 = 9\"\nassert has_pair_sum([2, 7, 11, 15], 100) is False, \"没有这样的两个数\"\nassert has_pair_sum([1, 1], 2) is True, \"两个 1 相加等于 2\"\nassert has_pair_sum([5], 10) is False, \"只有一个数不够\"\nassert has_pair_sum([0, 4, -4], 0) is True, \"4 和 -4 相加等于 0\""},"hint":"for n in nums: 如果 (target - n) in seen 就 return True，否则 seen.add(n)。循环结束 return False。","walkthrough":[],"solution":"def has_pair_sum(nums, target):\n    seen = set()\n    for n in nums:\n        if (target - n) in seen:\n            return True\n        seen.add(n)\n    return False"}],"quiz":{"q":"两层嵌套循环遍历 n 个元素，复杂度大约是多少？","options":["O(1)","O(n)","O(n log n)","O(n²)"],"answer":3,"explain":"外层 n 次、内层 n 次，相乘就是 n²。"},"localOnly":false}]},{"id":"c11","title":"第 11 章 · 日期、正则与自动化","summary":"处理时间和文本，把重复的手工活交给 Python——这一章开始能解决真实问题了。","lessons":[{"id":"c11l1","title":"日期与时间：datetime","chapter_title":"第 11 章 · 日期、正则与自动化","chapter_id":"c11","minutes":15,"level":"进阶","goal":"会取当前时间、格式化输出、计算日期间隔。","theory":"<h3>取时间和日期</h3>\n<pre class=\"snippet\"><code>from datetime import datetime, date\n\nnow = datetime.now()\nprint(now)                       # 运行时真实时间，例如 2026-01-01 21:30:15.123456\nprint(now.year, now.month, now.day)\nprint(now.hour, now.minute, now.second)\nprint(date.today())              # 运行时真实日期</code></pre>\n<h3>铁律：要「今天」就用 date.today()</h3>\n<pre class=\"snippet\"><code>from datetime import date\n\ntoday = date.today()\nprint(today)                                    # 你运行的那一天\nprint(today.strftime(\"%Y年%m月%d日\"))            # 格式化成中文写法\nweekdays = [\"一\", \"二\", \"三\", \"四\", \"五\", \"六\", \"日\"]\nprint(f\"今天是星期{weekdays[today.weekday()]}\")   # weekday()：周一为 0</code></pre>\n<div class=\"callout warn\"><p>注意：<strong>不要把日期写死在代码里</strong>。写了固定日期的程序，第二天就不对了；用 <code>date.today()</code> 取当天，程序永远是对的。本课后面出现的固定日期（比如 <code>2026-01-01</code>），只是为了让你能算出确定的结果。</p></div>\n<h3>格式化：把时间变成想要的文字</h3>\n<pre class=\"snippet\"><code>now = datetime(2026, 1, 1, 21, 30)          # 一个固定的示例时间\nprint(now.strftime(\"%Y-%m-%d\"))             # 2026-01-01\nprint(now.strftime(\"%Y年%m月%d日 %H:%M\"))    # 2026年01月01日 21:30\nprint(now.strftime(\"%A\"))                  # 星期几（英文）</code></pre>\n<table><thead><tr><th>符号</th><th>含义</th><th>例子</th></tr></thead><tbody><tr><td><code>%Y</code></td><td>四位年份</td><td>2026</td></tr><tr><td><code>%m</code></td><td>月份</td><td>01</td></tr><tr><td><code>%d</code></td><td>日期</td><td>01</td></tr><tr><td><code>%H:%M:%S</code></td><td>时分秒</td><td>21:30:15</td></tr><tr><td><code>%Y-%m-%d</code></td><td>最常用的日期格式</td><td><code>2026-01-01</code></td></tr></tbody></table>\n<h3>解析字符串成日期</h3>\n<pre class=\"snippet\"><code>text = \"2026-01-01\"\nd = datetime.strptime(text, \"%Y-%m-%d\")\nprint(d.year)         # 2026</code></pre>\n<h3>计算日期差</h3>\n<pre class=\"snippet\"><code>from datetime import date\n\nd1 = date(2026, 1, 1)\nd2 = date(2026, 12, 31)\nprint((d2 - d1).days)              # 364\nprint(d1 + timedelta(days=30))     # 2026-01-31</code></pre>\n<p>把 <code>d2</code> 换成 <code>date.today()</code>，就是「今年已经过去多少天」：</p>\n<pre class=\"snippet\"><code>days = (date.today() - date(date.today().year, 1, 1)).days + 1\nprint(f\"今天是今年的第 {days} 天\")</code></pre>\n<div class=\"callout warn\"><p>注意：<code>strftime</code> 是「时间 → 字符串」，<code>strptime</code> 是「字符串 → 时间」，拼写只差一个 r，方向正好相反。</p></div>","example":{"title":"用真实的今天算一算","code":"from datetime import date, datetime, timedelta\n\ntoday = date.today()          # 取真实的今天\nweekdays = [\"一\", \"二\", \"三\", \"四\", \"五\", \"六\", \"日\"]\n\nprint(f\"今天是 {today}，星期{weekdays[today.weekday()]}\")\n\nfirst_day = date(today.year, 1, 1)\nprint(f\"今年已经过了 {(today - first_day).days + 1} 天\")\n\nnext_year = date(today.year + 1, 1, 1)\nprint(f\"距离下一个元旦还有 {(next_year - today).days} 天\")\nprint(\"100 天后是\", today + timedelta(days=100))","stdin":[],"explain":"这段代码不管哪天运行，结果都是对的——因为它用的是 date.today()，而不是写死的日期。","runnable":true,"notes":[]},"exercises":[{"title":"练习：格式化与日期差（固定日期）","task":"<p>给定两个固定日期 <code>d1 = date(2026, 1, 1)</code>、<code>d2 = date(2026, 12, 31)</code>，输出两行：</p>\n<pre class=\"snippet\"><code>2026-12-31\n相差 364 天</code></pre>","starter":"from datetime import date\n\nd1 = date(2026, 1, 1)\nd2 = date(2026, 12, 31)\n# 第一行：把 d2 格式化输出\n# 第二行：输出两个日期相差的天数","stdin":[],"check":{"type":"output","expect":"2026-12-31\n相差 364 天"},"hint":"d2.strftime(\"%Y-%m-%d\")；(d2 - d1).days。","walkthrough":[],"solution":"from datetime import date\n\nd1 = date(2026, 1, 1)\nd2 = date(2026, 12, 31)\nprint(d2.strftime(\"%Y-%m-%d\"))\nprint(f\"相差 {(d2 - d1).days} 天\")"},{"title":"挑战：用真实的今天（不会过期的写法）","task":"<p>用 <code>date.today()</code> 取真实的今天，算出今天是今年的第几天，输出一句话：</p>\n<pre class=\"snippet\"><code>今天是 XXXX-XX-XX，今年第 N 天</code></pre>\n<p>（检查时会按你运行那天的真实日期来核对，所以随便哪天做都对。）</p>","starter":"from datetime import date\n\ntoday = date.today()\n# 算出今天是今年的第几天，存进变量 day_of_year\n\n# 打印：今天是 XXXX-XX-XX，今年第 N 天","stdin":[],"check":{"type":"test","code":"import datetime as _dt\nassert 'today' in globals(), \"请用 date.today() 取今天\"\nassert today == _dt.date.today(), \"today 必须是真实的今天，不能写死日期\"\nassert 'day_of_year' in globals(), \"请把结果存进变量 day_of_year\"\nreal = (_dt.date.today() - _dt.date(_dt.date.today().year, 1, 1)).days + 1\nassert day_of_year == real, f\"今年第几天算错了，应该是 {real}\"\nassert isinstance(day_of_year, int), \"day_of_year 应该是整数\""},"hint":"day_of_year = (today - date(today.year, 1, 1)).days + 1，然后 print(f\"今天是 {today}，今年第 {day_of_year} 天\")。","walkthrough":[],"solution":"from datetime import date\n\ntoday = date.today()\nday_of_year = (today - date(today.year, 1, 1)).days + 1\nprint(f\"今天是 {today}，今年第 {day_of_year} 天\")"}],"quiz":{"q":"把用户输入的日期字符串（例如 input() 读到的内容）变成日期对象，用哪个方法？","options":["strftime","strptime","now","timedelta"],"answer":1,"explain":"parse time（解析）用 strptime；format time（格式化）用 strftime。"},"localOnly":false},{"id":"c11l2","title":"正则表达式入门","chapter_title":"第 11 章 · 日期、正则与自动化","chapter_id":"c11","minutes":16,"level":"进阶","goal":"会用 \\d、\\w、量词和 findall 从文本里提取信息。","theory":"<h3>正则解决什么问题</h3>\n<p>「找出这段话里所有的电话号码」——用字符串方法写会非常啰嗦，用正则一行就够。</p>\n<h3>最常用的几个符号</h3>\n<table><thead><tr><th>符号</th><th>意思</th><th>例子</th></tr></thead><tbody><tr><td><code>\\d</code></td><td>一个数字</td><td><code>\\d\\d\\d</code> 匹配 123</td></tr><tr><td><code>\\w</code></td><td>字母、数字、下划线、汉字</td><td><code>\\w+</code></td></tr><tr><td><code>\\s</code></td><td>空白字符</td><td>空格、Tab</td></tr><tr><td><code>.</code></td><td>任意字符</td><td><code>a.c</code> 匹配 abc</td></tr><tr><td><code>+</code></td><td>前面的内容出现 1 次或更多</td><td><code>\\d+</code></td></tr><tr><td><code>*</code></td><td>0 次或更多</td><td><code>\\d*</code></td></tr><tr><td><code>?</code></td><td>0 次或 1 次</td><td><code>-?\\d+</code></td></tr><tr><td><code>{3}</code> / <code>{2,5}</code></td><td>正好 3 次 / 2 到 5 次</td><td><code>\\d{11}</code></td></tr><tr><td><code>^</code> <code>$</code></td><td>开头 / 结尾</td><td><code>^1\\d{10}$</code></td></tr></tbody></table>\n<h3>三个常用函数</h3>\n<pre class=\"snippet\"><code>import re\n\ntext = \"订单 A123，价格 45 元，买了 2 件\"\n\nprint(re.findall(r\"\\d+\", text))          # ['123', '45', '2']\nprint(re.search(r\"价格 (\\d+)\", text))     # 返回匹配对象\nprint(re.sub(r\"\\d+\", \"*\", text))          # 把数字都换成星号</code></pre>\n<h3>两个必须知道的习惯</h3>\n<ul><li>Python 里<strong>一定要写 <code>r\"...\"</code> 原始字符串</strong>，否则 <code>\\d</code> 会被当成转义字符。</li><li>正则里的 <code>()</code> 表示分组，<code>re.search(...).group(1)</code> 可以取出括号里匹配的内容。</li></ul>\n<pre class=\"snippet\"><code>import re\n\nm = re.search(r\"价格 (\\d+)\", text)\nif m:\n    print(m.group(0))     # 价格 45\n    print(m.group(1))     # 45</code></pre>\n<div class=\"callout\"><p>提示：正则不用背。写的时候搜「正则 手机号 校验」这类关键词，找到现成的表达式，再用测试文本验证一遍。</p></div>","example":{"title":"从一句话里提取信息","code":"import re\n\ntext = \"订单 A123，价格 45 元，买了 2 件，电话 13800000000\"\n\nprint(re.findall(r\"\\d+\", text))\n\nprice = re.search(r\"价格 (\\d+)\", text)\nif price:\n    print(f\"价格是 {price.group(1)} 元\")\n\nphone = re.search(r\"1\\d{10}\", text)\nif phone:\n    print(f\"手机号是 {phone.group(0)}\")\n\nprint(re.sub(r\"\\d+\", \"*\", text))","stdin":[],"explain":"findall 返回所有匹配的列表；search 只找第一个，用 group 取值。","runnable":true,"notes":[]},"exercises":[{"title":"练习：提取所有数字","task":"<p>用 <code>re.findall</code> 找出下面这句话里的所有数字并打印：</p>\n<pre class=\"snippet\"><code>['123', '45', '2']</code></pre>","starter":"import re\n\ntext = \"订单 A123，价格 45 元，买了 2 件\"\n# 用 re.findall 提取所有数字","stdin":[],"check":{"type":"output","expect":"['123', '45', '2']"},"hint":"re.findall(r\"\\d+\", text)","walkthrough":[],"solution":"import re\n\ntext = \"订单 A123，价格 45 元，买了 2 件\"\nprint(re.findall(r\"\\d+\", text))"},{"title":"挑战：手机号校验","task":"<p>实现 <code>is_phone(text)</code>：如果整串正好是「1 开头 + 11 位数字」返回 True，否则 False。</p>\n<p>（提示：完整匹配用 <code>re.fullmatch</code>）</p>","starter":"import re\n\ndef is_phone(text):\n    # 用 re.fullmatch 判断是不是合法手机号\n","stdin":[],"check":{"type":"test","code":"assert is_phone(\"13800000000\") is True, \"11 位数字应该通过\"\nassert is_phone(\"1380000000\") is False, \"只有 10 位，应该 False\"\nassert is_phone(\"23800000000\") is False, \"必须以 1 开头\"\nassert is_phone(\"1380000000a\") is False, \"结尾是字母，应该 False\"\nassert is_phone(\"138 0000 0000\") is False, \"有空格不算\""},"hint":"bool(re.fullmatch(r\"1\\d{10}\", text))","walkthrough":[],"solution":"import re\n\ndef is_phone(text):\n    return bool(re.fullmatch(r\"1\\d{10}\", text))"}],"quiz":{"q":"re.findall(r\"\\d+\", \"a12b3\") 的结果是？","options":["['12', '3']","['1', '2', '3']","15","'12'"],"answer":0,"explain":"+ 表示连续的数字算一组，所以得到 12 和 3 两段。"},"localOnly":false},{"id":"c11l3","title":"正则进阶：分组与替换","chapter_title":"第 11 章 · 日期、正则与自动化","chapter_id":"c11","minutes":15,"level":"进阶","goal":"会用分组提取内容、用 sub 做替换和清洗。","theory":"<h3>分组：把匹配拆成几块</h3>\n<pre class=\"snippet\"><code>import re\n\ntext = \"出生日期：2026-01-01\"\nm = re.search(r\"(\\d{4})-(\\d{2})-(\\d{2})\", text)\nif m:\n    year, month, day = m.groups()\n    print(year, month, day)      # 2026 01 01</code></pre>\n<p><code>m.group(1)</code>、<code>m.group(2)</code>…… 或者直接 <code>m.groups()</code> 拿到元组。</p>\n<h3>命名分组：读起来更清楚</h3>\n<pre class=\"snippet\"><code>m = re.search(r\"(?P&lt;year&gt;\\d{4})-(?P&lt;month&gt;\\d{2})\", \"2026-01\")\nprint(m.group(\"year\"))       # 2026</code></pre>\n<h3>sub：查找并替换</h3>\n<pre class=\"snippet\"><code>import re\n\ntext = \"日期 2026/01/01，另一个 2026/12/31\"\nprint(re.sub(r\"/(\\d{2})/\", r\"-\\1-\", text))\n# 日期 2026-01-01，另一个 2026-12-31</code></pre>\n<p><code>\\1</code> 表示「第 1 个分组匹配到的内容」，可以把原内容的一部分搬到替换结果里。</p>\n<h3>清洗文本：把连续空白变成一个空格</h3>\n<pre class=\"snippet\"><code>text = \"  今天   天气    不错  \"\nprint(re.sub(r\"\\s+\", \" \", text).strip())    # 今天 天气 不错</code></pre>\n<h3>常用参数</h3>\n<pre class=\"snippet\"><code>re.findall(r\"python\", text, flags=re.I)     # 忽略大小写\nre.split(r\"[,，;；]\", \"a,b，c\")              # 按多种分隔符切分</code></pre>\n<table><thead><tr><th>任务</th><th>写法</th></tr></thead><tbody><tr><td>提取分组</td><td><code>m.groups()</code></td></tr><tr><td>按组替换</td><td><code>re.sub(r\"(\\d+)-(\\d+)\", r\"\\2-\\1\", s)</code></td></tr><tr><td>忽略大小写</td><td><code>flags=re.I</code></td></tr><tr><td>多种分隔符切分</td><td><code>re.split(r\"[,，;；]\", s)</code></td></tr></tbody></table>\n<div class=\"callout\"><p>提示：如果一段正则你自己都看不懂了，就拆成几个简单的、加上注释，或者干脆用字符串方法处理。</p></div>","example":{"title":"日期格式互转","code":"import re\n\ntext = \"日期 2026/01/01，截止 2026/12/31\"\n\nprint(re.sub(r\"/(\\d{2})/\", r\"-\\1-\", text))\n\nm = re.search(r\"(\\d{4})/(\\d{2})/(\\d{2})\", text)\nif m:\n    year, month, day = m.groups()\n    print(f\"年：{year}，月：{month}，日：{day}\")\n\nmessy = \"  今天   天气    不错  \"\nprint(re.sub(r\"\\s+\", \" \", messy).strip())","stdin":[],"explain":"sub 把斜杠日期换成短横线，groups 把年月日拆成了三个变量。","runnable":true,"notes":[]},"exercises":[{"title":"练习：格式转换与分组","task":"<p>已有 <code>text = \"日期 2026/01/01\"</code>，输出两行：</p>\n<pre class=\"snippet\"><code>日期 2026-01-01\n2026 01 01</code></pre>","starter":"import re\n\ntext = \"日期 2026/01/01\"\n# 第一行：用 sub 把 / 换成 -\n\n# 第二行：用分组取出年月日，用空格连接打印","stdin":[],"check":{"type":"output","expect":"日期 2026-01-01\n2026 01 01"},"hint":"re.sub(r\"/(\\d{2})/\", r\"-\\1-\", text)；然后用 re.search 分组，print(\" \".join(m.groups()))。","walkthrough":[],"solution":"import re\n\ntext = \"日期 2026/01/01\"\n\nprint(re.sub(r\"/(\\d{2})/\", r\"-\\1-\", text))\n\nm = re.search(r\"(\\d{4})/(\\d{2})/(\\d{2})\", text)\nprint(\" \".join(m.groups()))"}],"quiz":{"q":"re.sub(r\"(\\d+)-(\\d+)\", r\"\\2-\\1\", \"12-34\") 的结果是？","options":["12-34","34-12","1234","报错"],"answer":1,"explain":"\\1 和 \\2 分别代表两个分组，替换时把它们调换了位置。"},"localOnly":false},{"id":"c11l4","title":"项目：记账本（含分类统计）","chapter_title":"第 11 章 · 日期、正则与自动化","chapter_id":"c11","minutes":20,"level":"综合","goal":"用列表套字典 + 函数 + CSV 做一个能记账、能统计的小工具。","theory":"<h3>数据结构先想清楚</h3>\n<p>一条记录需要什么？日期、项目、金额、类型（收入/支出）。</p>\n<pre class=\"snippet\"><code>records = [\n    {\"date\": \"2026-01-05\", \"item\": \"工资\", \"amount\": 8000, \"type\": \"收入\"},\n    {\"date\": \"2026-01-06\", \"item\": \"房租\", \"amount\": 2500, \"type\": \"支出\"},\n]</code></pre>\n<h3>拆成三个函数</h3>\n<pre class=\"snippet\"><code>def total_by_type(records, kind):\n    total = 0\n    for r in records:\n        if r[\"type\"] == kind:\n            total += r[\"amount\"]\n    return total\n\ndef summarize(records):\n    result = {}\n    for r in records:\n        result[r[\"item\"]] = result.get(r[\"item\"], 0) + r[\"amount\"]\n    return result\n\ndef balance(records):\n    return total_by_type(records, \"收入\") - total_by_type(records, \"支出\")</code></pre>\n<h3>存成 CSV</h3>\n<pre class=\"snippet\"><code>import csv\n\nwith open(\"money.csv\", \"w\", encoding=\"utf-8\", newline=\"\") as f:\n    writer = csv.writer(f)\n    writer.writerow([\"date\", \"item\", \"amount\", \"type\"])\n    for r in records:\n        writer.writerow([r[\"date\"], r[\"item\"], r[\"amount\"], r[\"type\"]])</code></pre>\n<h3>加上输入（在本地玩更爽）</h3>\n<pre class=\"snippet\"><code>from datetime import date\n\nwhile True:\n    item = input(\"支出项目（直接回车结束）：\")\n    if not item:\n        break\n    amount = int(input(\"金额：\"))\n    # 记账日期永远取当天，别写死\n    records.append({\"date\": str(date.today()), \"item\": item, \"amount\": amount, \"type\": \"支出\"})\nprint(f\"共支出 {total_by_type(records, '支出')} 元\")</code></pre>\n<div class=\"callout\"><p>提示：<code>str(date.today())</code> 会得到 <code>2026-01-01</code> 这种格式的当天日期，这样记账本每天都记对。真实记账本还要处理「金额输错了」「分类有哪些」这些细节，先跑通最小版本，再一点点加功能。</p></div>","example":{"title":"记账与统计","code":"records = [\n    {\"date\": \"2026-01-05\", \"item\": \"工资\", \"amount\": 8000, \"type\": \"收入\"},\n    {\"date\": \"2026-01-06\", \"item\": \"房租\", \"amount\": 2500, \"type\": \"支出\"},\n    {\"date\": \"2026-01-07\", \"item\": \"吃饭\", \"amount\": 600, \"type\": \"支出\"},\n]\n\ndef total_by_type(records, kind):\n    return sum(r[\"amount\"] for r in records if r[\"type\"] == kind)\n\ndef summarize(records):\n    result = {}\n    for r in records:\n        if r[\"type\"] == \"支出\":\n            result[r[\"item\"]] = result.get(r[\"item\"], 0) + r[\"amount\"]\n    return result\n\nincome = total_by_type(records, \"收入\")\nexpense = total_by_type(records, \"支出\")\nprint(f\"收入 {income} 元，支出 {expense} 元，结余 {income - expense} 元\")\n\nfor item, amount in summarize(records).items():\n    print(f\"  {item}: {amount} 元\")","stdin":[],"explain":"total_by_type 用的是生成器表达式加条件筛选，比手写循环更短。","runnable":true,"notes":[]},"exercises":[{"title":"练习：两个统计函数","task":"<p>实现两个函数：</p>\n<ol><li><code>total_by_type(records, kind)</code>：返回指定类型（收入/支出）的金额合计</li><li><code>summarize(records)</code>：返回「项目 → 金额」的字典（只统计支出）</li></ol>","starter":"records = [\n    {\"date\": \"2026-01-05\", \"item\": \"工资\", \"amount\": 8000, \"type\": \"收入\"},\n    {\"date\": \"2026-01-06\", \"item\": \"房租\", \"amount\": 2500, \"type\": \"支出\"},\n    {\"date\": \"2026-01-07\", \"item\": \"吃饭\", \"amount\": 600, \"type\": \"支出\"},\n]\n\ndef total_by_type(records, kind):\n    # 累加指定类型的金额\n\ndef summarize(records):\n    # 只统计支出，返回 {项目: 金额}\n","stdin":[],"check":{"type":"test","code":"assert total_by_type(records, \"收入\") == 8000, \"收入合计应该是 8000\"\nassert total_by_type(records, \"支出\") == 3100, \"支出合计应该是 3100\"\nassert total_by_type(records, \"投资\") == 0, \"没有这个类型时应该返回 0\"\ns = summarize(records)\nassert s == {\"房租\": 2500, \"吃饭\": 600}, \"支出分类统计不对\"\nassert \"工资\" not in s, \"收入不应该出现在支出统计里\""},"hint":"total_by_type 里 total = 0 然后循环累加；summarize 里用 result.get(item, 0) + amount。","walkthrough":[],"solution":"records = [\n    {\"date\": \"2026-01-05\", \"item\": \"工资\", \"amount\": 8000, \"type\": \"收入\"},\n    {\"date\": \"2026-01-06\", \"item\": \"房租\", \"amount\": 2500, \"type\": \"支出\"},\n    {\"date\": \"2026-01-07\", \"item\": \"吃饭\", \"amount\": 600, \"type\": \"支出\"},\n]\n\ndef total_by_type(records, kind):\n    total = 0\n    for r in records:\n        if r[\"type\"] == kind:\n            total += r[\"amount\"]\n    return total\n\ndef summarize(records):\n    result = {}\n    for r in records:\n        if r[\"type\"] == \"支出\":\n            result[r[\"item\"]] = result.get(r[\"item\"], 0) + r[\"amount\"]\n    return result"}],"quiz":{"q":"想统计「每个项目的支出合计」，用哪种结构最合适？","options":["列表","字典","集合","字符串"],"answer":1,"explain":"「项目 → 合计」是典型的键值对，用字典最自然。"},"localOnly":false},{"id":"c11l5","title":"进阶方向：Excel、Word、邮件自动化","chapter_title":"第 11 章 · 日期、正则与自动化","chapter_id":"c11","minutes":15,"level":"进阶","goal":"知道 Python 能做哪些办公自动化，并明白为什么这些要在本机运行。","theory":"<h3>这一课需要在你自己的电脑上运行</h3>\n<p>下面这些库浏览器里没有，必须先在自己电脑上安装。安装方式在第 12 章会讲。</p>\n<table><thead><tr><th>库</th><th>用途</th><th>安装命令</th></tr></thead><tbody><tr><td><code>openpyxl</code></td><td>读写 Excel（.xlsx）</td><td><code>pip install openpyxl</code></td></tr><tr><td><code>pandas</code></td><td>表格数据分析</td><td><code>pip install pandas</code></td></tr><tr><td><code>python-docx</code></td><td>读写 Word</td><td><code>pip install python-docx</code></td></tr><tr><td><code>python-pptx</code></td><td>生成 PPT</td><td><code>pip install python-pptx</code></td></tr><tr><td><code>smtplib</code>（自带）</td><td>发邮件</td><td>不需要安装</td></tr></tbody></table>\n<h3>读 Excel 的样子</h3>\n<pre class=\"snippet\"><code>from openpyxl import load_workbook\n\nwb = load_workbook(\"成绩表.xlsx\")\nsheet = wb.active\nfor row in sheet.iter_rows(min_row=2, values_only=True):\n    print(row)          # ('小明', 88)</code></pre>\n<h3>写 Excel 的样子</h3>\n<pre class=\"snippet\"><code>from openpyxl import Workbook\n\nwb = Workbook()\nsheet = wb.active\nsheet.append([\"姓名\", \"分数\"])\nsheet.append([\"小明\", 88])\nwb.save(\"输出.xlsx\")</code></pre>\n<h3>发邮件的样子（只用标准库）</h3>\n<pre class=\"snippet\"><code>import smtplib\nfrom email.message import EmailMessage\n\nmsg = EmailMessage()\nmsg[\"Subject\"] = \"每日报告\"\nmsg[\"From\"] = \"me@example.com\"\nmsg[\"To\"] = \"you@example.com\"\nmsg.set_content(\"今天一切正常\")\n\nwith smtplib.SMTP_SSL(\"smtp.example.com\", 465) as server:\n    server.login(\"me@example.com\", \"密码请用环境变量，不要写死\")\n    server.send_message(msg)</code></pre>\n<div class=\"callout warn\"><p>注意：<strong>永远不要把密码直接写进代码</strong>。用环境变量：<code>import os</code> 之后 <code>os.environ[\"MAIL_PASSWORD\"]</code>。如果代码要上传到 GitHub，写死的密码等于公开泄露。</p></div>\n<h3>自动化能帮你做什么</h3>\n<ul><li>把十几个 Excel 合并成一张表。</li><li>按模板批量生成 Word 合同 / 通知。</li><li>每周定时把数据整理好发邮件给同事。</li><li>把文件夹里几百张图片按日期重命名归类。</li></ul>\n<p>这些任务的共同点：<strong>规则明确、重复、量大</strong>——正是 Python 最擅长的地方。</p>\n<div class=\"callout\"><p>提示：装库前先想清楚「我到底要做什么」。需求越具体，越容易搜到正确的库和示例代码。</p></div>","example":{"title":"示例：读 Excel 的样子（需要在本机运行）","code":"# 需要先在本机执行：pip install openpyxl\nfrom openpyxl import load_workbook\n\nwb = load_workbook(\"成绩表.xlsx\")\nsheet = wb.active\n\ntotal = 0\ncount = 0\nfor row in sheet.iter_rows(min_row=2, values_only=True):\n    name, score = row[0], row[1]\n    print(name, score)\n    total += score\n    count += 1\n\nprint(f\"平均分 {total / count:.1f}\")","stdin":[],"explain":"浏览器里装不了 openpyxl，所以这段代码请复制到你自己的电脑上运行。第 12 章会教你怎么装。","runnable":false,"notes":[]},"exercises":[{"title":"练习：用 CSV 代替 Excel","task":"<p>Excel 能打开的 CSV，在浏览器里也能处理。</p>\n<p>请把两条数据写成 <code>grades.csv</code>（第一行表头），再读回来打印行数：</p>\n<pre class=\"snippet\"><code>共 3 行（含表头）</code></pre>","starter":"import csv\n\n# 用 csv.writer 写三行（含表头）\n\n# 用 csv.reader 读回来，统计行数并打印","stdin":[],"check":{"type":"output","expect":"共 3 行（含表头）"},"hint":"写文件用 open(\"grades.csv\", \"w\", encoding=\"utf-8\", newline=\"\")；读回来可以 rows = list(csv.reader(f)) 再 len(rows)。","walkthrough":[],"solution":"import csv\n\nwith open(\"grades.csv\", \"w\", encoding=\"utf-8\", newline=\"\") as f:\n    writer = csv.writer(f)\n    writer.writerow([\"姓名\", \"分数\"])\n    writer.writerow([\"小明\", 88])\n    writer.writerow([\"小红\", 95])\n\nwith open(\"grades.csv\", encoding=\"utf-8\") as f:\n    rows = list(csv.reader(f))\n\nprint(f\"共 {len(rows)} 行（含表头）\")"}],"quiz":{"q":"为什么这两课的部分代码要在本机运行？","options":["网页版 Python 环境里没有装这些第三方库","浏览器不支持 print","这些代码语法不对","本地运行才合法"],"answer":0,"explain":"浏览器的 Python 环境默认只带标准库，第三方库需要在本机用 pip 安装。"},"localOnly":false}]},{"id":"c12","title":"第 12 章 · 走向独立开发","summary":"最后一章：第三方库与虚拟环境、写测试、Git、做项目的完整流程，以及你的结业大作业。","lessons":[{"id":"c12l1","title":"pip、虚拟环境与项目结构","chapter_title":"第 12 章 · 走向独立开发","chapter_id":"c12","minutes":15,"level":"进阶","goal":"知道怎么在自己电脑上安装第三方库，并用虚拟环境隔离项目。","theory":"<h3>认识 pip</h3>\n<p>pip 是 Python 的包管理器。下面这些都是<strong>终端命令</strong>，不是在 Python 代码里写：</p>\n<pre class=\"snippet\"><code>pip install requests            安装\npip install requests==2.31.0    装指定版本\npip list                        看装了哪些\npip uninstall requests          卸载\npip freeze &gt; requirements.txt   导出清单\npip install -r requirements.txt 按清单安装</code></pre>\n<p>下载慢可以换国内镜像：</p>\n<pre class=\"snippet\"><code>pip install requests -i https://pypi.tuna.tsinghua.edu.cn/simple</code></pre>\n<h3>为什么需要虚拟环境</h3>\n<p>项目 A 需要 <code>pandas 1.5</code>，项目 B 需要 <code>pandas 2.0</code>，都装全局就会打架。虚拟环境给每个项目一个独立的「小房间」：</p>\n<pre class=\"snippet\"><code>cd 你的项目目录\npython -m venv .venv          创建\n\nWindows 激活：\n.venv\\Scripts\\activate\n\nmacOS / Linux 激活：\nsource .venv/bin/activate\n\n退出：\ndeactivate</code></pre>\n<p>激活后命令行前面会出现 <code>(.venv)</code>，这时 <code>pip install</code> 装的东西只属于这个项目。</p>\n<h3>一个规范的项目长什么样</h3>\n<pre class=\"snippet\"><code>myproject/\n    .venv/               虚拟环境（不要提交到 Git）\n    README.md            项目说明：这是什么、怎么运行\n    requirements.txt     依赖清单\n    .gitignore           要忽略的文件\n    main.py              入口\n    utils/               自己写的模块\n        __init__.py</code></pre>\n<div class=\"callout warn\"><p>注意：命令行和 Python 代码是两回事。<code>pip install xxx</code> 要在终端里输入，不能写进 .py 文件。</p></div>\n<h3>顺便认识几个好用的库</h3>\n<table><thead><tr><th>库</th><th>用途</th></tr></thead><tbody><tr><td><code>requests</code></td><td>抓网页、调接口</td></tr><tr><td><code>pandas</code></td><td>表格分析</td></tr><tr><td><code>flask</code></td><td>写网页服务</td></tr><tr><td><code>rich</code></td><td>终端里输出彩色表格</td></tr><tr><td><code>pytest</code></td><td>更好用的测试工具</td></tr></tbody></table>\n<div class=\"callout\"><p>提示：判断一个库靠不靠谱，看它在 PyPI 和 GitHub 上的更新频率、star 数和文档完整度。</p></div>","example":{"title":"检查自己的 Python 环境","code":"import sys, os\n\nprint(f\"Python 主版本：{sys.version_info.major}\")\nprint(f\"完整版本：{sys.version.split()[0]}\")\nprint(f\"解释器位置：{sys.executable}\")\nprint(f\"当前目录：{os.getcwd()}\")\n\nfor name in [\"json\", \"csv\", \"datetime\", \"statistics\"]:\n    print(f\"标准库 {name}：可用\")","stdin":[],"explain":"这段代码在浏览器和本机都能跑。本机运行时路径会是真实的磁盘路径。","runnable":true,"notes":[]},"exercises":[{"title":"练习：读取版本信息","task":"<p>导入 <code>sys</code>，打印主版本号：</p>\n<pre class=\"snippet\"><code>Python 主版本 3</code></pre>","starter":"# 导入 sys，然后打印主版本号","stdin":[],"check":{"type":"output","expect":"Python 主版本 3"},"hint":"import sys 之后用 f-string 取 sys.version_info.major。","walkthrough":[],"solution":"import sys\n\nprint(f\"Python 主版本 {sys.version_info.major}\")"}],"quiz":{"q":"虚拟环境的作用是？","options":["让 Python 跑得更快","让每个项目拥有独立的依赖，互不干扰","备份代码","自动写文档"],"answer":1,"explain":"虚拟环境把依赖隔离在项目内部，避免不同项目之间版本冲突。"},"localOnly":false},{"id":"c12l2","title":"写测试：让代码改不坏","chapter_title":"第 12 章 · 走向独立开发","chapter_id":"c12","minutes":16,"level":"进阶","goal":"会用 assert 和 unittest 给自己的代码写测试。","theory":"<h3>为什么要写测试</h3>\n<p>你写了一个函数，测试通过；三天后改了别处，这个函数坏了——有测试就能立刻发现，不用等用户来投诉。</p>\n<h3>最轻量的测试：assert</h3>\n<pre class=\"snippet\"><code>def average(nums):\n    return sum(nums) / len(nums)\n\nassert average([1, 2, 3]) == 2\nassert average([10]) == 10\nprint(\"全部测试通过\")</code></pre>\n<p><code>assert 条件, \"出错信息\"</code>：条件不成立就抛 AssertionError 并显示你的说明。</p>\n<h3>正式一点：unittest</h3>\n<pre class=\"snippet\"><code>import unittest\n\ndef average(nums):\n    return sum(nums) / len(nums)\n\nclass TestAverage(unittest.TestCase):\n    def test_normal(self):\n        self.assertEqual(average([1, 2, 3]), 2)\n\n    def test_one_item(self):\n        self.assertEqual(average([10]), 10)\n\n    def test_empty(self):\n        with self.assertRaises(ZeroDivisionError):\n            average([])\n\nif __name__ == \"__main__\":\n    unittest.main()</code></pre>\n<p>运行方式：在终端执行 <code>python -m unittest 文件名.py</code>。</p>\n<h3>写好测试的几个要点</h3>\n<ul><li>测试方法名用 <code>test_</code> 开头，unittest 才会自动找到。</li><li>一个测试只验证一件事。</li><li>除了正常情况，一定要测边界：空列表、只有一个元素、负数、重复值。</li><li>期望值写具体数字，别写永远成立的条件。</li></ul>\n<table><thead><tr><th>断言方法</th><th>检查什么</th></tr></thead><tbody><tr><td><code>assertEqual(a, b)</code></td><td>相等</td></tr><tr><td><code>assertTrue(x)</code></td><td>为真</td></tr><tr><td><code>assertIn(a, b)</code></td><td>a 在 b 里</td></tr><tr><td><code>assertRaises(Error)</code></td><td>抛出指定异常</td></tr></tbody></table>\n<div class=\"callout\"><p>提示：最好的写测试时机是「刚写完函数」，因为这时你最清楚它应该做什么。</p></div>","example":{"title":"给函数配一组测试","code":"def level_of(score):\n    if score >= 90:\n        return \"优秀\"\n    if score >= 60:\n        return \"及格\"\n    return \"不及格\"\n\nassert level_of(100) == \"优秀\"\nassert level_of(90) == \"优秀\"\nassert level_of(89) == \"及格\"\nassert level_of(60) == \"及格\"\nassert level_of(59) == \"不及格\"\nassert level_of(0) == \"不及格\"\n\nprint(\"6 条断言全部通过\")","stdin":[],"explain":"边界值（90、60）最容易写错，所以专门测了 90 和 89、60 和 59 这两对。","runnable":true,"notes":[]},"exercises":[{"title":"练习：写一个能通过测试的函数","task":"<p>实现 <code>average(nums)</code>：</p>\n<ul><li>列表为空时返回 <code>None</code></li><li>否则返回平均值</li></ul>","starter":"def average(nums):\n    if not nums:\n        # 空列表返回 None\n    # 返回平均值\n","stdin":[],"check":{"type":"test","code":"assert average([]) is None, \"空列表应该返回 None\"\nassert average([10]) == 10, \"只有一个元素时平均值是它自己\"\nassert average([1, 2, 3]) == 2, \"平均值算错了\"\nassert abs(average([88, 92, 79]) - 86.33333333333333) < 1e-9, \"三位数的平均值不对（直接返回 sum/len 即可）\""},"hint":"先写 if not nums: return None，然后 return sum(nums) / len(nums)。","walkthrough":[],"solution":"def average(nums):\n    if not nums:\n        return None\n    return sum(nums) / len(nums)"}],"quiz":{"q":"unittest 会自动运行哪些测试方法？","options":["名字以 test 开头的","所有方法","名字里有 check 的","被 @test 装饰的"],"answer":0,"explain":"unittest 默认查找名字以 test 开头的方法。"},"localOnly":false},{"id":"c12l3","title":"Git：给代码装上时间机器","chapter_title":"第 12 章 · 走向独立开发","chapter_id":"c12","minutes":15,"level":"进阶","goal":"理解版本管理，记住最常用的几个 Git 命令。","theory":"<h3>为什么需要 Git</h3>\n<ul><li>改坏了能回到上一个能跑的版本。</li><li>记录每次改了什么、为什么改。</li><li>多人协作不互相覆盖。</li><li>传到 GitHub 就是你的作品集。</li></ul>\n<h3>一次性配置</h3>\n<pre class=\"snippet\"><code>git config --global user.name \"你的名字\"\ngit config --global user.email \"你的邮箱\"</code></pre>\n<h3>最常用的六条命令</h3>\n<pre class=\"snippet\"><code>git init                          把当前目录变成 Git 仓库\ngit status                        看有哪些改动\ngit add .                         把改动加入待提交\ngit commit -m \"说明这次改了什么\"    提交，形成一次记录\ngit log --oneline                 看提交历史\ngit diff                          看具体改了什么</code></pre>\n<h3>忽略不该提交的东西：.gitignore</h3>\n<pre class=\"snippet\"><code>.venv/\n__pycache__/\n*.log\ndata.json</code></pre>\n<p>虚拟环境、缓存、日志、私人数据都不要提交。</p>\n<h3>推到 GitHub</h3>\n<pre class=\"snippet\"><code>git remote add origin https://github.com/用户名/仓库名.git\ngit branch -M main\ngit push -u origin main</code></pre>\n<p>以后改完再推：</p>\n<pre class=\"snippet\"><code>git add .\ngit commit -m \"新增记账功能\"\ngit push</code></pre>\n<h3>提交信息怎么写</h3>\n<p>好：<code>修复平均分为空时崩溃的问题</code></p>\n<p>不好：<code>update</code>、<code>修改</code>、<code>111</code></p>\n<div class=\"callout warn\"><p>注意：不要在提交里放密码、密钥、身份证号。一旦推到公开仓库，即使后来删掉，也能从历史记录里翻出来。</p></div>","example":{"title":"示例：从零开始的 Git 流程（在终端里执行）","code":"# 这些是终端命令，不是 Python 代码，请逐条在命令行里执行\ncd myproject\ngit init\ngit status\ngit add .\ngit commit -m \"完成成绩统计功能\"\ngit log --oneline\n\n# 想撤销还没提交的改动\ngit restore 文件名\n\n# 想看看某个文件的每一行是谁改的\ngit blame 文件名","stdin":[],"explain":"把 Git 想成游戏的存档功能：commit 就是一次存档，随时可以读档。","runnable":false,"notes":[]},"exercises":[{"title":"练习：用 Python 生成 .gitignore","task":"<p>把三条常见规则写进 <code>gitignore.txt</code> 并读回来打印：</p>\n<pre class=\"snippet\"><code>.venv/\n__pycache__/\n*.log</code></pre>","starter":"# 用 Python 把这三条规则写进文件，再读回来打印","stdin":[],"check":{"type":"output","expect":".venv/\n__pycache__/\n*.log"},"hint":"写文件时每条规则后面加换行符；打印用 print(f.read(), end=\"\")。","walkthrough":[],"solution":"rules = [\".venv/\", \"__pycache__/\", \"*.log\"]\n\nwith open(\"gitignore.txt\", \"w\", encoding=\"utf-8\") as f:\n    for rule in rules:\n        f.write(rule + \"\\n\")\n\nwith open(\"gitignore.txt\", encoding=\"utf-8\") as f:\n    print(f.read(), end=\"\")"}],"quiz":{"q":"哪条命令会把改动记录成一次提交？","options":["git status","git add .","git commit -m \"说明\"","git push"],"answer":2,"explain":"add 是准备好改动，commit 才是真正记录一次提交，push 是把提交推到远程。"},"localOnly":false},{"id":"c12l4","title":"独立做一个项目的完整流程","chapter_title":"第 12 章 · 走向独立开发","chapter_id":"c12","minutes":18,"level":"综合","goal":"掌握从想法到成品的六步流程，知道卡住时该怎么办。","theory":"<h3>六步流程</h3>\n<p><strong>第 1 步：把需求写成一句话</strong></p>\n<p>「做一个能记录每日支出、并按项目汇总的记事本程序。」</p>\n<p><strong>第 2 步：拆成最小的功能清单</strong></p>\n<ul><li>能添加一条支出</li><li>能查看全部支出</li><li>能按项目汇总</li><li>能保存到文件</li></ul>\n<p><strong>第 3 步：先设计数据结构</strong></p>\n<pre class=\"snippet\"><code>records = [{\"date\": \"2026-01-01\", \"item\": \"午饭\", \"amount\": 25}]</code></pre>\n<p>数据结构想清楚，函数写起来会顺很多。</p>\n<p><strong>第 4 步：实现最小可用版本</strong></p>\n<p>只做「添加 + 查看」，能跑通就行。不要一开始就写菜单、颜色、导出。</p>\n<p><strong>第 5 步：加测试，再加功能</strong></p>\n<p>每加一个功能，先想「怎么验证它对」。写两行 assert 也算测试。</p>\n<p><strong>第 6 步：复盘</strong></p>\n<ul><li>哪一步卡了最久？下次怎么避免？</li><li>有没有重复代码可以抽成函数？</li><li>别人看得懂这些名字吗？</li></ul>\n<h3>卡住时的三个办法</h3>\n<ol><li><strong>缩小问题</strong>：把功能砍到一个最小例子，单独跑通它。</li><li><strong>搜报错原文</strong>：把错误信息的最后一行复制去搜，加上「Python」。</li><li><strong>查官方文档</strong>：搜「Python 官方文档 + 关键词」，比二手教程准确。</li></ol>\n<h3>选题建议</h3>\n<p>选<strong>你自己真的会用</strong>的东西：记账本、待办清单、背单词工具、按日期重命名照片、生日提醒、账单统计。</p>\n<h3>不要做的事</h3>\n<ul><li>一上来就做「大型管理系统」，三天后放弃。</li><li>边写边想新功能，永远做不完。</li><li>抄代码不看懂，改一个地方就崩。</li></ul>\n<div class=\"callout\"><p>提示：能运行的最小版本，胜过写了一半的完美设计。先让它跑起来。</p></div>","example":{"title":"最小可用版本：待办清单","code":"todos = []\n\ndef add(title):\n    todos.append({\"title\": title, \"done\": False})\n    return len(todos)\n\ndef finish(index):\n    if 0 <= index < len(todos):\n        todos[index][\"done\"] = True\n        return True\n    return False\n\ndef show():\n    for i, t in enumerate(todos, start=1):\n        mark = \"[x]\" if t[\"done\"] else \"[ ]\"\n        print(f\"{i}. {mark} {t['title']}\")\n\nadd(\"学函数\")\nadd(\"做练习\")\nfinish(0)\nshow()","stdin":[],"explain":"四十来行就是一个能用的程序。想加「删除」「截止日期」，在这个基础上加就行。","runnable":true,"notes":[]},"exercises":[{"title":"练习：给待办清单加统计","task":"<p>在 <code>todos</code> 上实现两个函数：</p>\n<ol><li><code>add(title)</code>：添加一条待办（<code>done</code> 为 False），返回当前总数</li><li><code>count_done()</code>：返回已完成的数量</li></ol>","starter":"todos = []\n\ndef add(title):\n    # 添加一条，返回总数\n\ndef count_done():\n    # 数一数有多少条已完成\n","stdin":[],"check":{"type":"test","code":"assert add(\"学函数\") == 1, \"添加第一条后返回 1\"\nassert add(\"做练习\") == 2, \"添加第二条后返回 2\"\nassert count_done() == 0, \"都还没完成\"\ntodos[0][\"done\"] = True\nassert count_done() == 1, \"完成一条之后应该是 1\"\ntodos[1][\"done\"] = True\nassert count_done() == 2, \"完成两条之后应该是 2\"\nassert todos[0][\"title\"] == \"学函数\", \"title 要存对\""},"hint":"add 里 todos.append({\"title\": title, \"done\": False}) 然后 return len(todos)；count_done 里用 sum(1 for t in todos if t[\"done\"])。","walkthrough":[],"solution":"todos = []\n\ndef add(title):\n    todos.append({\"title\": title, \"done\": False})\n    return len(todos)\n\ndef count_done():\n    return sum(1 for t in todos if t[\"done\"])"}],"quiz":{"q":"做项目时，最推荐的起步方式是？","options":["先实现能跑通的最小版本","先把所有功能设计完整再动手","直接抄一个完整的项目","先学完所有语法"],"answer":0,"explain":"最小可用版本能最快给你反馈，后面每个功能都在能跑的代码上加。"},"localOnly":false},{"id":"c12l5","title":"结业大作业与下一步","chapter_title":"第 12 章 · 走向独立开发","chapter_id":"c12","minutes":20,"level":"综合","goal":"独立完成一个综合项目，并规划学完之后的路。","theory":"<h3>三个可选的结业项目</h3>\n<p><strong>项目 A：命令行通讯录</strong></p>\n<ul><li>添加联系人（姓名、电话、城市）</li><li>按姓名查找、按城市筛选、删除联系人</li><li>数据保存到 <code>contacts.json</code>，下次打开还在</li><li>验收：添加三个人 → 关掉程序 → 重新运行 → 数据还在</li></ul>\n<p><strong>项目 B：成绩分析器</strong></p>\n<ul><li>从 <code>scores.csv</code> 读成绩</li><li>输出平均分、最高分、最低分、及格率</li><li>按分数从高到低生成 <code>ranking.txt</code></li><li>验收：换一份新的 CSV 也能正常运行</li></ul>\n<p><strong>项目 C：文本处理小工具</strong></p>\n<ul><li>读入一段文本或一个 txt 文件</li><li>统计字符数、单词数、出现最多的 5 个词</li><li>把结果写成 <code>report.json</code></li><li>验收：中文和英文都能处理</li></ul>\n<h3>做完之后的自我检查清单</h3>\n<ul><li>函数名看得懂吗？有没有超过 50 行的函数？</li><li>边界情况试过吗（空数据、错误格式）？</li><li>出错了会不会直接崩溃？有没有用 try/except 兜住？</li><li>有没有写两行 assert 自测？</li><li>README 里写清楚「怎么运行」了吗？</li><li>提交到 Git 了吗？</li></ul>\n<h3>学完之后往哪走</h3>\n<table><thead><tr><th>方向</th><th>下一步学什么</th><th>适合想做什么的人</th></tr></thead><tbody><tr><td>数据处理</td><td>pandas、numpy、matplotlib</td><td>分析表格、画图、做报表</td></tr><tr><td>网页开发</td><td>Flask / FastAPI</td><td>做网站、写接口服务</td></tr><tr><td>自动化办公</td><td>openpyxl、python-docx</td><td>替代重复的手工操作</td></tr><tr><td>爬虫与接口</td><td>requests、BeautifulSoup</td><td>采集公开数据</td></tr><tr><td>算法与面试</td><td>数据结构、LeetCode 简单题</td><td>想进大厂或做底层</td></tr><tr><td>人工智能</td><td>numpy → scikit-learn → 深度学习</td><td>对 AI 感兴趣</td></tr></tbody></table>\n<h3>长期有效的三条</h3>\n<ol><li><strong>每天写一点</strong>：20 分钟胜过周末突击 5 小时。</li><li><strong>做给自己用的东西</strong>：有真实需求，你才会坚持把 bug 修完。</li><li><strong>看懂再抄</strong>：抄完自己重写一遍，那才算学会。</li></ol>\n<div class=\"callout\"><p>提示：你现在已经会输入输出、判断循环、数据结构、函数、类、异常、文件、JSON/CSV、正则、测试和 Git——这是一个能独立写小工具的完整基础，剩下的是拿去用。</p></div>","example":{"title":"结业示范：最简版通讯录","code":"import json\n\ncontacts = {\n    \"小明\": {\"phone\": \"13800000001\", \"city\": \"杭州\"},\n    \"小红\": {\"phone\": \"13900000002\", \"city\": \"上海\"},\n}\n\ndef add(name, phone, city):\n    contacts[name] = {\"phone\": phone, \"city\": city}\n    return contacts[name]\n\ndef find(name):\n    return contacts.get(name)\n\ndef in_city(city):\n    return [name for name, info in contacts.items() if info[\"city\"] == city]\n\ndef save(path=\"contacts.json\"):\n    with open(path, \"w\", encoding=\"utf-8\") as f:\n        json.dump(contacts, f, ensure_ascii=False, indent=2)\n\nadd(\"小刚\", \"13700000003\", \"杭州\")\nprint(find(\"小明\"))\nprint(in_city(\"杭州\"))\nsave()\n\nwith open(\"contacts.json\", encoding=\"utf-8\") as f:\n    loaded = json.load(f)\nprint(f\"文件里一共 {len(loaded)} 位联系人\")","stdin":[],"explain":"字典 + 函数 + JSON 保存，这就是一个完整小项目的骨架。试着加上「删除」和「按城市排序」。","runnable":true,"notes":[]},"exercises":[{"title":"毕业小测：通讯录的三个函数","task":"<p>实现三个函数：</p>\n<ol><li><code>add_contact(name, phone)</code>：把联系人存进字典并返回联系人信息</li><li><code>find_contact(name)</code>：找到就返回电话，找不到返回 <code>None</code></li><li><code>delete_contact(name)</code>：删除成功返回 True，不存在返回 False</li></ol>","starter":"contacts = {}\n\ndef add_contact(name, phone):\n    # 存进 contacts 并返回联系人信息\n\ndef find_contact(name):\n    # 返回电话或 None\n\ndef delete_contact(name):\n    # 删得掉返回 True\n","stdin":[],"check":{"type":"test","code":"add_contact(\"小明\", \"13800000001\")\nassert contacts[\"小明\"][\"phone\"] == \"13800000001\", \"联系人应该存进字典\"\nassert find_contact(\"小明\") == \"13800000001\", \"find_contact 应该返回电话\"\nassert find_contact(\"小王\") is None, \"找不到时返回 None\"\nassert delete_contact(\"小王\") is False, \"删除不存在的联系人返回 False\"\nassert delete_contact(\"小明\") is True, \"删除成功返回 True\"\nassert \"小明\" not in contacts, \"删除后字典里不应该还有他\"\nassert add_contact(\"小红\", \"13900000002\")[\"phone\"] == \"13900000002\", \"add_contact 要返回联系人信息\""},"hint":"add_contact 里 contacts[name] = {\"phone\": phone} 然后 return contacts[name]；find_contact 用 contacts.get(name) 取出信息再取 phone；delete_contact 先判断 name in contacts。","walkthrough":[],"solution":"contacts = {}\n\ndef add_contact(name, phone):\n    contacts[name] = {\"phone\": phone}\n    return contacts[name]\n\ndef find_contact(name):\n    info = contacts.get(name)\n    if info is None:\n        return None\n    return info[\"phone\"]\n\ndef delete_contact(name):\n    if name in contacts:\n        del contacts[name]\n        return True\n    return False"}],"quiz":{"q":"结业之后，最有效的继续进步方式是？","options":["做自己真正会用的小项目，遇到问题就查文档和搜索","把 12 章的语法再背三遍","等学完所有高级语法再动手","只看视频，不写代码"],"answer":0,"explain":"真实需求会带来真实问题，解决问题的能力才是编程的核心。"},"localOnly":false}]}],"reference":[{"group":"输出与输入","items":[{"syntax":"print(\"你好\")","desc":"输出内容","example":"print(\"你好\", \"世界\")"},{"syntax":"print(a, b, sep=\"-\")","desc":"用指定符号分隔多个内容","example":"print(\"2026\", \"01\", \"01\", sep=\"-\")"},{"syntax":"print(\"加载中\", end=\"...\")","desc":"结尾不换行","example":"print(\"A\", end=\"\"); print(\"B\")"},{"syntax":"input(\"提示语\")","desc":"读入一行文字，结果永远是字符串","example":"name = input(\"名字：\")"},{"syntax":"n = int(input(\"数字：\"))","desc":"读一个整数（要算数必须这样转换）","example":"age = int(input(\"年龄：\"))"},{"syntax":"x = float(input(\"小数：\"))","desc":"读一个小数","example":"price = float(input(\"价格：\"))"},{"syntax":"两次 input()","desc":"按顺序读：第 1 行给第 1 次，第 2 行给第 2 次","example":"name = input()\nage = input()"},{"syntax":"f\"{变量}\"","desc":"把变量写进字符串（推荐）","example":"print(f\"你好{name}\")"}]},{"group":"变量与类型","items":[{"syntax":"x = 10","desc":"赋值","example":"count = 0"},{"syntax":"a, b = 1, 2","desc":"一次赋多个值","example":"x, y = 3, 5"},{"syntax":"int(x) / float(x) / str(x)","desc":"类型转换","example":"age = int(\"18\")"},{"syntax":"type(x)","desc":"查看类型","example":"print(type(3))"},{"syntax":"x += 1","desc":"在自己基础上加一（复合赋值）","example":"count += 1"},{"syntax":"len(x)","desc":"长度（字符数、元素个数）","example":"len('abc')  # 3"},{"syntax":"True / False","desc":"真假值","example":"is_ok = True"}]},{"group":"运算","items":[{"syntax":"+ - * /","desc":"加减乘除，除法得到小数","example":"10 / 4  # 2.5"},{"syntax":"//","desc":"整除，只要整数部分","example":"10 // 4  # 2"},{"syntax":"%","desc":"取余数","example":"10 % 4  # 2"},{"syntax":"**","desc":"幂运算","example":"2 ** 10  # 1024"},{"syntax":"round(x, n)","desc":"四舍五入保留 n 位","example":"round(3.14159, 2)"},{"syntax":"f\"{x:.2f}\"","desc":"输出时保留两位小数","example":"f\"{3.14159:.2f}\"  # 3.14"},{"syntax":"max() / min() / sum()","desc":"最大、最小、求和","example":"sum([1, 2, 3])  # 6"}]},{"group":"判断","items":[{"syntax":"== != > < >= <=","desc":"比较，结果是 True 或 False","example":"3 >= 3  # True"},{"syntax":"if 条件:","desc":"条件成立才执行","example":"if age >= 18: print(\"成年\")"},{"syntax":"elif 条件:","desc":"继续判断下一个条件","example":"elif score >= 60: ..."},{"syntax":"else:","desc":"其他情况","example":"else: print('不及格')"},{"syntax":"and / or / not","desc":"并且、或者、取反","example":"if a > 0 and b > 0: ..."},{"syntax":"x in 容器","desc":"判断是否包含","example":"if '小明' in names: ..."},{"syntax":"值1 if 条件 else 值2","desc":"一行版判断表达式","example":"mark = \"及格\" if s >= 60 else \"不及格\""}]},{"group":"循环","items":[{"syntax":"while 条件:","desc":"条件成立就一直重复","example":"while n > 0: n -= 1"},{"syntax":"for i in range(n):","desc":"重复 n 次（0 到 n-1）","example":"for i in range(3): print(i)"},{"syntax":"range(起, 止, 步长)","desc":"产生一串数字，含头不含尾","example":"range(1, 10, 2)"},{"syntax":"for x in 列表:","desc":"遍历每个元素","example":"for s in scores: print(s)"},{"syntax":"enumerate(列表)","desc":"同时拿到下标和元素","example":"for i, s in enumerate(scores): ..."},{"syntax":"break / continue","desc":"跳出循环 / 跳过本轮","example":"if x == 0: break"},{"syntax":"while True:","desc":"配合 break 使用，别忘跳出","example":"while True: ... break"}]},{"group":"列表","items":[{"syntax":"[1, 2, 3]","desc":"创建列表","example":"fruits = [\"苹果\", \"香蕉\"]"},{"syntax":"列表[0] / 列表[-1]","desc":"取第一个 / 最后一个","example":"fruits[-1]"},{"syntax":"列表[1:3]","desc":"切片，含头不含尾","example":"[1, 2, 3, 4][1:3]  # [2, 3]"},{"syntax":".append(x)","desc":"末尾添加","example":"todo.append('运动')"},{"syntax":".insert(i, x) / .remove(x) / .pop()","desc":"插入 / 按内容删 / 弹出","example":"todo.remove('买菜')"},{"syntax":".sort(reverse=True)","desc":"原地排序，可反向","example":"scores.sort()"},{"syntax":"len / sum / max / min","desc":"统计常用函数","example":"sum(scores)"},{"syntax":"[x for x in 列表 if 条件]","desc":"列表推导式（进阶但省事）","example":"[s for s in scores if s >= 60]"}]},{"group":"字典","items":[{"syntax":"{\"键\": 值}","desc":"创建字典","example":"student = {\"name\": \"小明\", \"age\": 18}"},{"syntax":"d[\"键\"] / d.get(\"键\")","desc":"取值（get 更安全）","example":"d.get(\"score\", 0)"},{"syntax":"d[\"新键\"] = 值","desc":"新增或修改","example":"d[\"city\"] = \"杭州\""},{"syntax":"del d[\"键\"]","desc":"删除","example":"del d[\"city\"]"},{"syntax":"for k, v in d.items():","desc":"同时遍历键和值","example":"for k, v in d.items(): print(k, v)"},{"syntax":"counts.get(w, 0) + 1","desc":"计数惯用写法","example":"counts[w] = counts.get(w, 0) + 1"},{"syntax":"sorted(d.items(), key=...)","desc":"按键或值排序","example":"sorted(d.items(), key=lambda kv: kv[1], reverse=True)"}]},{"group":"字符串","items":[{"syntax":"s.split(\",\")","desc":"按分隔符拆成列表","example":"\"a,b,c\".split(\",\")"},{"syntax":"\", \".join(列表)","desc":"把字符串列表拼起来","example":"\", \".join([\"a\", \"b\"])"},{"syntax":"s.strip()","desc":"去掉两头空白","example":"\"  hi  \".strip()"},{"syntax":"s.replace(旧, 新)","desc":"替换","example":"\"a-b\".replace(\"-\", \"_\")"},{"syntax":"s.upper() / s.lower()","desc":"全大写 / 全小写","example":"\"Py\".lower()"},{"syntax":"s.count(子串) / s.find(子串)","desc":"出现次数 / 位置","example":"\"abcabc\".count(\"a\")"},{"syntax":"s[0] / s[:3]","desc":"取字符 / 取前三个","example":"\"Python\"[0]"}]},{"group":"函数","items":[{"syntax":"def 名字(参数):","desc":"定义函数","example":"def area(w, h):\n    return w * h"},{"syntax":"return 值","desc":"把结果交回调用处","example":"return total"},{"syntax":"def f(x, y=1):","desc":"默认参数","example":"def greet(name, hi=\"你好\"): ..."},{"syntax":"f(x, y=2)","desc":"关键字参数，顺序随意","example":"order(\"奶茶\", count=3)"},{"syntax":"a, b = 函数()","desc":"接收多个返回值","example":"low, high = min_max(nums)"},{"syntax":"lambda x: x * 2","desc":"匿名小函数，常配合排序","example":"sorted(scores, key=lambda s: s[1])"},{"syntax":"global x","desc":"在函数里修改全局变量（少用）","example":"global total"}]},{"group":"模块、错误与文件","items":[{"syntax":"import math","desc":"导入模块","example":"math.sqrt(16)"},{"syntax":"import random","desc":"随机数","example":"random.randint(1, 6)"},{"syntax":"from math import sqrt","desc":"只导入需要的东西","example":"sqrt(9)"},{"syntax":"try: ... except 错误:","desc":"兜住可能出错的操作","example":"try:\n    n = int(x)\nexcept ValueError:\n    print(\"不是数字\")"},{"syntax":"with open(\"f.txt\", \"w\", encoding=\"utf-8\") as f:","desc":"写文件（自动关闭）","example":"f.write(\"内容\\n\")"},{"syntax":"with open(\"f.txt\", encoding=\"utf-8\") as f:","desc":"读文件","example":"print(f.read())"},{"syntax":"for line in f:","desc":"按行读取（大文件推荐）","example":"print(line.strip())"}]}],"faq":[{"q":"代码里的 input() 要用哪个框给它输入？","a":"用代码框上方那个标着「输入」的小框。程序每执行一次 input()，就按顺序从这个框里读一行（用回车分隔）。比如代码里有两个 input()，就在框里写两行：第一行是第一个问题的答案，第二行是第二个问题的答案，填完再点「运行」。如果框里是空的，程序会报 EOFError，意思是「还需要输入，但没有内容了」。练习题的输入框里已经帮你填好了，可以直接改；想从头学可以看第 1 章第 7 课《input：让程序听你说话》。"},{"q":"点了运行没反应，一直显示「正在下载 Python 引擎」怎么办？","a":"第一次运行需要联网下载约 10MB 的 Python 引擎，等几秒即可，之后浏览器会缓存。如果一直失败，请检查网络；或者双击同一文件夹里的 start-learning-platform.bat，它会先启动一个本地服务器再打开网页，成功率更高。"},{"q":"我的学习进度和代码会保存吗？","a":"会。进度和你在每个代码框里写的内容都保存在浏览器的本地存储里，关掉网页再打开还在。但清除浏览器数据、换浏览器或换电脑就没了，重要的代码记得自己复制出去。"},{"q":"不小心写出死循环，页面卡住了怎么办？","a":"按 F5 或 Ctrl+R 刷新页面。你刚才写的代码会自动恢复，进度也不会丢。以后写 while 时，先确认循环体里有让条件变化的那一行。"},{"q":"这些语法需要背下来吗？","a":"不需要。用「速查表」随时查，写多了自然就记住了。真正需要练的是「把问题拆成步骤」的能力。"},{"q":"要学多久才能算入门？","a":"按每天 40~60 分钟算，六周左右能完整过一遍（平台里的「学习计划」页有详细安排）。建议第一遍别追求全懂，先把每节课的练习做出来，第二遍回头再补细节，你会发现轻松很多。"},{"q":"怎么在自己的电脑上写 Python？","a":"你的电脑已经装好了 Python 3.12。可以打开「开始菜单」搜索 Python 找 IDLE，或者装一个 VS Code 写代码。在本地跑的好处是文件能真正保存到硬盘，而且不需要联网。"},{"q":"练习实在做不出来怎么办？","a":"先点「提示」，再照着提示写一遍；还是不行就点「看答案」，把答案抄下来逐行读懂，然后关掉答案，凭记忆重新写一遍。卡住超过 15 分钟就不要硬熬。"}],"glossary":[{"term":"算法","en":"algorithm","desc":"解决问题的固定步骤。同一道题可以有很多种算法。","lesson":"c10l1"},{"term":"查找","en":"search","desc":"在数据里找目标。线性查找逐个看，二分查找必须有序。","lesson":"c10l3"},{"term":"二分查找","en":"binary search","desc":"在有序数据里每次砍掉一半来找目标，速度极快。","lesson":"c10l3"},{"term":"排序","en":"sort","desc":"把数据按大小或规则重新排列。","lesson":"c10l3"},{"term":"递归","en":"recursion","desc":"函数调用自己。必须有终止条件，否则会报 RecursionError。","lesson":"c10l4"},{"term":"基准情况","en":"base case","desc":"递归里不再继续调用自己的条件，用来结束递归。","lesson":"c10l4"},{"term":"复杂度","en":"complexity","desc":"粗略描述代码随数据量增长的快慢，如 O(1)、O(n)、O(n²)。","lesson":"c10l5"},{"term":"空间复杂度","en":"space complexity","desc":"粗略描述代码额外占用内存随数据量增长的速度。","lesson":"c10l5"},{"term":"时间复杂度","en":"time complexity","desc":"粗略描述代码运行时间随数据量增长的速度，如 O(n)。","lesson":"c10l5"},{"term":"格式化","en":"formatting","desc":"把日期、数字或文本变成指定样式的字符串。","lesson":"c11l1"},{"term":"日期对象","en":"date object","desc":"表示某一天的对象，比如 date(2026, 1, 1)。","lesson":"c11l1"},{"term":"时间戳","en":"timestamp","desc":"用一个数字表示某个时间点，常表示从 1970-01-01 起经过的秒数。","lesson":"c11l1"},{"term":"时区","en":"timezone","desc":"不同地区使用的时间标准，比如 Asia/Shanghai。","lesson":"c11l1"},{"term":"元字符","en":"metacharacter","desc":"正则里有特殊含义的符号，比如 \\d、\\w、.、+。","lesson":"c11l2"},{"term":"正则表达式","en":"regular expression","desc":"描述文本匹配规则的式子，用来查找、提取、替换文本。","lesson":"c11l2"},{"term":"分组","en":"group","desc":"正则里的括号 ()，可以把匹配到的一部分单独取出来。","lesson":"c11l3"},{"term":"环境变量","en":"environment variable","desc":"操作系统保存的配置值，常用来放密码、密钥等不该写死在代码里的信息。","lesson":"c11l5"},{"term":"邮件自动化","en":"email automation","desc":"用程序自动发送、整理或回复邮件。","lesson":"c11l5"},{"term":"Excel","en":"Excel","desc":"常用的表格软件，.xlsx 是它的文件格式。","lesson":"c11l5"},{"term":"Word","en":"Word","desc":"常用的文档软件，.docx 是它的文件格式。","lesson":"c11l5"},{"term":"包管理器","en":"package manager","desc":"负责安装、升级和删除第三方库的工具，Python 常用 pip。","lesson":"c12l1"},{"term":"标准库","en":"standard library","desc":"Python 自带的工具箱，不用安装就能 import 使用。","lesson":"c12l1"},{"term":"第三方库","en":"third-party library","desc":"别人写好、需要额外安装的库，比如 requests、pandas。","lesson":"c12l1"},{"term":"命令行","en":"command line","desc":"用文字命令操作电脑的界面，比如 PowerShell、终端。","lesson":"c12l1"},{"term":"虚拟环境","en":"virtual environment","desc":"给项目单独准备的依赖空间，避免项目之间打架。","lesson":"c12l1"},{"term":"依赖","en":"dependency","desc":"你的项目运行所需要的其他库或工具。","lesson":"c12l1"},{"term":"终端","en":"terminal","desc":"输入命令行命令的窗口。pip install 要在这里执行。","lesson":"c12l1"},{"term":"pip","en":"pip","desc":"Python 的包管理器，用命令行安装第三方库。","lesson":"c12l1"},{"term":"测试","en":"test","desc":"用代码验证代码是否正确，改完能立刻发现有没有改坏。","lesson":"c12l2"},{"term":"单元测试","en":"unit test","desc":"针对一个函数或一小块功能写的自动测试。","lesson":"c12l2"},{"term":"断言","en":"assert","desc":"在代码里写一条必须成立的条件，不成立就立刻报错。","lesson":"c12l2"},{"term":"版本管理","en":"version control","desc":"记录代码每一次改动，随时能回到过去，Git 是最常用的工具。","lesson":"c12l3"},{"term":"版本控制","en":"version control","desc":"记录代码每一次改动，随时能回到过去，Git 是最常用的工具。","lesson":"c12l3"},{"term":"仓库","en":"repository","desc":"被 Git 管理的项目文件夹，简称 repo。","lesson":"c12l3"},{"term":"分支","en":"branch","desc":"从主线分出来的一条独立开发线，用来试新功能而不影响主线。","lesson":"c12l3"},{"term":"合并","en":"merge","desc":"把一条分支上的改动并回另一条分支。","lesson":"c12l3"},{"term":"提交","en":"commit","desc":"把一批改动记录成一次存档，附上一句说明。","lesson":"c12l3"},{"term":"重构数据结构","en":"data structure","desc":"数据在程序里怎么摆：列表、字典、集合、类各有适用场景。","lesson":"c12l4"},{"term":"边界条件","en":"edge case","desc":"极端或特殊输入，比如空列表、0、空字符串、格式错误。","lesson":"c12l5"},{"term":"接口","en":"API","desc":"程序之间约定的沟通方式。很多网站提供 API 让你取数据。","lesson":"c12l5"},{"term":"爬虫","en":"web scraping","desc":"用程序自动访问网页并提取公开数据。","lesson":"c12l5"},{"term":"人工智能","en":"AI","desc":"让计算机完成识别、理解、生成等智能任务的领域。","lesson":"c12l5"},{"term":"数据科学","en":"data science","desc":"用程序分析数据、找规律、做预测的领域。","lesson":"c12l5"},{"term":"API","en":"Application Programming Interface","desc":"程序之间约定的沟通方式。很多网站提供 API 让你取数据。","lesson":"c12l5"},{"term":"解释器","en":"interpreter","desc":"负责读你的代码并逐行执行的程序。Python 自带的就是解释器。","lesson":"c1l1"},{"term":"输出","en":"output","desc":"程序显示给用户看的结果，常用 print()。","lesson":"c1l1"},{"term":"语句","en":"statement","desc":"程序里一条可执行的指令，比如 print(\"你好\")。","lesson":"c1l1"},{"term":"缩进","en":"indentation","desc":"行首的空格。Python 用它表示代码的层级关系，标准是 4 个空格。","lesson":"c1l3"},{"term":"语法","en":"syntax","desc":"一门语言的书写规则。写错规则会报 SyntaxError。","lesson":"c1l3"},{"term":"注释","en":"comment","desc":"给人类看的说明，Python 会忽略。单行注释用 #。","lesson":"c1l3"},{"term":"变量","en":"variable","desc":"存数据的名字，像一个贴了标签的盒子。","lesson":"c1l4"},{"term":"赋值","en":"assignment","desc":"把右边的值放进左边的变量，用 = 表示。","lesson":"c1l4"},{"term":"表达式","en":"expression","desc":"能算出一个值的写法，比如 1 + 2、name.upper()。","lesson":"c1l5"},{"term":"浮点数","en":"float","desc":"带小数点的数字，比如 3.14。计算时可能出现 110.00000000000001 这种尾巴。","lesson":"c1l5"},{"term":"运算符","en":"operator","desc":"表示运算的符号，比如 +、-、*、/、==、and。","lesson":"c1l5"},{"term":"整数","en":"int","desc":"不带小数点的数字，比如 3、-10。","lesson":"c1l5"},{"term":"字符串","en":"str","desc":"一段文字，用引号包起来。","lesson":"c1l6"},{"term":"f-string","en":"formatted string","desc":"在引号前加 f，用花括号把变量嵌进文字里。","lesson":"c1l6"},{"term":"输入","en":"input","desc":"用户交给程序的数据，常用 input() 读取。","lesson":"c1l7"},{"term":"类型转换","en":"type conversion","desc":"在 int、float、str 之间互转，比如 int(\"18\")。","lesson":"c1l8"},{"term":"假值","en":"falsy","desc":"在 if 或 while 里会被当成 False 的值，如 0、空字符串、空列表。","lesson":"c2l1"},{"term":"真值","en":"truthy","desc":"在 if 或 while 里会被当成 True 的值。","lesson":"c2l1"},{"term":"条件判断","en":"conditional","desc":"用 if / elif / else 让程序根据不同情况做不同的事。","lesson":"c2l2"},{"term":"布尔运算","en":"boolean operation","desc":"用 and、or、not 组合真假值的运算。","lesson":"c2l3"},{"term":"短路求值","en":"short-circuit evaluation","desc":"and/or 会在结果已经确定时停止继续计算。","lesson":"c2l3"},{"term":"死循环","en":"infinite loop","desc":"条件永远成立、停不下来的循环。要检查循环变量有没有变化。","lesson":"c2l4"},{"term":"条件循环","en":"while loop","desc":"只要条件成立就反复执行，常用 while。","lesson":"c2l4"},{"term":"无限循环","en":"infinite loop","desc":"条件永远为真、停不下来的循环，通常要检查退出条件。","lesson":"c2l4"},{"term":"循环","en":"loop","desc":"让一段代码重复执行，Python 里是 while 和 for。","lesson":"c2l4"},{"term":"嵌套循环","en":"nested loop","desc":"循环里面还有循环，常用于处理表格或二维数据。","lesson":"c2l5"},{"term":"循环变量","en":"loop variable","desc":"for 循环每轮自动拿到的当前元素，比如 for x in nums 里的 x。","lesson":"c2l5"},{"term":"列表","en":"list","desc":"一排有序的格子，用方括号，可以增删改。","lesson":"c3l1"},{"term":"切片","en":"slice","desc":"一次取出一段内容，写法是 [开始:结束]，含头不含尾。","lesson":"c3l1"},{"term":"下标","en":"index","desc":"元素的位置编号，从 0 开始。负数表示从后往前数。","lesson":"c3l1"},{"term":"序列","en":"sequence","desc":"按顺序排列、可以用索引访问的数据，如字符串、列表、元组。","lesson":"c3l1"},{"term":"索引","en":"index","desc":"列表里每个位置对应的编号，从 0 开始。","lesson":"c3l2"},{"term":"遍历","en":"iterate","desc":"挨个访问容器里的每个元素。","lesson":"c3l3"},{"term":"键值对","en":"key-value pair","desc":"字典里的「名字 → 内容」结构。","lesson":"c3l4"},{"term":"字典","en":"dict","desc":"用键值对存数据，用名字查内容。","lesson":"c3l4"},{"term":"不可变对象","en":"immutable object","desc":"创建后不能修改内容的对象，如字符串、数字、元组。","lesson":"c3l5"},{"term":"哈希","en":"hash","desc":"把数据变成固定长度的值，字典和集合用它快速查找。","lesson":"c3l5"},{"term":"集合","en":"set","desc":"用花括号，自动去重，查找极快，还能做交集并集。","lesson":"c3l5"},{"term":"可变对象","en":"mutable object","desc":"创建后还能修改内容的对象，如列表、字典、集合。","lesson":"c3l5"},{"term":"元组","en":"tuple","desc":"用圆括号，创建后不能修改，适合表示固定的一组数据。","lesson":"c3l5"},{"term":"字符串方法","en":"string method","desc":"字符串自带的操作，如 .split()、.strip()、.replace()。","lesson":"c3l6"},{"term":"参数","en":"parameter","desc":"函数定义里的占位名字；调用时传进去的值叫实参。","lesson":"c4l1"},{"term":"返回值","en":"return value","desc":"函数用 return 交回给调用者的结果。没写 return 时返回 None。","lesson":"c4l1"},{"term":"函数","en":"function","desc":"给一段代码起个名字，方便重复使用。","lesson":"c4l1"},{"term":"默认参数","en":"default argument","desc":"函数定义时给参数预设一个默认值，调用时不传也能用。","lesson":"c4l2"},{"term":"位置参数","en":"positional argument","desc":"按顺序传给函数的参数。","lesson":"c4l2"},{"term":"作用域","en":"scope","desc":"变量的有效范围。函数内部定义的变量出了函数就没了。","lesson":"c4l3"},{"term":"库","en":"library","desc":"别人写好的一堆代码，导入就能用。标准库自带，第三方库要 pip 安装。","lesson":"c4l4"},{"term":"捕获","en":"catch / except","desc":"用 try/except 接住异常，让程序不崩溃。","lesson":"c5l1"},{"term":"回溯信息","en":"traceback","desc":"报错时打印的一整段信息，最后一行是错误类型和原因。","lesson":"c5l1"},{"term":"抛出异常","en":"raise","desc":"主动报告一个错误，让上层代码知道这里出问题了。","lesson":"c5l1"},{"term":"异常","en":"exception","desc":"程序运行时出的错，比如 ValueError、TypeError。","lesson":"c5l1"},{"term":"异常处理","en":"exception handling","desc":"用 try/except 提前接住可能出错的代码，避免程序直接崩溃。","lesson":"c5l1"},{"term":"上下文管理器","en":"context manager","desc":"用 with 管理资源，结束后自动关闭文件或释放资源。","lesson":"c5l2"},{"term":"文件句柄","en":"file handle","desc":"打开文件后得到的对象，用它来读或写文件。","lesson":"c5l2"},{"term":"文件模式","en":"file mode","desc":"打开文件时的模式，如 r 只读、w 覆盖写、a 追加。","lesson":"c5l2"},{"term":"列表推导式","en":"list comprehension","desc":"一行生成列表的写法，比如 [x * x for x in nums]。","lesson":"c7l1"},{"term":"推导式","en":"comprehension","desc":"一行生成列表、字典或集合的写法，比如 [x * x for x in nums]。","lesson":"c7l1"},{"term":"迭代器","en":"iterator","desc":"可以一个一个吐出数据的对象，for 循环就是靠它工作。","lesson":"c7l2"},{"term":"集合推导式","en":"set comprehension","desc":"一行生成集合的写法，比如 {x for x in nums}。","lesson":"c7l2"},{"term":"生成器","en":"generator","desc":"用 yield 一次产出一个值的函数，省内存，适合处理大量数据。","lesson":"c7l2"},{"term":"生成器表达式","en":"generator expression","desc":"像列表推导式，但用圆括号，按需生成值。","lesson":"c7l2"},{"term":"字典推导式","en":"dict comprehension","desc":"一行生成字典的写法，比如 {k: v for k, v in items}。","lesson":"c7l2"},{"term":"关键字参数","en":"**kwargs","desc":"让函数接收任意数量的关键字参数，打包成字典。","lesson":"c7l3"},{"term":"解包","en":"unpacking","desc":"把列表、元组或字典里的元素拆出来，比如 a, b = [1, 2]。","lesson":"c7l3"},{"term":"可变参数","en":"*args","desc":"让函数接收任意数量的位置参数，打包成元组。","lesson":"c7l3"},{"term":"匿名函数","en":"lambda","desc":"没有名字的小函数，常配合排序的 key 使用。","lesson":"c7l4"},{"term":"排序键","en":"key","desc":"告诉排序函数「按什么排」，例如 key=len、key=lambda x: x[1]。","lesson":"c7l4"},{"term":"lambda","en":"anonymous function","desc":"用完就扔的小函数，常配合排序的 key 使用。","lesson":"c7l4"},{"term":"包","en":"package","desc":"装模块的文件夹，通常带一个 __init__.py。","lesson":"c7l5"},{"term":"模块","en":"module","desc":"一个 .py 文件就是一个模块，可以被别的文件导入使用。","lesson":"c7l5"},{"term":"调试","en":"debug","desc":"找出并修掉 bug 的过程。常用手段：打印变量、缩小范围、写断言。","lesson":"c7l6"},{"term":"重构","en":"refactor","desc":"不改变功能，只把代码改得更清楚、更好维护。","lesson":"c7l6"},{"term":"布尔值","en":"bool","desc":"只有 True 和 False 两个值，用来表示成立与不成立。","lesson":"c8l1"},{"term":"对象","en":"object / instance","desc":"按类做出来的具体东西。一个类可以造出很多对象。","lesson":"c8l1"},{"term":"封装","en":"encapsulation","desc":"把数据和对数据的操作放在一起，只暴露必要的接口。","lesson":"c8l1"},{"term":"类","en":"class","desc":"自己定义的一种数据类型，把数据和操作打包在一起。","lesson":"c8l1"},{"term":"属性","en":"attribute","desc":"对象里保存的数据，比如 person.name。","lesson":"c8l2"},{"term":"方法","en":"method","desc":"写在类里面的函数，第一个参数是 self。","lesson":"c8l3"},{"term":"多态","en":"polymorphism","desc":"不同对象对同一个方法可以给出不同实现。","lesson":"c8l4"},{"term":"继承","en":"inheritance","desc":"子类自动拥有父类的能力，并可以改写其中一部分。","lesson":"c8l4"},{"term":"魔术方法","en":"magic method","desc":"以双下划线开头和结尾的方法，如 __init__、__str__，用来定制对象行为。","lesson":"c8l5"},{"term":"抛出","en":"raise","desc":"主动抛出错误，让问题尽早暴露。","lesson":"c9l1"},{"term":"异常传播","en":"exception propagation","desc":"当前函数不处理异常时，错误会继续往上层调用者传。","lesson":"c9l1"},{"term":"自定义异常","en":"custom exception","desc":"自己定义的异常类型，用来表达项目里特定的错误。","lesson":"c9l1"},{"term":"编码","en":"encoding","desc":"文字存成文件的规则。处理中文时固定写 utf-8 最省心。","lesson":"c9l2"},{"term":"路径","en":"path","desc":"文件在电脑里的位置。相对路径从当前目录算起，绝对路径从盘符算起。","lesson":"c9l2"},{"term":"追加模式","en":"append mode","desc":"用 a 打开文件，在末尾继续写，不覆盖原内容。","lesson":"c9l2"},{"term":"反序列化","en":"deserialize","desc":"把 JSON/CSV 这类文本重新变回程序里的数据。","lesson":"c9l3"},{"term":"序列化","en":"serialize","desc":"把程序里的数据变成可以保存或传输的格式（如 JSON 字符串）。","lesson":"c9l3"},{"term":"JSON","en":"JavaScript Object Notation","desc":"通用的数据格式，长得像字典和列表，网页接口和配置文件都用它。","lesson":"c9l3"},{"term":"CSV","en":"comma-separated values","desc":"用逗号分隔的表格文本，Excel 可以直接打开。","lesson":"c9l4"}],"plan":[{"week":"第 1 周","theme":"打地基：让程序听你指挥","hours":"每天 40 分钟","chapters":["c1"],"points":["输出与输入","变量与四种数据类型","字符串与 f-string","基本的类型转换"]},{"week":"第 2 周","theme":"让程序会思考、会重复、会装数据","hours":"每天 45 分钟","chapters":["c2","c3"],"points":["条件判断与逻辑运算","while 与 for 循环","列表、字典、元组、集合","遍历与统计"]},{"week":"第 3 周","theme":"写函数、处理错误、做出第一个项目","hours":"每天 50 分钟","chapters":["c4","c5","c6"],"points":["函数与参数","作用域与模块","异常处理与文件读写","四个完整小项目"]},{"week":"第 4 周","theme":"写得更专业 + 面向对象","hours":"每天 50 分钟","chapters":["c7","c8"],"points":["推导式与可变参数","lambda 与排序","自己写模块","类、对象、方法、继承"]},{"week":"第 5 周","theme":"数据格式与算法思维","hours":"每天 50 分钟","chapters":["c9","c10"],"points":["异常进阶与路径编码","JSON 与 CSV","报表项目","拆题四步法、排序查找、递归、复杂度"]},{"week":"第 6 周","theme":"自动化能力与独立开发","hours":"每天 50 分钟","chapters":["c11","c12"],"points":["日期时间与正则","记账本项目","pip 与虚拟环境","测试、Git、结业大作业"]}]}</script>
<script>
(function () {
    "use strict";

    var DATA = JSON.parse(document.getElementById("curriculum-data").textContent);
    var CHAPTERS = DATA.chapters;
    var REFERENCE = DATA.reference;
    var FAQ = DATA.faq;

    var STORE_KEY = "py-zero-progress-v1";

    var state = loadState();
    var lastViewKey = null;
    var LESSONS = [];
    CHAPTERS.forEach(function (ch) {
        ch.lessons.forEach(function (l) {
            l.chapter = ch;
            l.idx = LESSONS.length;
            LESSONS.push(l);
        });
    });

    /* ------------------------------------------------------------------ 工具 */

    function el(tag, cls, html) {
        var node = document.createElement(tag);
        if (cls) node.className = cls;
        if (html !== undefined) node.innerHTML = html;
        return node;
    }

    function esc(s) {
        return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function loadState() {
        var base = {
            completed: {},
            code: {},
            ex: {},
            quiz: {},
            days: {},
            active: {},
            wrong: {},
            exams: [],
            last: null,
            theme: "dark",
            collapsed: {},
        };
        try {
            var raw = localStorage.getItem(STORE_KEY);
            if (!raw) return base;
            var s = JSON.parse(raw) || {};
            Object.keys(base).forEach(function (k) {
                if (s[k] !== undefined) base[k] = s[k];
            });
            return base;
        } catch (e) {
            return base;
        }
    }

    var saveTimer = null;
    function saveState(now) {
        if (now) {
            try {
                localStorage.setItem(STORE_KEY, JSON.stringify(state));
            } catch (e) {}
            return;
        }
        if (saveTimer) clearTimeout(saveTimer);
        saveTimer = setTimeout(function () {
            saveTimer = null;
            saveState(true);
        }, 400);
    }

    var toastTimer = null;
    function toast(msg) {
        var node = document.getElementById("toast");
        node.textContent = msg;
        node.classList.add("show");
        if (toastTimer) clearTimeout(toastTimer);
        toastTimer = setTimeout(function () {
            node.classList.remove("show");
        }, 1800);
    }

    function friendlyError(etype, raw) {
        var tips = {
            NameError: "变量名或函数名拼错了，也可能是在赋值之前就使用了它。",
            UnboundLocalError: "函数里对某个名字赋值了，所以在函数内部它变成了局部变量，赋值前不能读它。试试用参数传入、用 return 返回。",
            SyntaxError: "语法错误：检查括号和引号是否成对、冒号是否漏了、有没有用中文字符。",
            IndentationError: "缩进错误：Python 靠缩进分组，同一组的缩进必须一样多（一般是 4 个空格）。",
            TabError: "缩进里混用了 Tab 和空格，请统一改成空格。",
            TypeError: "类型不对：常见原因是把字符串和数字直接相加，或者函数参数个数不对。用 int() / str() 转换，或改用 f-string。",
            ValueError: "值不对：比如 int(\"abc\") 无法转换。请确认输入的是数字。",
            ZeroDivisionError: "不能除以 0。",
            IndexError: "下标超出范围了：列表只有几个元素，就只能取到那几个下标（别忘了从 0 开始数）。",
            KeyError: "字典里没有这个键。可以先用 in 判断，或改用 d.get(key, 默认值)。",
            AttributeError: "这个对象没有你调用的方法或属性，检查拼写，或者想想这个类型到底能不能这么用。",
            EOFError: "程序还需要输入，但「输入」框里的内容已经用完了。请在上面的输入框里多补几行。",
            FileNotFoundError: "找不到这个文件：检查文件名、扩展名，以及文件是不是在同一个目录里。",
            RecursionError: "函数调用自己太多次了，检查递归有没有正确的结束条件。",
            ModuleNotFoundError: "找不到这个模块，检查 import 的名字是否拼错。",
            ImportError: "导入失败，检查模块名和导入的内容是否正确。",
        };
        return tips[etype] || "程序出错了，看下面最后一行错误信息，它就是问题所在。";
    }

    function pickTraceback(raw, etype) {
        if (!raw) return "";
        var lines = String(raw).split("\n");
        var keep = [];
        for (var i = 0; i < lines.length; i++) {
            var ln = lines[i];
            if (ln.indexOf("你的代码.py") >= 0 || ln.indexOf("检查.py") >= 0) {
                keep.push(ln);
                if (lines[i + 1] !== undefined) keep.push(lines[i + 1]);
            }
            if (/^\w*(Error|Exception|Exit|Interrupt)\b/.test(ln.trim())) keep.push(ln);
        }
        return keep.length ? keep.join("\n") : raw;
    }

    function progress() {
        var done = 0;
        LESSONS.forEach(function (l) {
            if (state.completed[l.id]) done++;
        });
        return { done: done, total: LESSONS.length, percent: Math.round((done / LESSONS.length) * 100) };
    }

    function todayStr(offset) {
        var d = new Date();
        if (offset) d.setDate(d.getDate() + offset);
        var m = d.getMonth() + 1;
        var day = d.getDate();
        return d.getFullYear() + "-" + (m < 10 ? "0" + m : m) + "-" + (day < 10 ? "0" + day : day);
    }

    function touchDay() {
        state.active[todayStr()] = true;
        saveState();
    }

    function bumpDay(delta) {
        var key = todayStr();
        var n = (state.days[key] || 0) + delta;
        if (n <= 0) delete state.days[key];
        else state.days[key] = n;
    }

    function streakDays() {
        var n = 0;
        var offset = state.active[todayStr()] || state.days[todayStr()] ? 0 : -1;
        for (var i = offset; i > -400; i--) {
            var key = todayStr(i);
            if (state.active[key] || state.days[key]) n++;
            else break;
        }
        return n;
    }

    function todayLine() {
        var names = ["日", "一", "二", "三", "四", "五", "六"];
        var d = new Date();
        var p = progress();
        return (
            "今天是 " +
            todayStr() +
            " 星期" +
            names[d.getDay()] +
            " · 已学 " +
            p.done +
            " / " +
            p.total +
            " 节课 · 连续打卡 " +
            streakDays() +
            " 天"
        );
    }

    function totalActiveDays() {
        var set = {};
        Object.keys(state.active).forEach(function (k) {
            set[k] = true;
        });
        Object.keys(state.days).forEach(function (k) {
            set[k] = true;
        });
        return Object.keys(set).length;
    }

    function plainText(lesson) {
        if (lesson._text) return lesson._text;
        var t = (lesson.title + " " + lesson.goal + " " + lesson.theory + " " + lesson.chapter.title)
            .replace(/<[^>]*>/g, " ")
            .replace(/\s+/g, " ")
            .toLowerCase();
        lesson._text = t;
        return t;
    }

    function lessonById(id) {
        for (var i = 0; i < LESSONS.length; i++) if (LESSONS[i].id === id) return LESSONS[i];
        return null;
    }

    function totalExercises() {
        var n = 0;
        LESSONS.forEach(function (l) {
            n += l.exercises.length;
        });
        return n;
    }

    function isLessonComplete(lesson) {
        if (state.completed[lesson.id]) return true;
        if (!lesson.exercises.length) return !!state.quiz[lesson.id];
        for (var i = 0; i < lesson.exercises.length; i++) {
            if (!state.ex[lesson.id + ":" + i]) return false;
        }
        return true;
    }

    function markLesson(lesson, done) {
        var was = !!state.completed[lesson.id];
        state.completed[lesson.id] = !!done;
        if (done && !was) {
            bumpDay(1);
            state.active[todayStr()] = true;
        }
        if (!done && was) bumpDay(-1);
        saveState(true);
        renderSidebar();
    }

    /* --------------------------------------------------------- 代码高亮与编辑 */

    var TOKEN_RE =
        /(#[^\n]*)|("""[\s\S]*?"""|'''[\s\S]*?'''|"(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*')|\b(def|return|if|elif|else|for|while|in|not|and|or|import|from|as|try|except|finally|with|lambda|class|break|continue|pass|global|None|True|False|is)\b|\b(print|input|len|range|int|float|str|bool|list|dict|set|tuple|sum|max|min|abs|round|sorted|enumerate|zip|type|isinstance|open|chr|ord|append|sort|join|strip|split|lower|upper|replace|get|items|keys|values|pop|remove|insert|count|find|write|read)\b|\b(\d+\.?\d*)\b/g;

    function highlight(code) {
        return esc(code).replace(TOKEN_RE, function (m, com, str, kw, fn, num) {
            if (com) return '<span class="tok-com">' + m + "</span>";
            if (str) return '<span class="tok-str">' + m + "</span>";
            if (kw) return '<span class="tok-key">' + m + "</span>";
            if (fn) return '<span class="tok-fn">' + m + "</span>";
            if (num) return '<span class="tok-num">' + m + "</span>";
            return m;
        });
    }

    var editors = [];

    function createEditor(opts) {
        var root = el("div", "editor-block");
        var head = el("div", "editor-head");
        var title = el("span", "title", esc(opts.title || "代码"));
        var status = el("span", "status", "");
        var runBtn = el("button", "btn small primary", "运行");
        runBtn.type = "button";
        var copyBtn = el("button", "btn small ghost", "复制");
        copyBtn.type = "button";
        var resetBtn = el("button", "btn small ghost", "恢复原样");
        resetBtn.type = "button";
        head.appendChild(title);
        head.appendChild(status);
        head.appendChild(runBtn);
        head.appendChild(copyBtn);
        head.appendChild(resetBtn);

        var wrap = el("div", "editor-wrap");
        var gutter = el("div", "gutter");
        var area = el("div", "code-area");
        var pre = el("pre", "hl");
        var codeNode = el("code");
        pre.appendChild(codeNode);
        var ta = document.createElement("textarea");
        ta.spellcheck = false;
        ta.setAttribute("aria-label", opts.title || "代码编辑区");
        area.appendChild(pre);
        area.appendChild(ta);
        wrap.appendChild(gutter);
        wrap.appendChild(area);

        var stdinRow = el("div", "stdin-row");
        var stdinLabel = el("label", "stdin-label");
        stdinLabel.appendChild(el("span", "", "输入（程序要读的内容，一行一个）"));
        var inputBadge = el("span", "input-badge muted", "不需要");
        stdinLabel.appendChild(inputBadge);
        var stdinBox = document.createElement("textarea");
        stdinBox.spellcheck = false;
        stdinBox.setAttribute("aria-label", "程序输入");
        stdinRow.appendChild(stdinLabel);
        stdinRow.appendChild(stdinBox);
        var inputHint = el("div", "input-hint", "");
        inputHint.style.display = "none";
        stdinRow.appendChild(inputHint);

        var consoleBox = el("div", "console");
        var consoleHead = el("div", "console-head");
        var consoleTitle = el("span", "", "输出");
        var consoleTime = el("span", "", "");
        consoleHead.appendChild(consoleTitle);
        consoleHead.appendChild(consoleTime);
        var consoleBody = el("pre", "console-body", "");
        consoleBody.setAttribute("aria-live", "polite");
        consoleBox.appendChild(consoleHead);
        consoleBox.appendChild(consoleBody);

        var canRun = opts.runnable !== false;
        root.appendChild(head);
        root.appendChild(wrap);
        if (canRun && opts.showStdin !== false) root.appendChild(stdinRow);
        if (canRun) root.appendChild(consoleBox);

        var saved = state.code[opts.key];
        var original = opts.code || "";
        var current = typeof saved === "string" ? saved : original;
        ta.value = current;
        stdinBox.value = (opts.stdin || []).join("\n");

        function sizeEditor() {
            var lines = ta.value.split("\n").length;
            var shown = Math.min(Math.max(lines, 4), 26);
            var lh = 22.4;
            var h = shown * lh + 26;
            wrap.style.height = h + "px";
            var nums = [];
            for (var i = 1; i <= Math.max(lines, 4); i++) nums.push(i);
            gutter.textContent = nums.join("\n");
        }

        function paint() {
            codeNode.innerHTML = highlight(ta.value) + "\n";
            sizeEditor();
            updateInputHint();
        }

        function updateInputHint() {
            if (!canRun) return;
            var count = (ta.value.match(/\binput\s*\(/g) || []).length;
            if (!count) {
                inputBadge.className = "input-badge muted";
                inputBadge.textContent = "不需要";
                inputHint.className = "input-hint";
                inputHint.style.display = "block";
                inputHint.textContent =
                    "这个框是给 input() 用的：程序每执行一次 input()，就按顺序从框里读走一行。" +
                    "你现在的代码还没有用到 input()，可以先不管它。";
                return;
            }
            var lines = stdinBox.value.split("\n").filter(function (s) {
                return s.trim() !== "";
            }).length;
            inputHint.style.display = "block";
            if (lines === 0) {
                inputBadge.className = "input-badge bad";
                inputBadge.textContent = "需要 " + count + " 行";
                inputHint.className = "input-hint bad";
                inputHint.textContent =
                    "代码里用了 " + count + " 次 input()，但「输入」框是空的。请在框里填上要输入的内容，一行一个，再点运行。";
            } else if (lines < count) {
                inputBadge.className = "input-badge warn";
                inputBadge.textContent = "还差 " + (count - lines) + " 行";
                inputHint.className = "input-hint warn";
                inputHint.textContent =
                    "代码会调用 " + count + " 次 input()，但输入框里只有 " +
                    lines + " 行。不够的话程序会报 EOFError，可以再补几行。";
            } else {
                inputBadge.className = "input-badge ok";
                inputBadge.textContent = "已填 " + lines + " 行 ✓";
                inputHint.className = "input-hint";
                inputHint.textContent =
                    "程序会按顺序读取：第 1 行给第 1 次 input()，第 2 行给第 2 次，以此类推，共读 " +
                    count + " 行。多填几行不会报错。";
            }
        }

        function persist() {
            state.code[opts.key] = ta.value;
            saveState();
        }

        ta.addEventListener("input", function () {
            paint();
            persist();
        });

        stdinBox.addEventListener("input", function () {
            updateInputHint();
        });

        ta.addEventListener("scroll", function () {
            pre.scrollTop = ta.scrollTop;
            pre.scrollLeft = ta.scrollLeft;
            gutter.scrollTop = ta.scrollTop;
        });

        ta.addEventListener("keydown", function (e) {
            if (e.key === "Tab") {
                e.preventDefault();
                var start = ta.selectionStart;
                var end = ta.selectionEnd;
                if (e.shiftKey) {
                    var lineStart = ta.value.lastIndexOf("\n", start - 1) + 1;
                    var chunk = ta.value.slice(lineStart, end);
                    var dedented = chunk.replace(/^ {1,4}/gm, "");
                    ta.value = ta.value.slice(0, lineStart) + dedented + ta.value.slice(end);
                    ta.selectionStart = ta.selectionEnd = lineStart + dedented.length;
                } else {
                    ta.value = ta.value.slice(0, start) + "    " + ta.value.slice(end);
                    ta.selectionStart = ta.selectionEnd = start + 4;
                }
                paint();
                persist();
                return;
            }
            if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
                e.preventDefault();
                run();
                return;
            }
            if (e.key === "Enter" && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
                var pos = ta.selectionStart;
                if (pos === ta.selectionEnd) {
                    var lineStart = ta.value.lastIndexOf("\n", pos - 1) + 1;
                    var line = ta.value.slice(lineStart, pos);
                    var indent = (line.match(/^[ \t]*/) || [""])[0];
                    var extra = /:\s*$/.test(line) ? "    " : "";
                    if (indent || extra) {
                        e.preventDefault();
                        var ins = "\n" + indent + extra;
                        ta.value = ta.value.slice(0, pos) + ins + ta.value.slice(pos);
                        ta.selectionStart = ta.selectionEnd = pos + ins.length;
                        paint();
                        persist();
                    }
                }
            }
        });

        copyBtn.addEventListener("click", function () {
            var text = ta.value;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(
                    function () {
                        toast("代码已复制");
                    },
                    function () {
                        toast("复制失败，请手动选择复制");
                    }
                );
            } else {
                ta.select();
                try {
                    document.execCommand("copy");
                    toast("代码已复制");
                } catch (err) {
                    toast("复制失败，请手动选择复制");
                }
            }
        });

        resetBtn.addEventListener("click", function () {
            ta.value = original;
            stdinBox.value = (opts.stdin || []).join("\n");
            state.code[opts.key] = original;
            saveState();
            paint();
            setStatus("已恢复原始代码", "");
            clearConsole();
        });

        function setStatus(text, kind) {
            status.textContent = text;
            status.className = "status" + (kind ? " " + kind : "");
        }

        function clearConsole() {
            consoleBody.textContent = "";
            consoleBody.className = "console-body";
            consoleTime.textContent = "";
        }

        function showText(text, kind) {
            consoleBody.textContent = text;
            consoleBody.className = "console-body" + (kind ? " " + kind : "");
        }

        function showError(result) {
            var head = friendlyError(result.etype, result.error) + "\n\n";
            var tb = pickTraceback(result.error, result.etype);
            showText(head + (result.stdout ? "--- 你的输出 ---\n" + result.stdout + "\n" : "") + "--- 错误详情 ---\n" + tb, "err");
        }

        async function run() {
            if (!canRun) {
                toast("这段代码需要在你自己的电脑上运行");
                return;
            }
            var code = ta.value;
            if (/while\s+(True|1)\s*:/.test(code) && !/\bbreak\b/.test(code)) {
                var go = window.confirm("代码里有 while True 但没看到 break，可能会一直循环下去，页面会卡住。确定要运行吗？");
                if (!go) return;
            }
            runBtn.disabled = true;
            setStatus("正在准备 Python 引擎...", "busy");
            clearConsole();
            var t0 = Date.now();
            try {
                var result = await runPython(code, stdinBox.value, function (msg) {
                    setStatus(msg, "busy");
                });
                var cost = ((Date.now() - t0) / 1000).toFixed(2);
                consoleTime.textContent = "用时 " + cost + " 秒";
                if (result.ok) {
                    setStatus("运行成功", "ok");
                    showText(result.stdout && result.stdout.length ? result.stdout : "（没有输出）", "ok");
                } else {
                    setStatus("出错了：" + result.etype, "err");
                    showError(result);
                }
            } catch (err) {
                setStatus("无法运行", "err");
                showText(
                    "Python 引擎加载失败。\n\n" +
                        "可能原因：网络不通，或者浏览器阻止了本地文件联网。\n" +
                        "可以试试：1) 检查网络后刷新页面重试；2) 双击同文件夹里的「启动学习平台.bat」，用本地服务器方式打开。\n\n" +
                        "技术细节：" +
                        (err && err.message ? err.message : String(err)),
                    "err"
                );
            } finally {
                runBtn.disabled = false;
            }
        }

        runBtn.addEventListener("click", run);
        paint();
        if (canRun) {
            setStatus("按 Ctrl+Enter 直接运行", "");
        } else {
            runBtn.disabled = true;
            runBtn.textContent = "需本机运行";
            setStatus("这段代码要复制到你自己的电脑上运行", "");
        }

        var api = {
            root: root,
            getCode: function () {
                return ta.value;
            },
            setCode: function (v) {
                ta.value = v;
                paint();
                persist();
            },
            getStdin: function () {
                return stdinBox.value;
            },
            run: run,
            setStatus: setStatus,
            showText: showText,
            showErrorText: showError,
            clearConsole: clearConsole,
            setBusy: function (b) {
                runBtn.disabled = !!b;
            },
            runButton: runBtn,
            key: opts.key,
        };
        editors.push(api);
        return api;
    }

    /* ------------------------------------------------------------- Pyodide */

    var CDN_LIST = [
        "https://cdn.jsdelivr.net/pyodide/v0.27.7/full/",
        "https://cdn.jsdelivr.net/pyodide/v0.26.4/full/",
        "https://cdn.jsdelivr.net/pyodide/v0.25.1/full/",
    ];

    var PY = { ready: false, promise: null, py: null };

    var PY_HARNESS = [
        "import io, json, sys, builtins, traceback",
        "",
