e>，要求输出：</p>\n<pre class=\"snippet\"><code>不能除以 0</code></pre>","starter":"a = int(input(\"被除数：\"))\nb = int(input(\"除数：\"))\ntry:\n    # 尝试计算并打印\nexcept ZeroDivisionError:\n    # 兜住错误","stdin":["10","0"],"check":{"type":"output","expect":"不能除以 0"},"hint":"try 里写 print(a / b)，except 里写 print(\"不能除以 0\")。","walkthrough":[],"solution":"a = int(input(\"被除数：\"))\nb = int(input(\"除数：\"))\ntry:\n    print(a / b)\nexcept ZeroDivisionError:\n    print(\"不能除以 0\")"}],"quiz":{"q":"报错信息里最该先看的是哪一行？","options":["第一行","中间的行号","最后一行","文件路径"],"answer":2,"explain":"最后一行同时包含错误类型和原因，是解决问题的关键线索。"},"localOnly":false},{"id":"c5l2","title":"文件读写","chapter_title":"第 5 章 · 面对错误和文件","chapter_id":"c5","minutes":15,"level":"基础","goal":"会用 with open 读写文本文件，知道几种打开模式的区别。","theory":"<h3>写文件</h3>\n<pre class=\"snippet\"><code>with open(\"note.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"第一行\\n\")\n    f.write(\"第二行\\n\")</code></pre>\n<ul><li><code>\"w\"</code> 表示写入，会<strong>清空</strong>原文件再写。</li><li><code>\"a\"</code> 表示追加，在原内容后面接着写。</li><li><code>encoding=\"utf-8\"</code> 让中文正常保存，强烈建议每次都写。</li><li><code>with</code> 会在代码块结束时自动关闭文件，不用手动 close。</li></ul>\n<h3>读文件</h3>\n<pre class=\"snippet\"><code>with open(\"note.txt\", \"r\", encoding=\"utf-8\") as f:\n    text = f.read()          # 一次性读全部\nprint(text)\n\nwith open(\"note.txt\", encoding=\"utf-8\") as f:\n    for line in f:           # 一行一行读（大文件推荐）\n        print(line.strip())</code></pre>\n<table><thead><tr><th>模式</th><th>含义</th></tr></thead><tbody><tr><td><code>\"r\"</code></td><td>只读（默认），文件不存在会报错</td></tr><tr><td><code>\"w\"</code></td><td>写入，清空原有内容</td></tr><tr><td><code>\"a\"</code></td><td>追加到末尾</td></tr><tr><td><code>\"r+\"</code></td><td>可读可写</td></tr></tbody></table>\n<h3>文件不存在怎么办</h3>\n<pre class=\"snippet\"><code>try:\n    with open(\"missing.txt\", encoding=\"utf-8\") as f:\n        print(f.read())\nexcept FileNotFoundError:\n    print(\"文件还没创建\")</code></pre>\n<div class=\"callout\"><p>提示：在这个网页平台里，文件保存在浏览器的虚拟文件系统里，刷新页面就会消失。要在自己电脑上长期保存，请用本地安装的 Python 运行。</p></div>","example":{"title":"写进去再读出来","code":"with open(\"note.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"今天学了文件读写\\n\")\n    f.write(\"这是我写进文件的第一句话\\n\")\n\nwith open(\"note.txt\", encoding=\"utf-8\") as f:\n    for line in f:\n        print(\"读到：\", line.strip())\n\nwith open(\"note.txt\", \"a\", encoding=\"utf-8\") as f:\n    f.write(\"这行是追加的\\n\")\n\nwith open(\"note.txt\", encoding=\"utf-8\") as f:\n    print(f.read())","stdin":[],"explain":"先写入、再按行读、再追加，最后一次性读出全部内容对比。","runnable":true,"notes":[]},"exercises":[{"title":"练习：写一个待办文件","task":"<p>把两件事写进 <code>todo.txt</code>，再读出来打印：</p>\n<pre class=\"snippet\"><code>1. 学 Python\n2. 写代码</code></pre>","starter":"# 用 with open(..., \"w\", encoding=\"utf-8\") 写入两行\n\n# 再用 with open(..., encoding=\"utf-8\") 读出来打印","stdin":[],"check":{"type":"output","expect":"1. 学 Python\n2. 写代码"},"hint":"写入时每行末尾加 \\n；读取时用 f.read() 直接打印整个内容。","walkthrough":[],"solution":"with open(\"todo.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"1. 学 Python\\n\")\n    f.write(\"2. 写代码\\n\")\n\nwith open(\"todo.txt\", encoding=\"utf-8\") as f:\n    print(f.read(), end=\"\")"}],"quiz":{"q":"用 \"w\" 模式打开一个已有内容的文件会怎样？","options":["原内容保留，新内容加在后面","原内容被清空","报错","变成只读"],"answer":1,"explain":"w 模式会先清空文件。想保留原内容请用 a 模式追加。"},"localOnly":false}]},{"id":"c6","title":"第 6 章 · 动手做项目","summary":"把前面学的东西拼起来，做出四个能拿给朋友玩的小程序。","lessons":[{"id":"c6l1","title":"项目一：猜数字游戏","chapter_title":"第 6 章 · 动手做项目","chapter_id":"c6","minutes":20,"level":"综合","goal":"用 input、while、if、random 写一个完整的互动小程序。","theory":"<h3>第一步：先想清楚要做什么</h3>\n<ol><li>电脑随机想一个 1~100 的数。</li><li>玩家猜一个数，电脑告诉他是大了还是小了。</li><li>猜对就结束，并告诉他一共猜了几次。</li></ol>\n<h3>第二步：把它写成中文步骤（伪代码）</h3>\n<pre class=\"snippet\"><code>生成随机答案\n次数 = 0\n只要还没猜对:\n    读入一个猜测\n    次数加一\n    如果猜大了 → 提示小了\n    如果猜小了 → 提示大了\n    否则 → 恭喜，报出次数，结束</code></pre>\n<h3>第三步：翻成 Python</h3>\n<pre class=\"snippet\"><code>import random\n\nsecret = random.randint(1, 100)\ncount = 0\n\nwhile True:\n    guess = int(input(\"猜一个 1~100 的数字：\"))\n    count += 1\n    if guess &gt; secret:\n        print(\"大了，再试试\")\n    elif guess &lt; secret:\n        print(\"小了，再试试\")\n    else:\n        print(f\"猜对啦！你一共猜了 {count} 次\")\n        break</code></pre>\n<h3>想法升级（做完练习后可以试试）</h3>\n<ul><li>限制最多猜 7 次，超过就公布答案。</li><li>猜的期间如果输入的不是数字，用 try/except 提示重来。</li><li>玩完问一句「再来一局吗？」，再套一层 while。</li></ul>\n<div class=\"callout\"><p>提示：把大问题拆成小步骤，再一步步翻译成代码，这就是程序员解决问题的方式。这个思路比记住语法更重要。</p></div>","example":{"title":"完整的猜数字游戏","code":"# 真正玩游戏时用这一行：secret = random.randint(1, 100)\nsecret = 42        # 为了让你能复现结果，这里先把答案固定住\ncount = 0\n\nwhile True:\n    guess = int(input(\"猜一个 1~100 的数字：\"))\n    count += 1\n    if guess > secret:\n        print(\"大了，再试试\")\n    elif guess < secret:\n        print(\"小了，再试试\")\n    else:\n        print(f\"猜对啦！答案是 {secret}，你一共猜了 {count} 次\")\n        break","stdin":["50","30","40","45","42"],"explain":"答案每次都不一样，所以输入框里的数字只是用来试玩。多运行几次体会一下。","runnable":true,"notes":[]},"exercises":[{"title":"练习：把判断逻辑抽成函数","task":"<p>定义 <code>check_guess(secret, guess)</code>，返回：</p>\n<ul><li>猜大了 → <code>\"太大了\"</code></li><li>猜小了 → <code>\"太小了\"</code></li><li>猜对了 → <code>\"猜对了\"</code></li></ul>\n<p>这个函数会让游戏主体更清晰，也方便自动测试。</p>","starter":"def check_guess(secret, guess):\n    # 用 if / elif / else 返回三个字符串之一\n","stdin":[],"check":{"type":"test","code":"assert \"check_guess\" in globals(), \"没有找到 check_guess 函数，检查 def 的拼写\"\nassert check_guess(50, 80) == \"太大了\", \"猜 80 面对答案 50，应该返回 太大了\"\nassert check_guess(50, 30) == \"太小了\", \"猜 30 面对答案 50，应该返回 太小了\"\nassert check_guess(50, 50) == \"猜对了\", \"猜对时应该返回 猜对了\""},"hint":"if guess > secret 返回 太大了，elif guess < secret 返回 太小了，else 返回 猜对了。","walkthrough":[],"solution":"def check_guess(secret, guess):\n    if guess > secret:\n        return \"太大了\"\n    elif guess < secret:\n        return \"太小了\"\n    else:\n        return \"猜对了\""}],"quiz":{"q":"游戏循环写成 `while True:` 却忘了 break，会发生什么？","options":["正常结束","无限循环","报语法错误","自动跳出"],"answer":1,"explain":"while True 永远成立，必须有 break 或 return 才能结束循环。"},"localOnly":false},{"id":"c6l2","title":"项目二：石头剪刀布","chapter_title":"第 6 章 · 动手做项目","chapter_id":"c6","minutes":18,"level":"综合","goal":"用 random.choice、字典和函数写一个对战小游戏。","theory":"<h3>游戏规则怎么变成代码</h3>\n<p>三种手势之间的关系，用文字描述最容易错，所以先列成表：</p>\n<table><thead><tr><th>玩家</th><th>电脑</th><th>结果</th></tr></thead><tbody><tr><td>石头</td><td>剪刀</td><td>玩家赢</td></tr><tr><td>剪刀</td><td>布</td><td>玩家赢</td></tr><tr><td>布</td><td>石头</td><td>玩家赢</td></tr><tr><td>两个一样</td><td>两个一样</td><td>平局</td></tr><tr><td>其他</td><td>其他</td><td>玩家输</td></tr></tbody></table>\n<h3>用字典描述「谁赢谁」更聪明</h3>\n<pre class=\"snippet\"><code>beats = {\"石头\": \"剪刀\", \"剪刀\": \"布\", \"布\": \"石头\"}\n\ndef judge(player, computer):\n    if player == computer:\n        return \"平局\"\n    if beats[player] == computer:\n        return \"你赢了\"\n    return \"你输了\"</code></pre>\n<p>这样的好处是：新增一种手势只需要改字典，不用改一堆 if。</p>\n<h3>主程序</h3>\n<pre class=\"snippet\"><code>import random\n\nchoices = [\"石头\", \"剪刀\", \"布\"]\nplayer = input(\"请出拳（石头/剪刀/布）：\")\ncomputer = random.choice(choices)\nprint(f\"电脑出的是 {computer}\")\nprint(judge(player, computer))</code></pre>\n<div class=\"callout\"><p>提示：判断输入是否合法也很重要：<code>if player not in choices:</code> 就提示用户重新输入。</p></div>","example":{"title":"一局定胜负","code":"import random\n\nbeats = {\"石头\": \"剪刀\", \"剪刀\": \"布\", \"布\": \"石头\"}\n\ndef judge(player, computer):\n    if player == computer:\n        return \"平局\"\n    if beats[player] == computer:\n        return \"你赢了\"\n    return \"你输了\"\n\nchoices = [\"石头\", \"剪刀\", \"布\"]\nplayer = input(\"请出拳（石头/剪刀/布）：\")\ncomputer = random.choice(choices)\nprint(f\"你出 {player}，电脑出 {computer}\")\nprint(judge(player, computer))","stdin":["石头"],"explain":"把输入框改成「剪刀」再运行，看看结果怎么变化。","runnable":true,"notes":[]},"exercises":[{"title":"练习：写对战裁判函数","task":"<p>实现 <code>judge(player, computer)</code>，返回 <code>\"你赢了\"</code>、<code>\"你输了\"</code> 或 <code>\"平局\"</code>。</p>\n<p>可以自己写多个 if，也可以用字典描述胜负关系（推荐）。</p>","starter":"# 推荐：先把三种手势的胜负关系写进字典\nbeats = {}\n\ndef judge(player, computer):\n    # 返回比赛结果\n","stdin":[],"check":{"type":"test","code":"assert \"judge\" in globals(), \"没有找到 judge 函数\"\nassert judge(\"石头\", \"石头\") == \"平局\", \"手势相同应该是平局\"\nassert judge(\"石头\", \"剪刀\") == \"你赢了\", \"石头赢剪刀\"\nassert judge(\"剪刀\", \"布\") == \"你赢了\", \"剪刀赢布\"\nassert judge(\"布\", \"石头\") == \"你赢了\", \"布赢石头\"\nassert judge(\"石头\", \"布\") == \"你输了\", \"石头输给布\"\nassert judge(\"剪刀\", \"石头\") == \"你输了\", \"剪刀输给石头\""},"hint":"beats = {\"石头\": \"剪刀\", \"剪刀\": \"布\", \"布\": \"石头\"}，然后先判断平局，再判断 beats[player] == computer。","walkthrough":[],"solution":"beats = {\"石头\": \"剪刀\", \"剪刀\": \"布\", \"布\": \"石头\"}\n\ndef judge(player, computer):\n    if player == computer:\n        return \"平局\"\n    if beats[player] == computer:\n        return \"你赢了\"\n    return \"你输了\""}],"quiz":{"q":"beats = {\"石头\": \"剪刀\"}，那么 beats[\"石头\"] 是什么？","options":["石头","剪刀","布","报错"],"answer":1,"explain":"字典里键是石头，对应的值是剪刀，表示石头能赢剪刀。"},"localOnly":false},{"id":"c6l3","title":"项目三：班级成绩管理","chapter_title":"第 6 章 · 动手做项目","chapter_id":"c6","minutes":20,"level":"综合","goal":"用列表套字典的组合，练习函数化的数据处理。","theory":"<h3>真实的数据长什么样</h3>\n<p>一个班里很多学生，每个学生有名字和分数，最自然的表示方式是<strong>列表里装字典</strong>：</p>\n<pre class=\"snippet\"><code>students = [\n    {\"name\": \"小明\", \"score\": 88},\n    {\"name\": \"小红\", \"score\": 95},\n    {\"name\": \"小刚\", \"score\": 72},\n]</code></pre>\n<h3>遍历这种结构</h3>\n<pre class=\"snippet\"><code>for s in students:\n    print(f\"{s['name']}：{s['score']} 分\")</code></pre>\n<p><code>s</code> 是其中一本字典，<code>s[\"name\"]</code> 取名字，<code>s[\"score\"]</code> 取分数。</p>\n<h3>拆成小函数更好维护</h3>\n<pre class=\"snippet\"><code>def average(students):\n    total = 0\n    for s in students:\n        total += s[\"score\"]\n    return total / len(students)\n\ndef top_student(students):\n    best = students[0]\n    for s in students:\n        if s[\"score\"] &gt; best[\"score\"]:\n            best = s\n    return best[\"name\"]</code></pre>\n<h3>打印一张成绩单</h3>\n<pre class=\"snippet\"><code>print(f\"平均分 {average(students):.1f}\")\nprint(f\"第一名 {top_student(students)}\")\nfor s in students:\n    print(f\"{s['name']}: {s['score']}\")</code></pre>\n<div class=\"callout\"><p>提示：<code>list.sort(key=...)</code> 可以实现按分数排序，等你想升级时再研究：</p></div>\n<pre class=\"snippet\"><code>students.sort(key=lambda s: s[\"score\"], reverse=True)</code></pre>","example":{"title":"一份完整的成绩单","code":"students = [\n    {\"name\": \"小明\", \"score\": 88},\n    {\"name\": \"小红\", \"score\": 95},\n    {\"name\": \"小刚\", \"score\": 72},\n]\n\ndef average(students):\n    total = 0\n    for s in students:\n        total += s[\"score\"]\n    return total / len(students)\n\ndef top_student(students):\n    best = students[0]\n    for s in students:\n        if s[\"score\"] > best[\"score\"]:\n            best = s\n    return best[\"name\"]\n\nprint(f\"平均分 {average(students):.1f}\")\nprint(f\"第一名 {top_student(students)}\")\nfor s in students:\n    print(f\"{s['name']}: {s['score']}\")","stdin":[],"explain":"注意函数只负责计算，打印交给主程序，这样每个函数都很短、很好测试。","runnable":true,"notes":[]},"exercises":[{"title":"练习：写两个统计函数","task":"<p>实现两个函数，对 <code>students</code> 这种数据（列表里装字典）工作：</p>\n<ol><li><code>average(students)</code> 返回平均分（一个数字）</li><li><code>top_student(students)</code> 返回分数最高的学生名字</li></ol>\n<p>如果分数相同，返回先出现的那一个。</p>","starter":"students = [\n    {\"name\": \"小明\", \"score\": 88},\n    {\"name\": \"小红\", \"score\": 95},\n    {\"name\": \"小刚\", \"score\": 72},\n]\n\ndef average(students):\n    # 求和再除以人数\n\ndef top_student(students):\n    # 逐个比较，记录分数最高的那一位\n","stdin":[],"check":{"type":"test","code":"assert \"average\" in globals(), \"没有找到 average 函数\"\nassert \"top_student\" in globals(), \"没有找到 top_student 函数\"\ndata = [{\"name\": \"A\", \"score\": 80}, {\"name\": \"B\", \"score\": 90}]\nassert average(data) == 85, \"平均分应该是 85\"\nassert top_student(data) == \"B\", \"分数最高的是 B\"\ndata2 = [{\"name\": \"甲\", \"score\": 70}, {\"name\": \"乙\", \"score\": 70}]\nassert top_student(data2) == \"甲\", \"分数相同时应该返回先出现的那一个\""},"hint":"average 里用 s[\"score\"] 累加；top_student 里先假设 students[0] 是最高的，再逐个比较。","walkthrough":[],"solution":"students = [\n    {\"name\": \"小明\", \"score\": 88},\n    {\"name\": \"小红\", \"score\": 95},\n    {\"name\": \"小刚\", \"score\": 72},\n]\n\ndef average(students):\n    total = 0\n    for s in students:\n        total += s[\"score\"]\n    return total / len(students)\n\ndef top_student(students):\n    best = students[0]\n    for s in students:\n        if s[\"score\"] > best[\"score\"]:\n            best = s\n    return best[\"name\"]"}],"quiz":{"q":"students = [{\"name\": \"小明\", \"score\": 88}]，students[0][\"score\"] 是多少？","options":["88","小明","报错","[]"],"answer":0,"explain":"先取列表的第 0 个（一本字典），再从字典里取 score。"},"localOnly":false},{"id":"c6l4","title":"项目四：文章词频统计","chapter_title":"第 6 章 · 动手做项目","chapter_id":"c6","minutes":20,"level":"综合","goal":"用 split、字典和排序做一次真实的数据分析。","theory":"<h3>要解决的问题</h3>\n<p>给一段英文，数一数每个单词出现了几次，找出出现最多的词。这就是最基础的文本分析。</p>\n<h3>核心思路：用字典当计数器</h3>\n<pre class=\"snippet\"><code>text = \"python is fun python is easy\"\ncounts = {}\nfor word in text.split():\n    if word in counts:\n        counts[word] += 1        # 见过，加一\n    else:\n        counts[word] = 1         # 第一次见，记为 1\nprint(counts)                    # {'python': 2, 'is': 2, 'fun': 1, 'easy': 1}</code></pre>\n<p>这个模式叫「计数」，以后做统计、投票、日志分析都会用到。</p>\n<h3>按次数排序</h3>\n<pre class=\"snippet\"><code>items = sorted(counts.items(), key=lambda kv: kv[1], reverse=True)\nprint(items[0])      # ('python', 2) 出现最多的词</code></pre>\n<h3>让统计更干净</h3>\n<pre class=\"snippet\"><code>import string\n\nword = word.strip(string.punctuation).lower()</code></pre>\n<p>这样 <code>Python,</code> 和 <code>python</code> 就会被算成同一个词。</p>\n<div class=\"callout\"><p>提示：标准库里的 <code>collections.Counter</code> 三行就能搞定计数，等你把这版手写代码写熟之后再用它：</p></div>\n<pre class=\"snippet\"><code>from collections import Counter\nprint(Counter(text.split()).most_common(3))</code></pre>","example":{"title":"统计并排出前几名","code":"text = \"python is fun and python is powerful\"\n\ncounts = {}\nfor word in text.split():\n    if word in counts:\n        counts[word] += 1\n    else:\n        counts[word] = 1\n\nitems = sorted(counts.items(), key=lambda kv: kv[1], reverse=True)\nprint(f\"一共 {len(counts)} 个不同的单词\")\nfor word, n in items:\n    print(f\"{word}: {n}\")","stdin":[],"explain":"sorted 加上 key 和 reverse，就能按出现次数从多到少排列。","runnable":true,"notes":[]},"exercises":[{"title":"练习：词频统计函数","task":"<p>实现两个函数：</p>\n<ol><li><code>word_count(text)</code>：返回一个字典，记录每个单词出现的次数</li><li><code>most_common(counts)</code>：返回出现次数最多的单词</li></ol>\n<p>（把单词先 <code>lower()</code> 转成小写，这样 Python 和 python 算同一个）</p>","starter":"def word_count(text):\n    counts = {}\n    # 用 split 拆分，用 lower 转小写，再计数\n    return counts\n\ndef most_common(counts):\n    # 找出次数最多的键\n","stdin":[],"check":{"type":"test","code":"assert \"word_count\" in globals(), \"没有找到 word_count 函数\"\nassert \"most_common\" in globals(), \"没有找到 most_common 函数\"\nc1 = word_count(\"Python is fun python\")\nassert isinstance(c1, dict), \"word_count 应该返回字典\"\nassert c1.get(\"python\") == 2, \"python 出现了 2 次（大小写要合并）\"\nassert c1.get(\"is\") == 1, \"is 出现了 1 次\"\nc2 = word_count(\"a b b c c c\")\nassert most_common(c2) == \"c\", \"出现最多的应该是 c\""},"hint":"word_count 里 for word in text.lower().split(): 然后判断 word in counts；most_common 里用 max(counts, key=counts.get)。","walkthrough":[],"solution":"def word_count(text):\n    counts = {}\n    for word in text.lower().split():\n        if word in counts:\n            counts[word] += 1\n        else:\n            counts[word] = 1\n    return counts\n\ndef most_common(counts):\n    return max(counts, key=counts.get)"}],"quiz":{"q":"counts = {}，执行 counts[\"a\"] = counts.get(\"a\", 0) + 1 两次后 counts 是什么？","options":["{\"a\": 1}","{\"a\": 2}","{}","报错"],"answer":1,"explain":"get 在键不存在时返回默认值 0，所以第一次得到 1，第二次得到 2。"},"localOnly":false},{"id":"c6l5","title":"结业：你的下一步路线图","chapter_title":"第 6 章 · 动手做项目","chapter_id":"c6","minutes":18,"level":"综合","goal":"完成毕业小测，知道接下来该学什么、去哪儿练。","theory":"<h3>你已经掌握的东西</h3>\n<ul><li>输出、输入、变量、四种数据类型和它们之间的转换</li><li>条件判断、逻辑运算、while 和 for 循环</li><li>列表、字典、元组、集合，以及遍历和统计</li><li>自己定义函数、参数、返回值、作用域</li><li>导入模块、看懂报错、处理异常、读写文件</li><li>用上面这些写完了四个完整小程序</li></ul>\n<p>这已经是一个能真正干活的 Python 入门水平了。</p>\n<h3>接下来学什么的建议顺序</h3>\n<ol><li><strong>面向对象（class）</strong>：把「数据 + 操作」打包在一起，适合写大一点的项目。</li><li><strong>标准库进阶</strong>：<code>collections</code>、<code>datetime</code>、<code>pathlib</code>、<code>re</code>（正则表达式）。</li><li><strong>第三方库</strong>：用 <code>pip install</code> 安装别人的库，比如 <code>requests</code> 抓网页、<code>pandas</code> 处理表格。</li><li><strong>做项目</strong>：命令行记账本、爬取天气、自动整理文件、简单的网页（Flask / FastAPI）。</li><li><strong>算法练习</strong>：从简单题开始，每天 1 题，重点是把题目翻译成代码的过程。</li></ol>\n<h3>三条长期有效的建议</h3>\n<ul><li><strong>每天写一点</strong>，20 分钟胜过周末突击 5 小时。</li><li><strong>不要抄完就跑</strong>：看懂答案之后，关掉答案自己重写一遍。</li><li><strong>报错先自己读三遍</strong>，再用搜索引擎搜「报错信息 + Python」，你会看到很多和你一样的人。</li></ul>\n<h3>常用调试三步法</h3>\n<ol><li>把变量 <code>print</code> 出来，看它到底是多少。</li><li>缩小范围：把一半代码注释掉，看错误是否还在。</li><li>一次只改一个地方，改完马上运行。</li></ol>\n<div class=\"callout\"><p>提示：学完不代表记住。回头把每节课的练习再做一遍，速度会快很多，收获也会更大。</p></div>","example":{"title":"毕业作品：打印 20 以内的质数","code":"def is_prime(n):\n    if n < 2:\n        return False\n    for i in range(2, n):\n        if n % i == 0:\n            return False\n    return True\n\nprimes = []\nfor n in range(1, 21):\n    if is_prime(n):\n        primes.append(n)\n\nprint(f\"20 以内的质数：{primes}\")","stdin":[],"explain":"这个程序把循环、条件、列表、函数全用上了，是很好的总结练习。","runnable":true,"notes":[]},"exercises":[{"title":"毕业小测：给质数判断加个上限参数","task":"<p>实现 <code>primes_upto(limit)</code>，返回不超过 limit 的所有质数列表。</p>\n<p>然后打印 <code>primes_upto(20)</code>，输出：</p>\n<pre class=\"snippet\"><code>20 以内的质数：[2, 3, 5, 7, 11, 13, 17, 19]</code></pre>","starter":"def is_prime(n):\n    if n < 2:\n        return False\n    for i in range(2, n):\n        if n % i == 0:\n            return False\n    return True\n\ndef primes_upto(limit):\n    # 返回所有不超过 limit 的质数\n","stdin":[],"check":{"type":"test","code":"assert \"is_prime\" in globals(), \"没有找到 is_prime 函数（它在上面的起始代码里）\"\nassert \"primes_upto\" in globals(), \"没有找到 primes_upto 函数\"\nassert primes_upto(20) == [2, 3, 5, 7, 11, 13, 17, 19], \"20 以内的质数列表不对\"\nassert primes_upto(2) == [2], \"2 是质数\"\nassert primes_upto(1) == [], \"1 不是质数\""},"hint":"把 is_prime 的结果筛选出来：先 result = []，循环 range(2, limit + 1)，满足就 append。","walkthrough":[],"solution":"def is_prime(n):\n    if n < 2:\n        return False\n    for i in range(2, n):\n        if n % i == 0:\n            return False\n    return True\n\ndef primes_upto(limit):\n    result = []\n    for n in range(2, limit + 1):\n        if is_prime(n):\n            result.append(n)\n    return result\n\nprint(f\"20 以内的质数：{primes_upto(20)}\")"}],"quiz":{"q":"想让 Python 更上一层楼，下面哪种做法最有效？","options":["每天写 20 分钟，并动手做小项目","把语法书从头背到尾","只看视频不动手","等全部学完再开始写代码"],"answer":0,"explain":"编程是手上功夫，持续练习加上做真实的小项目，进步最快。"},"localOnly":false}]},{"id":"c7","title":"第 7 章 · 写得更专业","summary":"推导式、可变参数、lambda、写自己的模块、代码规范与调试——从「能跑」到「好看好维护」。","lessons":[{"id":"c7l1","title":"列表推导式：一行搞定循环","chapter_title":"第 7 章 · 写得更专业","chapter_id":"c7","minutes":14,"level":"进阶","goal":"会用列表推导式生成、筛选列表，并知道什么时候该换回普通循环。","theory":"<h3>从三行变成一行</h3>\n<pre class=\"snippet\"><code>squares = []\nfor x in range(1, 6):\n    squares.append(x * x)\nprint(squares)          # [1, 4, 9, 16, 25]</code></pre>\n<p>同样的事情，一行就能写完：</p>\n<pre class=\"snippet\"><code>squares = [x * x for x in range(1, 6)]\nprint(squares)</code></pre>\n<p>读法：先把「要放进去的东西」写在最前面，再把 <code>for</code> 写在后面。</p>\n<h3>加条件筛选</h3>\n<pre class=\"snippet\"><code>evens = [x for x in range(1, 11) if x % 2 == 0]      # [2, 4, 6, 8, 10]\nwords = [\"hi\", \"hello\", \"ok\"]\nlong_words = [w for w in words if len(w) &gt; 2]        # ['hello']</code></pre>\n<h3>什么时候不要用</h3>\n<p>出现两层循环、或者条件特别绕的时候，请换回普通循环。代码是给人看的，一行写太满反而是负担。</p>\n<div class=\"callout warn\"><p>注意：方括号最前面写的是「表达式」，不是「动作」。<code>[print(x) for x in range(3)]</code> 会生成一串 <code>None</code>，想输出就老老实实写 for 循环。</p></div>","example":{"title":"筛选、加工、拼接一次完成","code":"scores = [55, 88, 92, 60, 73]\n\npassed = [s for s in scores if s >= 60]\nprint(\"及格分数：\", passed)\n\ndoubled = [s * 2 for s in scores]\nprint(\"全部翻倍：\", doubled)\n\nnames = [\"小明\", \"小红\", \"小刚\"]\ngreetings = [f\"你好，{n}\" for n in names]\nprint(greetings)","stdin":[],"explain":"第三段把 f-string 放进推导式，一次生成整份问候语。","runnable":true,"notes":[]},"exercises":[{"title":"练习：生成平方数列表","task":"<p>用<strong>一行</strong>列表推导式生成 1 到 10 的平方数，然后打印出来，输出：</p>\n<pre class=\"snippet\"><code>[1, 4, 9, 16, 25, 36, 49, 64, 81, 100]</code></pre>","starter":"# 用列表推导式生成 1~10 的平方\n\n# 打印结果","stdin":[],"check":{"type":"output","expect":"[1, 4, 9, 16, 25, 36, 49, 64, 81, 100]"},"hint":"squares = [x * x for x in range(1, 11)]，然后 print(squares)。","walkthrough":[],"solution":"squares = [x * x for x in range(1, 11)]\nprint(squares)"},{"title":"挑战：筛选并转大写","task":"<p>已有 <code>words = [\"python\", \"is\", \"hello\", \"ok\"]</code>。</p>\n<p>用一行列表推导式，挑出长度大于 3 的单词并转成大写，输出：</p>\n<pre class=\"snippet\"><code>['PYTHON', 'HELLO']</code></pre>","starter":"words = [\"python\", \"is\", \"hello\", \"ok\"]\n# 一行搞定：筛选 + 转大写","stdin":[],"check":{"type":"output","expect":"['PYTHON', 'HELLO']"},"hint":"[w.upper() for w in words if len(w) > 3]","walkthrough":[],"solution":"words = [\"python\", \"is\", \"hello\", \"ok\"]\nresult = [w.upper() for w in words if len(w) > 3]\nprint(result)"}],"quiz":{"q":"[x for x in range(4)] 的结果是？","options":["[1, 2, 3, 4]","[0, 1, 2, 3]","[0, 1, 2, 3, 4]","报错"],"answer":1,"explain":"range(4) 从 0 开始，含头不含尾，所以是 0 到 3。"},"localOnly":false},{"id":"c7l2","title":"推导式家族：字典、集合与生成器","chapter_title":"第 7 章 · 写得更专业","chapter_id":"c7","minutes":14,"level":"进阶","goal":"会用字典推导、集合推导和生成器表达式处理数据。","theory":"<h3>字典推导式：一边遍历一边造字典</h3>\n<pre class=\"snippet\"><code>prices = {\"苹果\": 5, \"香蕉\": 2}\nwith_tax = {name: round(p * 1.1, 2) for name, p in prices.items()}\nprint(with_tax)          # {'苹果': 5.5, '香蕉': 2.2}</code></pre>\n<h3>集合推导式：自动去重</h3>\n<pre class=\"snippet\"><code>students = [{\"name\": \"小明\"}, {\"name\": \"小红\"}, {\"name\": \"小明\"}]\nnames = {s[\"name\"] for s in students}\nprint(names)             # {'小明', '小红'}</code></pre>\n<p>注意用的是花括号，而且没有冒号，这就是集合。</p>\n<h3>生成器表达式：省内存的懒加载</h3>\n<pre class=\"snippet\"><code>total = sum(x * x for x in range(1, 101))\nprint(total)             # 338350</code></pre>\n<p>把方括号换成圆括号就是生成器表达式：它不一次性把所有结果算出来，而是边用边算。数据量大时非常有用。</p>\n<table><thead><tr><th>写法</th><th>结果类型</th><th>说明</th></tr></thead><tbody><tr><td><code>[x for x in ...]</code></td><td>列表</td><td>全部算出来存起来</td></tr><tr><td><code>{x for x in ...}</code></td><td>集合</td><td>自动去重</td></tr><tr><td><code>{k: v for ...}</code></td><td>字典</td><td>键值对</td></tr><tr><td><code>(x for x in ...)</code></td><td>生成器</td><td>惰性求值，只能遍历一次</td></tr></tbody></table>\n<div class=\"callout warn\"><p>注意：生成器只能遍历一次。第二次再遍历就是空的，需要重新生成。</p></div>","example":{"title":"三种推导式对比","code":"prices = {\"苹果\": 5, \"香蕉\": 2, \"橘子\": 4}\nwith_tax = {k: round(v * 1.1, 2) for k, v in prices.items()}\nprint(with_tax)\n\nnums = [1, 2, 2, 3, 3, 3]\nunique = {n for n in nums}\nprint(unique)\n\ntotal = sum(n * n for n in range(1, 11))\nprint(f\"1 到 10 的平方和是 {total}\")","stdin":[],"explain":"集合的打印顺序在 Python 里是插入顺序去重后的结果，不用纠结顺序。","runnable":true,"notes":[]},"exercises":[{"title":"练习：造一个平方字典","task":"<p>用字典推导式把 <code>nums = [1, 2, 3, 4]</code> 变成「数字 → 它的平方」的字典，打印结果：</p>\n<pre class=\"snippet\"><code>{1: 1, 2: 4, 3: 9, 4: 16}</code></pre>","starter":"nums = [1, 2, 3, 4]\n# 字典推导式：{键: 值 for 变量 in 列表}","stdin":[],"check":{"type":"output","expect":"{1: 1, 2: 4, 3: 9, 4: 16}"},"hint":"squares = {n: n * n for n in nums}","walkthrough":[],"solution":"nums = [1, 2, 3, 4]\nsquares = {n: n * n for n in nums}\nprint(squares)"}],"quiz":{"q":"{x for x in [1, 1, 2]} 的结果是？","options":["[1, 1, 2]","{1, 2}","{1: 2}","报错"],"answer":1,"explain":"花括号且没有冒号就是集合，集合会自动去重。"},"localOnly":false},{"id":"c7l3","title":"参数进阶：*args 与 **kwargs","chapter_title":"第 7 章 · 写得更专业","chapter_id":"c7","minutes":15,"level":"进阶","goal":"会写能接收任意个参数的函数，并会解包列表和字典来调用函数。","theory":"<h3>*args：接收任意多个位置参数</h3>\n<pre class=\"snippet\"><code>def total(*nums):\n    return sum(nums)\n\nprint(total())            # 0\nprint(total(1, 2, 3))     # 6</code></pre>\n<p>函数里的 <code>nums</code> 是一个<strong>元组</strong>，装着你传进来的所有值。</p>\n<h3>**kwargs：接收任意多个关键字参数</h3>\n<pre class=\"snippet\"><code>def describe(**info):\n    for k, v in info.items():\n        print(f\"{k}: {v}\")\n\ndescribe(name=\"小明\", age=18)</code></pre>\n<p><code>info</code> 是一个<strong>字典</strong>。名字 <code>args</code>、<code>kwargs</code> 只是习惯用法，重点在 <code>*</code> 和 <code>**</code>。</p>\n<h3>参数的排列顺序</h3>\n<pre class=\"snippet\"><code>def f(a, b=1, *args, key=None, **kwargs):\n    ...</code></pre>\n<p>顺序固定为：普通参数 → 默认参数 → <code>*args</code> → 关键字专用参数 → <code>**kwargs</code>。</p>\n<h3>解包：把列表和字典摊开传进去</h3>\n<pre class=\"snippet\"><code>nums = [3, 1, 2]\nprint(total(*nums))        # 6，等于 total(3, 1, 2)\n\nconfig = {\"name\": \"小红\", \"age\": 20}\ndescribe(**config)         # 等于 describe(name=\"小红\", age=20)</code></pre>\n<div class=\"callout\"><p>提示：写工具函数时常用这个技巧，比如日志函数的 <code>log(msg, *tags)</code>。</p></div>","example":{"title":"万能汇总函数","code":"def total(*nums):\n    return sum(nums)\n\ndef report(title, *items, sep=\" | \"):\n    return f\"{title}: \" + sep.join(items)\n\ndef config(**info):\n    for k, v in info.items():\n        print(f\"  {k} = {v}\")\n\nprint(total(1, 2, 3, 4))\nprint(report(\"本周任务\", \"学函数\", \"做练习\", \"写笔记\"))\nprint(report(\"本周任务\", \"学函数\", \"做练习\", sep=\" -> \"))\nconfig(语言=\"Python\", 等级=\"入门\")","stdin":[],"explain":"sep 是关键字专用参数（写在 *items 后面），调用时只能用 sep= 传值。","runnable":true,"notes":[]},"exercises":[{"title":"练习：写两个可变参数函数","task":"<p>实现两个函数：</p>\n<ol><li><code>total(*nums)</code>：返回所有数字的和，一个都不传时返回 0</li><li><code>join_words(*words, sep=\"-\")</code>：用 sep 把单词拼起来，默认用短横线</li></ol>","starter":"def total(*nums):\n    # 返回和\n\ndef join_words(*words, sep=\"-\"):\n    # 用 sep 拼接\n","stdin":[],"check":{"type":"test","code":"assert \"total\" in globals(), \"没有找到 total 函数\"\nassert \"join_words\" in globals(), \"没有找到 join_words 函数\"\nassert total() == 0, \"没有参数时应该返回 0\"\nassert total(1, 2, 3) == 6, \"total(1, 2, 3) 应该是 6\"\nassert total(10) == 10, \"total(10) 应该是 10\"\nassert join_words(\"a\", \"b\") == \"a-b\", \"默认应该用短横线连接\"\nassert join_words(\"a\", \"b\", sep=\"+\") == \"a+b\", \"sep 参数应该生效\""},"hint":"用内置的 sum(nums) 最省事；拼接用 sep.join(words)。","walkthrough":[],"solution":"def total(*nums):\n    return sum(nums)\n\ndef join_words(*words, sep=\"-\"):\n    return sep.join(words)"}],"quiz":{"q":"函数里 def f(*args) 的 args 是什么类型？","options":["列表","元组","字典","集合"],"answer":1,"explain":"*args 收集成元组，**kwargs 收集成字典。"},"localOnly":false},{"id":"c7l4","title":"lambda 与排序的 key","chapter_title":"第 7 章 · 写得更专业","chapter_id":"c7","minutes":14,"level":"进阶","goal":"会用 key 函数按规则排序，会写简单的 lambda。","theory":"<h3>sorted 的 key 参数</h3>\n<pre class=\"snippet\"><code>nums = [3, 1, 2]\nprint(sorted(nums))                          # [1, 2, 3]\n\nwords = [\"pear\", \"fig\", \"apple\"]\nprint(sorted(words, key=len))                # ['fig', 'pear', 'apple']</code></pre>\n<p><code>key</code> 接收一个函数，<code>sorted</code> 会先把每个元素交给它算出一个「排序依据」，再按依据排序。</p>\n<h3>lambda：用完就扔的小函数</h3>\n<pre class=\"snippet\"><code>double = lambda x: x * 2        # 等价于 def double(x): return x * 2\nprint(double(5))</code></pre>\n<p>lambda 只能写一个表达式，适合当场用一次的场景，最典型就是排序：</p>\n<pre class=\"snippet\"><code>students = [{\"name\": \"小明\", \"score\": 88}, {\"name\": \"小红\", \"score\": 95}]\nstudents.sort(key=lambda s: s[\"score\"], reverse=True)\nprint(students[0][\"name\"])      # 小红</code></pre>\n<h3>多级排序：key 返回元组</h3>\n<pre class=\"snippet\"><code># 先按分数从高到低，分数一样就按名字升序\nstudents.sort(key=lambda s: (-s[\"score\"], s[\"name\"]))</code></pre>\n<p>加负号就是把「升序」变成「降序」。</p>\n<h3>其他常用组合</h3>\n<pre class=\"snippet\"><code>data = {\"a\": 3, \"b\": 9, \"c\": 5}\nprint(sorted(data.items(), key=lambda kv: kv[1], reverse=True))\nprint(max(data, key=data.get))      # 值最大的键：b</code></pre>\n<div class=\"callout\"><p>提示：<code>key=len</code>、<code>key=str.lower</code>、<code>key=abs</code> 这类现成函数直接用就好，不用非套 lambda。</p></div>","example":{"title":"做一张排行榜","code":"students = [\n    {\"name\": \"小明\", \"score\": 88},\n    {\"name\": \"小红\", \"score\": 95},\n    {\"name\": \"小刚\", \"score\": 88},\n]\n\nstudents.sort(key=lambda s: (-s[\"score\"], s[\"name\"]))\n\nfor i, s in enumerate(students, start=1):\n    print(f\"{i}. {s['name']} {s['score']} 分\")","stdin":[],"explain":"enumerate(列表, start=1) 让编号从 1 开始，比手写 i + 1 更清楚。","runnable":true,"notes":[]},"exercises":[{"title":"练习：按长度和字母排序","task":"<p>已有 <code>words = [\"pear\", \"fig\", \"apple\", \"kiwi\", \"date\"]</code>。</p>\n<p>按<strong>长度从长到短</strong>排序，长度相同时按<strong>字母从小到大的顺序</strong>，输出：</p>\n<pre class=\"snippet\"><code>['apple', 'date', 'kiwi', 'pear', 'fig']</code></pre>","starter":"words = [\"pear\", \"fig\", \"apple\", \"kiwi\", \"date\"]\n# 提示：key 返回元组 (-长度, 单词)","stdin":[],"check":{"type":"output","expect":"['apple', 'date', 'kiwi', 'pear', 'fig']"},"hint":"sorted(words, key=lambda w: (-len(w), w))","walkthrough":[],"solution":"words = [\"pear\", \"fig\", \"apple\", \"kiwi\", \"date\"]\nresult = sorted(words, key=lambda w: (-len(w), w))\nprint(result)"}],"quiz":{"q":"sorted(words, key=len) 表示什么？","options":["按单词内容排序","按单词长度排序","反转顺序","报错"],"answer":1,"explain":"key 指定排序依据，len 表示用每个元素的长度作为依据。"},"localOnly":false},{"id":"c7l5","title":"把自己的代码变成模块","chapter_title":"第 7 章 · 写得更专业","chapter_id":"c7","minutes":15,"level":"进阶","goal":"理解模块和包，会用 if __name__ == \"__main__\" 让文件既能运行又能被导入。","theory":"<h3>一个 .py 文件就是一个模块</h3>\n<p>假设你写了 <code>mytool.py</code>：</p>\n<pre class=\"snippet\"><code>def double(x):\n    return x * 2\n\ndef shout(text):\n    return text.upper() + \"!\"</code></pre>\n<p>在同一个文件夹的 <code>main.py</code> 里就能这样用：</p>\n<pre class=\"snippet\"><code>import mytool\nprint(mytool.double(21))\n\nfrom mytool import shout\nprint(shout(\"hello\"))</code></pre>\n<p>三种导入方式：</p>\n<table><thead><tr><th>写法</th><th>用法</th><th>适合</th></tr></thead><tbody><tr><td><code>import mytool</code></td><td><code>mytool.double(3)</code></td><td>想看清来源</td></tr><tr><td><code>from mytool import double</code></td><td><code>double(3)</code></td><td>用得最多的函数</td></tr><tr><td><code>import mytool as t</code></td><td><code>t.double(3)</code></td><td>名字太长时</td></tr></tbody></table>\n<h3>if __name__ == \"__main__\"：这段只在直接运行时执行</h3>\n<pre class=\"snippet\"><code>def double(x):\n    return x * 2\n\nif __name__ == \"__main__\":\n    print(double(21))      # 直接运行本文件时才打印</code></pre>\n<p>当这个文件<strong>被别人导入</strong>时，<code>__name__</code> 不是 <code>\"__main__\"</code>，这段就不会执行——这样就不会在你导入模块时莫名其妙地打印一堆东西。</p>\n<h3>包：文件夹装的模块</h3>\n<pre class=\"snippet\"><code>myproject/\n    main.py\n    utils/\n        __init__.py\n        text.py\n        numbers.py</code></pre>\n<pre class=\"snippet\"><code>from utils import text          # 导入包里的模块\nprint(text.clean(\"  hi  \"))</code></pre>\n<div class=\"callout\"><p>提示：标准库、第三方库、自己写的模块，导入方式完全一样。你现在已经会读别人的库文档了。</p></div>","example":{"title":"既能当脚本又能当模块","code":"import statistics\n\ndef average(nums):\n    return sum(nums) / len(nums)\n\ndef middle(nums):\n    return statistics.median(nums)\n\nif __name__ == \"__main__\":\n    data = [88, 92, 79, 95, 70]\n    print(f\"平均分 {average(data):.1f}\")\n    print(f\"中位数 {middle(data)}\")","stdin":[],"explain":"在这个网页里，你的代码是被当作主程序执行的，所以 __name__ 正好等于 __main__，会打印出来。","runnable":true,"notes":[]},"exercises":[{"title":"练习：借用 statistics 模块","task":"<p>导入 <code>statistics</code> 模块，用它的 <code>median</code> 函数求下面数据的中位数并打印：</p>\n<pre class=\"snippet\"><code>中位数 88</code></pre>","starter":"# 第 1 步：导入 statistics\n\ndata = [88, 92, 79, 95, 70]\n# 打印中位数","stdin":[],"check":{"type":"output","expect":"中位数 88"},"hint":"import statistics 之后调用 statistics.median(data)。","walkthrough":[],"solution":"import statistics\n\ndata = [88, 92, 79, 95, 70]\nprint(f\"中位数 {statistics.median(data)}\")"}],"quiz":{"q":"if __name__ == \"__main__\": 里的代码什么时候会执行？","options":["任何时候","只有直接运行这个文件时","只有被导入时","永远不执行"],"answer":1,"explain":"被导入时 __name__ 是模块名，只有直接运行时才是 __main__。"},"localOnly":false},{"id":"c7l6","title":"代码规范与调试技巧","chapter_title":"第 7 章 · 写得更专业","chapter_id":"c7","minutes":14,"level":"进阶","goal":"写出别人看得懂的代码，并掌握三种实用的调试方法。","theory":"<h3>命名规范（PEP 8）</h3>\n<table><thead><tr><th>对象</th><th>写法</th><th>例子</th></tr></thead><tbody><tr><td>变量、函数</td><td>小写加下划线</td><td><code>total_price</code>、<code>find_user</code></td></tr><tr><td>常量</td><td>全大写</td><td><code>TAX_RATE = 0.1</code></td></tr><tr><td>类</td><td>首字母大写</td><td><code>class Student</code></td></tr><tr><td>「内部使用」</td><td>前面加下划线</td><td><code>_helper()</code></td></tr></tbody></table>\n<h3>让代码清爽的几条</h3>\n<ul><li>缩进统一 4 个空格，不要混用 Tab。</li><li>每行别太长，一行超过 100 个字符就该换行。</li><li>函数之间空一行，逻辑分组之间空一行。</li><li>import 放文件最上面，顺序：标准库 → 第三方库 → 自己写的模块。</li><li>别写魔法数字：<code>0.1</code> 直接写在代码里，三个月后没人知道它是什么。提成常量 <code>TAX_RATE = 0.1</code>。</li></ul>\n<h3>三种调试方法</h3>\n<p><strong>方法一：把变量打印出来</strong></p>\n<pre class=\"snippet\"><code>print(f\"调试：total = {total}, count = {count}\")</code></pre>\n<p><strong>方法二：缩小范围</strong></p>\n<p>把怀疑的一半代码注释掉（前面加 <code>#</code>），如果错误消失，问题就在被注释的那一半里。</p>\n<p><strong>方法三：用 assert 写死你的期待</strong></p>\n<pre class=\"snippet\"><code>def average(nums):\n    result = sum(nums) / len(nums)\n    assert 0 &lt;= result &lt;= 100, f\"平均分不合理：{result}\"\n    return result</code></pre>\n<p>断言失败会立刻报错并告诉你是哪个值不对，比后面出错再回头找要快得多。</p>\n<h3>坏味道清单</h3>\n<ul><li>同名变量在不同地方代表不同的东西。</li><li>一个函数干三件事，长度超过 50 行。</li><li>复制粘贴三遍的代码——那就该抽成函数了。</li><li>变量名叫 <code>a</code>、<code>x1</code>、<code>temp2</code>。</li></ul>\n<div class=\"callout\"><p>提示：命名想不出来，往往说明这段代码的职责还不清楚。先把名字想清楚再写。参数名也一样重要。</p></div>","example":{"title":"从坏代码到好代码","code":"# 坏味道版本：魔法数字 + 名字不清楚\ndef f(x):\n    return x * 1.1\n\n# 清爽版本：常量 + 清楚的名字 + 处理小数尾巴\nTAX_RATE = 0.1\n\ndef with_tax(price):\n    return round(price * (1 + TAX_RATE), 2)\n\nprint(f(100))\nprint(with_tax(100))","stdin":[],"explain":"两个函数的数学结果一样，但第二个版本三个月后你自己也看得懂。","runnable":true,"notes":[]},"exercises":[{"title":"练习：消灭魔法数字","task":"<p>下面这段代码里税率 0.1 是魔法数字，请把它提成常量 <code>TAX_RATE</code>，</p>\n<p>让 <code>with_tax(80)</code> 返回 <code>88.0</code>。</p>\n<p>（检查时会同时验证常量存在和函数结果）</p>","starter":"def with_tax(price):\n    return price * 1.1      # 0.1 是魔法数字\n\nprint(with_tax(80))","stdin":[],"check":{"type":"test","code":"assert \"TAX_RATE\" in globals(), \"请把税率提成一个常量 TAX_RATE\"\nassert TAX_RATE == 0.1, \"TAX_RATE 应该等于 0.1\"\nassert \"with_tax\" in globals(), \"没有找到 with_tax 函数\"\nassert with_tax(80) == 88.0, \"with_tax(80) 应该返回 88.0（注意小数尾巴，用 round）\""},"hint":"在函数外面写 TAX_RATE = 0.1，函数里用 round(price * (1 + TAX_RATE), 2)。","walkthrough":[],"solution":"TAX_RATE = 0.1\n\ndef with_tax(price):\n    return round(price * (1 + TAX_RATE), 2)\n\nprint(with_tax(80))"}],"quiz":{"q":"按 PEP 8，变量名应该怎么写？","options":["totalPrice","total_price","TotalPrice","TOTALPRICE"],"answer":1,"explain":"变量和函数用小写加下划线；类的名字才用大驼峰。"},"localOnly":false}]},{"id":"c8","title":"第 8 章 · 面向对象入门","summary":"把「数据」和「操作数据的方法」打包在一起，写出更像真实世界的代码。","lessons":[{"id":"c8l1","title":"为什么需要类","chapter_title":"第 8 章 · 面向对象入门","chapter_id":"c8","minutes":14,"level":"进阶","goal":"理解类与对象的关系，会写最简单的类和实例。","theory":"<h3>用字典表示学生，问题在哪</h3>\n<pre class=\"snippet\"><code>student = {\"name\": \"小明\", \"score\": 88}\nprint(student[\"name\"])</code></pre>\n<p>字典能存数据，但它<strong>没有行为</strong>：想算这学生的等级，还得写一个额外的函数把字典传进去。而且字段名打错（<code>student[\"nane\"]</code>）要到运行时才发现。</p>\n<h3>类：自己定义一种「数据类型」</h3>\n<pre class=\"snippet\"><code>class Student:\n    def __init__(self, name, score):\n        self.name = name\n        self.score = score\n\nming = Student(\"小明\", 88)\nprint(ming.name, ming.score)      # 小明 88</code></pre>\n<p>两个新词：</p>\n<ul><li><strong>类（class）</strong>：模板，比如「学生」这个概念。<code>Student</code> 本身就是类。</li><li><strong>对象（实例）</strong>：按模板做出来的具体东西。<code>ming</code> 是一个对象。</li></ul>\n<p><code>self</code> 表示「这个对象自己」。<code>__init__</code> 是初始化方法，创建对象时自动调用。</p>\n<h3>类能做的事，字典做不到</h3>\n<pre class=\"snippet\"><code>class Student:\n    def __init__(self, name, score):\n        self.name = name\n        self.score = score\n\n    def level(self):\n        if self.score &gt;= 90:\n            return \"优秀\"\n        elif self.score &gt;= 60:\n            return \"及格\"\n        return \"不及格\"\n\nprint(ming.level())      # 数据和操作在一起了</code></pre>\n<div class=\"callout\"><p>提示：不要为了用类而用类。数据简单、操作少的时候字典就够了；当「一堆数据总是搭配同样几个操作」时，类会更合适。</p></div>","example":{"title":"第一个类","code":"class Student:\n    def __init__(self, name, score):\n        self.name = name\n        self.score = score\n\nming = Student(\"小明\", 88)\nhong = Student(\"小红\", 95)\n\nprint(ming.name, ming.score)\nprint(hong.name, hong.score)","stdin":[],"explain":"同一个类可以造出很多对象，各自的数据互不影响。","runnable":true,"notes":[]},"exercises":[{"title":"练习：定义 Dog 类","task":"<p>定义 <code>Dog</code> 类，初始化时接收 <code>name</code> 和 <code>age</code> 两个参数，分别存到 <code>self.name</code>、<code>self.age</code>。</p>\n<p>然后创建对象 <code>dog = Dog(\"旺财\", 3)</code> 并打印：</p>\n<pre class=\"snippet\"><code>旺财 3</code></pre>","starter":"class Dog:\n    def __init__(self, name, age):\n        # 把参数存到 self 上\n\n# 创建对象并打印","stdin":[],"check":{"type":"output","expect":"旺财 3"},"hint":"self.name = name，然后 print(dog.name, dog.age)。","walkthrough":[],"solution":"class Dog:\n    def __init__(self, name, age):\n        self.name = name\n        self.age = age\n\ndog = Dog(\"旺财\", 3)\nprint(dog.name, dog.age)"}],"quiz":{"q":"创建对象时自动调用的方法是？","options":["__main__","__init__","__call__","__new__wind"],"answer":1,"explain":"创建对象时 Python 会自动调用 __init__ 做初始化。"},"localOnly":false},{"id":"c8l2","title":"__init__ 与 self 讲透","chapter_title":"第 8 章 · 面向对象入门","chapter_id":"c8","minutes":14,"level":"进阶","goal":"彻底搞清 self 的含义，会给对象加属性和默认值。","theory":"<h3>self 就是「这个对象自己」</h3>\n<pre class=\"snippet\"><code>class Counter:\n    def __init__(self, start=0):\n        self.count = start          # 给这个对象挂一个属性\n\nc1 = Counter()\nc2 = Counter(10)\nprint(c1.count, c2.count)          # 0 10</code></pre>\n<p>调用 <code>c1.__init__()</code> 时，Python 偷偷把 <code>c1</code> 作为第一个参数传进去，所以在方法里 <code>self</code> 就是 <code>c1</code>。</p>\n<h3>属性可以随时加、随时改</h3>\n<pre class=\"snippet\"><code>class Student:\n    def __init__(self, name, score=0):\n        self.name = name\n        self.score = score\n\ns = Student(\"小明\")\ns.score = 88          # 改属性\ns.city = \"杭州\"        # 加新属性（可行，但不推荐，容易乱）\nprint(s.score, s.city)</code></pre>\n<h3>常见的三个错</h3>\n<pre class=\"snippet\"><code>class A:\n    def __init__(self, x):\n        x = x                  # 错：只改了局部变量，对象身上什么都没有\n\n    def show(self):\n        print(self.x)          # 报 AttributeError</code></pre>\n<ul><li>忘了写 <code>self.</code>：数据只活在函数里，对象拿不到。</li><li>忘了在方法定义里写 <code>self</code> 参数：调用时报「参数个数不对」。</li><li>在类里直接写 <code>name = \"小明\"</code>：那是<strong>所有对象共享</strong>的类属性，不是每个对象自己的。想独立就用 <code>self.name</code>。</li></ul>\n<div class=\"callout\"><p>提示：<code>self</code> 这个名字是习惯，不是关键字，但请别改名，全世界都这么写。</p></div>","example":{"title":"两个对象互不干扰","code":"class BankAccount:\n    def __init__(self, owner, balance=0):\n        self.owner = owner\n        self.balance = balance\n\na = BankAccount(\"小明\", 100)\nb = BankAccount(\"小红\")\n\na.balance += 50\nprint(a.owner, a.balance)\nprint(b.owner, b.balance)","stdin":[],"explain":"给 a 加钱完全不影响 b，因为余额挂在各自的对象上。","runnable":true,"notes":[]},"exercises":[{"title":"练习：Rectangle 类","task":"<p>定义 <code>Rectangle</code> 类，接收 <code>width</code> 和 <code>height</code>，存成同名属性。</p>\n<p>然后打印 <code>r.width * r.height</code>（面积），输出：<code>12</code></p>","starter":"class Rectangle:\n    def __init__(self, width, height):\n        # 存两个属性\n\nr = Rectangle(3, 4)\n# 打印面积","stdin":[],"check":{"type":"test","code":"assert \"Rectangle\" in globals(), \"没有找到 Rectangle 类\"\nr = Rectangle(3, 4)\nassert r.width == 3, \"width 属性没存对\"\nassert r.height == 4, \"height 属性没存对\"\nr2 = Rectangle(5, 2)\nassert r2.width == 5 and r2.height == 2, \"换一组参数也应该正确\""},"hint":"self.width = width，self.height = height。","walkthrough":[],"solution":"class Rectangle:\n    def __init__(self, width, height):\n        self.width = width\n        self.height = height\n\nr = Rectangle(3, 4)\nprint(r.width * r.height)"}],"quiz":{"q":"方法定义里的 self 代表什么？","options":["类本身","调用这个方法的对象","一个固定的全局变量","参数名，随便写"],"answer":1,"explain":"self 指向调用该方法的那个对象，Python 会自动传入。"},"localOnly":false},{"id":"c8l3","title":"方法：让对象会做事","chapter_title":"第 8 章 · 面向对象入门","chapter_id":"c8","minutes":15,"level":"进阶","goal":"会写带参数和返回值的方法，能用方法修改对象自己的状态。","theory":"<h3>方法就是「写在类里的函数」</h3>\n<pre class=\"snippet\"><code>class Counter:\n    def __init__(self, start=0):\n        self.count = start\n\n    def add(self, n=1):\n        self.count += n\n        return self.count\n\nc = Counter()\nc.add()\nc.add(5)\nprint(c.count)      # 6</code></pre>\n<p>方法的第一个参数永远是 <code>self</code>，调用时<strong>不用自己传</strong>。</p>\n<h3>修改对象状态的两种风格</h3>\n<pre class=\"snippet\"><code># 风格一：直接改自己（原地修改）\ndef deposit(self, amount):\n    self.balance += amount\n\n# 风格二：不改自己，返回新值（更安全）\ndef with_interest(self, rate):\n    return self.balance * (1 + rate)</code></pre>\n<p>两种都能用，一个类里最好保持一致。</p>\n<h3>方法里可以调用别的方法</h3>\n<pre class=\"snippet\"><code>class BankAccount:\n    def __init__(self, owner, balance=0):\n        self.owner = owner\n        self.balance = balance\n\n    def can_afford(self, amount):\n        return amount &lt;= self.balance\n\n    def withdraw(self, amount):\n        if not self.can_afford(amount):\n            return \"余额不足\"\n        self.balance -= amount\n        return f\"取款成功，余额 {self.balance}\"</code></pre>\n<div class=\"callout\"><p>提示：方法名用动词或「动词 + 名词」：<code>add</code>、<code>withdraw</code>、<code>can_afford</code>。读起来就像一句话。</p></div>","example":{"title":"一个能取钱的账户","code":"class BankAccount:\n    def __init__(self, owner, balance=0):\n        self.owner = owner\n        self.balance = balance\n\n    def deposit(self, amount):\n        self.balance += amount\n        return self.balance\n\n    def withdraw(self, amount):\n        if amount > self.balance:\n            return \"余额不足\"\n        self.balance -= amount\n        return f\"取款成功，余额 {self.balance}\"\n\nacc = BankAccount(\"小明\", 100)\nprint(acc.deposit(50))\nprint(acc.withdraw(30))\nprint(acc.withdraw(1000))","stdin":[],"explain":"the withdraw 里用 self.balance 判断和修改，这就是「对象自己管好自己的数据」。","runnable":true,"notes":[]},"exercises":[{"title":"练习：Counter 计数器","task":"<p>定义 <code>Counter</code> 类：</p>\n<ul><li>初始化时可传 <code>start</code>，默认 0，存到 <code>self.count</code></li><li>方法 <code>add(n=1)</code>：把 count 加上 n</li><li>方法 <code>reset()</code>：把 count 归零</li></ul>","starter":"class Counter:\n    def __init__(self, start=0):\n        # 保存初始值\n\n    def add(self, n=1):\n        # 加上 n\n\n    def reset(self):\n        # 归零\n","stdin":[],"check":{"type":"test","code":"assert \"Counter\" in globals(), \"没有找到 Counter 类\"\nc = Counter()\nassert c.count == 0, \"默认应该是 0\"\nc.add()\nassert c.count == 1, \"add() 默认加 1\"\nc.add(5)\nassert c.count == 6, \"add(5) 应该加 5\"\nc.reset()\nassert c.count == 0, \"reset() 应该归零\"\nc2 = Counter(10)\nassert c2.count == 10, \"初始化参数没生效\""},"hint":"self.count += n；reset 里写 self.count = 0。","walkthrough":[],"solution":"class Counter:\n    def __init__(self, start=0):\n        self.count = start\n\n    def add(self, n=1):\n        self.count += n\n\n    def reset(self):\n        self.count = 0"}],"quiz":{"q":"调用对象的方法时，需要手动传 self 吗？","options":["需要","不需要，Python 自动传入","只有类方法才需要","看参数数量"],"answer":1,"explain":"Python 会把这个对象自动作为第一个参数传进去。"},"localOnly":false},{"id":"c8l4","title":"继承：在别人的基础上改","chapter_title":"第 8 章 · 面向对象入门","chapter_id":"c8","minutes":15,"level":"进阶","goal":"会用继承复用代码，会重写父类方法，会用 super()。","theory":"<h3>继承的基本写法</h3>\n<pre class=\"snippet\"><code>class Animal:\n    def __init__(self, name):\n        self.name = name\n\n    def speak(self):\n        return \"...\"\n\nclass Dog(Animal):          # 括号里写父类\n    def speak(self):        # 重写父类的方法\n        return \"汪\"\n\nprint(Dog(\"旺财\").speak())    # 汪</code></pre>\n<p><code>Dog</code> 自动拥有了 <code>Animal</code> 的一切，只需要写出<strong>不一样</strong>的地方。</p>\n<h3>super()：调用父类的版本</h3>\n<pre class=\"snippet\"><code>class Student(Animal):\n    def __init__(self, name, school):\n        super().__init__(name)     # 先把父类该做的事做了\n        self.school = school</code></pre>\n<p>忘了写 <code>super().__init__(...)</code>，父类里设置的属性就会丢失，后面一用就 <code>AttributeError</code>。</p>\n<h3>判断类型</h3>\n<pre class=\"snippet\"><code>d = Dog(\"旺财\")\nprint(isinstance(d, Dog))       # True\nprint(isinstance(d, Animal))    # True，子类也是父类的一种</code></pre>\n<h3>什么时候用继承</h3>\n<ul><li>用：几个类确实是「同一类东西，只有细节不同」——猫狗都是动物。</li><li>别用：只是碰巧有几个方法一样——那就把公共部分抽成一个函数或模块，而不是硬套继承。</li></ul>\n<div class=\"callout warn\"><p>注意：继承层级不要超过两三层，超过之后读代码会非常累。组合（把对象放进属性里）往往比深层继承更好。</p></div>","example":{"title":"动物叫声大会","code":"class Animal:\n    def __init__(self, name):\n        self.name = name\n\n    def speak(self):\n        return \"...\"\n\n    def intro(self):\n        return f\"我是 {self.name}，{self.speak()}\"\n\nclass Dog(Animal):\n    def speak(self):\n        return \"汪\"\n\nclass Cat(Animal):\n    def speak(self):\n        return \"喵\"\n\nfor a in [Dog(\"旺财\"), Cat(\"咪咪\"), Animal(\"神秘动物\")]:\n    print(a.intro())","stdin":[],"explain":"intro 只在父类写了一次，三个子类都能用，这就是继承省下的代码。","runnable":true,"notes":[]},"exercises":[{"title":"练习：写两个会叫的子类","task":"<p>已有父类 <code>Animal</code>（有 <code>name</code> 属性和 <code>speak()</code> 方法）。</p>\n<p>请写两个子类：</p>\n<ul><li><code>Cat</code>：<code>speak()</code> 返回 <code>\"喵\"</code></li><li><code>Dog</code>：<code>speak()</code> 返回 <code>\"汪\"</code>，并且构造函数多接收一个 <code>breed</code> 存成属性</li></ul>","starter":"class Animal:\n    def __init__(self, name):\n        self.name = name\n\n    def speak(self):\n        return \"...\"\n\n# 在这里写 Cat 和 Dog","stdin":[],"check":{"type":"test","code":"assert \"Cat\" in globals() and \"Dog\" in globals(), \"Cat 和 Dog 都要定义\"\nassert issubclass(Cat, Animal), \"Cat 应该继承 Animal\"\nassert issubclass(Dog, Animal), \"Dog 应该继承 Animal\"\nassert Cat(\"咪咪\").speak() == \"喵\", \"猫要喵\"\nassert Dog(\"旺财\", \"柴犬\").speak() == \"汪\", \"狗要汪\"\nassert Dog(\"旺财\", \"柴犬\").breed == \"柴犬\", \"Dog 要保存 breed\"\nassert Cat(\"咪咪\").name == \"咪咪\", \"别忘了调用父类的 __init__\"\nassert Animal(\"神秘\").speak() == \"...\", \"不要改动父类行为\""},"hint":"Cat 里写 def speak(self): return \"喵\"；Dog 的 __init__ 先 super().__init__(name)，再 self.breed = breed。","walkthrough":[],"solution":"class Animal:\n    def __init__(self, name):\n        self.name = name\n\n    def speak(self):\n        return \"...\"\n\nclass Cat(Animal):\n    def speak(self):\n        return \"喵\"\n\nclass Dog(Animal):\n    def __init__(self, name, breed):\n        super().__init__(name)\n        self.breed = breed\n\n    def speak(self):\n        return \"汪\""}],"quiz":{"q":"子类构造函数里忘记调用 super().__init__() 会怎样？","options":["没事，照样能跑","父类设置的属性不存在，用到就报错","父类会被删除","会自动调用"],"answer":1,"explain":"父类的初始化不会自动执行，父类属性就缺失了。"},"localOnly":false},{"id":"c8l5","title":"__str__ 与魔术方法初识","chapter_title":"第 8 章 · 面向对象入门","chapter_id":"c8","minutes":14,"level":"进阶","goal":"让对象打印出来是人话，了解魔术方法的作用。","theory":"<h3>默认打印很难看</h3>\n<pre class=\"snippet\"><code>class Student:\n    def __init__(self, name, score):\n        self.name = name\n        self.score = score\n\nprint(Student(\"小明\", 88))\n# &lt;__main__.Student object at 0x7f8b1c0d4a60&gt;   ← 看不懂</code></pre>\n<h3>__str__ 定义「打印出来长什么样」</h3>\n<pre class=\"snippet\"><code>class Student:\n    def __init__(self, name, score):\n        self.name = name\n        self.score = score\n\n    def __str__(self):\n        return f\"{self.name}（{self.score} 分）\"\n\nprint(Student(\"小明\", 88))       # 小明（88 分）\nprint(f\"学生：{Student('小红', 95)}\")</code></pre>\n<h3>其他常用魔术方法</h3>\n<table><thead><tr><th>方法</th><th>触发时机</th><th>例子</th></tr></thead><tbody><tr><td><code>__str__</code></td><td><code>print(对象)</code>、<code>str(对象)</code></td><td>给人看的描述</td></tr><tr><td><code>__repr__</code></td><td>在列表里打印、调试</td><td>给程序员看的描述</td></tr><tr><td><code>__len__</code></td><td><code>len(对象)</code></td><td>返回「长度」</td></tr><tr><td><code>__eq__</code></td><td><code>对象1 == 对象2</code></td><td>自己定义相等规则</td></tr><tr><td><code>__lt__</code></td><td><code>对象1 &lt; 对象2</code></td><td>支持排序</td></tr></tbody></table>\n<pre class=\"snippet\"><code>class Playlist:\n    def __init__(self, songs):\n        self.songs = songs\n\n    def __len__(self):\n        return len(self.songs)\n\n    def __str__(self):\n        return f\"歌单（{len(self.songs)} 首）\"\n\nprint(Playlist([\"稻香\", \"晴天\"]))\nprint(len(Playlist([\"稻香\", \"晴天\"])))</code></pre>\n<div class=\"callout\"><p>提示：日常写代码最常用的就是 <code>__str__</code>。加它三行，调试时能省很多时间。</p></div>","example":{"title":"让打印变好看","code":"class Student:\n    def __init__(self, name, score):\n        self.name = name\n        self.score = score\n\n    def __str__(self):\n        return f\"{self.name}（{self.score} 分）\"\n\nstudents = [Student(\"小明\", 88), Student(\"小红\", 95)]\nfor s in students:\n    print(s)\nprint(f\"第一名：{students[1]}\")","stdin":[],"explain":"有了 __str__，对象就能自然地放进 f-string 和 print 里。","runnable":true,"notes":[]},"exercises":[{"title":"练习：给 Money 加 __str__","task":"<p>定义 <code>Money</code> 类，接收 <code>amount</code> 存成属性，并实现 <code>__str__</code> 返回 <code>\"50 元\"</code> 这种格式。</p>\n<p>最后打印 <code>m</code>，输出 <code>50 元</code>。</p>","starter":"class Money:\n    def __init__(self, amount):\n        self.amount = amount\n\n    def __str__(self):\n        # 返回 f\"{self.amount} 元\"\n\nm = Money(50)\n# 打印 m","stdin":[],"check":{"type":"test","code":"assert \"Money\" in globals(), \"没有找到 Money 类\"\nm = Money(50)\nassert m.amount == 50, \"amount 属性没存对\"\nassert str(m) == \"50 元\", \"str(m) 应该返回 50 元\"\nassert str(Money(7)) == \"7 元\", \"换一个数字也应该正确\""},"hint":"def __str__(self): return f\"{self.amount} 元\"","walkthrough":[],"solution":"class Money:\n    def __init__(self, amount):\n        self.amount = amount\n\n    def __str__(self):\n        return f\"{self.amount} 元\"\n\nm = Money(50)\nprint(m)"}],"quiz":{"q":"print(对象) 时会调用哪个方法？","options":["__init__","__print__","__str__","__main__"],"answer":2,"explain":"print 会用 __str__ 把对象转成字符串，没有定义时就用默认的地址写法。"},"localOnly":false}]},{"id":"c9","title":"第 9 章 · 数据与文件进阶","summary":"把程序的结果存下来：异常处理进阶、路径与编码、JSON、CSV，最后做一个报表项目。","lessons":[{"id":"c9l1","title":"异常进阶：精确地兜住问题","chapter_title":"第 9 章 · 数据与文件进阶","chapter_id":"c9","minutes":15,"level":"进阶","goal":"会捕获多种异常、写 else/finally、用 raise 主动报错。","theory":"<h3>一个 try 配多个 except</h3>\n<pre class=\"snippet\"><code>try:\n    age = int(input(\"年龄：\"))\n    print(10 / age)\nexcept ValueError:\n    print(\"请输入数字\")\nexcept ZeroDivisionError:\n    print(\"年龄不可能是 0\")</code></pre>\n<p>Python 会从上往下匹配异常类型，只执行第一个匹配的。</p>\n<h3>一次捕获几种</h3>\n<pre class=\"snippet\"><code>try:\n    do_something()\nexcept (ValueError, TypeError) as e:\n    print(f\"出错了：{e}\")</code></pre>\n<p><code>as e</code> 把异常对象接出来，<code>e</code> 里带着原始的错误信息。</p>\n<h3>else 和 finally</h3>\n<pre class=\"snippet\"><code>try:\n    n = int(\"12\")\nexcept ValueError:\n    print(\"转换失败\")\nelse:\n    print(\"转换成功\", n)      # 没出错才执行\nfinally:\n    print(\"无论如何都执行\")    # 收尾、关文件、解锁</code></pre>\n<h3>raise：主动抛错</h3>\n<pre class=\"snippet\"><code>def set_age(age):\n    if age &lt; 0:\n        raise ValueError(f\"年龄不能是负数：{age}\")\n    return age</code></pre>\n<p>自己写函数时，遇到不该出现的输入就 <code>raise</code>，让错误<strong>尽早</strong>暴露，而不是让它在别的地方变成莫名其妙的 bug。</p>\n<h3>自定义异常</h3>\n<pre class=\"snippet\"><code>class NotEnoughMoneyError(Exception):\n    pass\n\ndef withdraw(balance, amount):\n    if amount &gt; balance:\n        raise NotEnoughMoneyError(f\"余额 {balance} 不足，要取 {amount}\")\n    return balance - amount</code></pre>\n<div class=\"callout warn\"><p>注意：别写光秃秃的 <code>except:</code>。它会连键盘中断、程序退出信号一起吞掉，出问题极难排查。至少要写 <code>except Exception:</code>，最好写清楚具体类型。</p></div>","example":{"title":"安全转换 + 收尾","code":"def safe_int(text, default=0):\n    try:\n        return int(text)\n    except ValueError:\n        return default\n    finally:\n        print(f\"（处理完 {text!r}）\")\n\nprint(safe_int(\"42\"))\nprint(safe_int(\"abc\", -1))","stdin":[],"explain":"finally 里的语句不管成功失败都会执行，所以打印了两行。","runnable":true,"notes":[]},"exercises":[{"title":"练习：安全转换与主动报错","task":"<p>实现两个函数：</p>\n<ol><li><code>safe_int(text, default=0)</code>：能转就返回整数，转不了返回 default</li><li><code>check_age(age)</code>：年龄小于 0 或大于 150 时 <code>raise ValueError</code>，正常时返回 age</li></ol>","starter":"def safe_int(text, default=0):\n    # 用 try / except ValueError\n\ndef check_age(age):\n    # 不合理就 raise ValueError\n","stdin":[],"check":{"type":"test","code":"assert safe_int(\"42\") == 42, \"能转换时要返回整数\"\nassert safe_int(\"abc\") == 0, \"转不了时返回默认值 0\"\nassert safe_int(\"abc\", -1) == -1, \"默认值要能自定义\"\nassert check_age(18) == 18, \"正常年龄应该原样返回\"\ntry:\n    check_age(-1)\n    raise AssertionError(\"负数年龄应该抛出 ValueError\")\nexcept ValueError:\n    pass\ntry:\n    check_age(200)\n    raise AssertionError(\"200 岁应该抛出 ValueError\")\nexcept ValueError:\n    pass"},"hint":"safe_int 用 try: return int(text) / except ValueError: return default；check_age 里 if age < 0 or age > 150: raise ValueError(...)。","walkthrough":[],"solution":"def safe_int(text, default=0):\n    try:\n        return int(text)\n    except ValueError:\n        return default\n\ndef check_age(age):\n    if age < 0 or age > 150:\n        raise ValueError(f\"不合理的年龄：{age}\")\n    return age"}],"quiz":{"q":"下面哪种 except 写法最好？","options":["except:","except Exception:","except ValueError:","except ():"],"answer":2,"explain":"写清楚具体的异常类型，问题才容易被定位，也不会吞掉不该吞的错误。"},"localOnly":false},{"id":"c9l2","title":"路径、编码与大文件","chapter_title":"第 9 章 · 数据与文件进阶","chapter_id":"c9","minutes":15,"level":"进阶","goal":"会用 pathlib 处理路径，用正确编码读写文件，安全地逐行处理大文件。","theory":"<h3>路径：用 pathlib 代替手工拼字符串</h3>\n<pre class=\"snippet\"><code>from pathlib import Path\n\npath = Path(\"data\") / \"scores.txt\"      # 自动用对分隔符\nprint(path)                              # data/scores.txt（Windows 上是 data\\scores.txt）\nprint(path.exists())\nprint(path.suffix)                       # .txt\nprint(path.parent)</code></pre>\n<p>用 <code>Path(\"a\") / \"b.txt\"</code> 拼路径，比 <code>\"a\" + \"/\" + \"b.txt\"</code> 靠谱得多。</p>\n<h3>相对路径 vs 绝对路径</h3>\n<ul><li>相对路径 <code>data/scores.txt</code>：相对于程序当前所在目录。</li><li>绝对路径 <code>C:/work/data/scores.txt</code>：从盘符开始，换目录也能找到。</li></ul>\n<p>程序里尽量用相对路径（把文件放在项目里），换电脑才不会失效。</p>\n<h3>编码：中文必须写 utf-8</h3>\n<pre class=\"snippet\"><code>with open(\"note.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"中文内容\\n\")</code></pre>\n<p>不加 <code>encoding=\"utf-8\"</code>，在 Windows 上读写中文可能报 <code>UnicodeDecodeError</code>。养成习惯：<strong>每次打开文件都写 encoding</strong>。</p>\n<h3>大文件要一行一行读</h3>\n<pre class=\"snippet\"><code># 不太好：一次全读进内存\ntext = f.read()\n\n# 更好：逐行处理，内存占用恒定\nfor line in f:\n    if \"错误\" in line:\n        print(line.strip())</code></pre>\n<h3>常用操作速查</h3>\n<table><thead><tr><th>需求</th><th>写法</th></tr></thead><tbody><tr><td>判断存在</td><td><code>Path(\"a.txt\").exists()</code></td></tr><tr><td>新建目录</td><td><code>Path(\"logs\").mkdir(exist_ok=True)</code></td></tr><tr><td>删除文件</td><td><code>Path(\"a.txt\").unlink()</code></td></tr><tr><td>目录列表</td><td><code>for p in Path(\".\").iterdir(): print(p)</code></td></tr><tr><td>追加内容</td><td><code>open(\"a.txt\", \"a\", encoding=\"utf-8\")</code></td></tr></tbody></table>\n<div class=\"callout\"><p>提示：这个网页平台里的文件保存在浏览器的虚拟文件系统里，刷新页面就没了。要在硬盘上长期保存，请用本机 Python 运行。</p></div>","example":{"title":"写日志、查存在、逐行读","code":"from pathlib import Path\n\nlog = Path(\"app.log\")\n\nwith open(log, \"a\", encoding=\"utf-8\") as f:\n    f.write(\"INFO 程序启动\\n\")\n    f.write(\"ERROR 找不到配置文件\\n\")\n\nprint(f\"文件存在吗？{log.exists()}\")\nprint(f\"后缀：{log.suffix}\")\n\nwith open(log, encoding=\"utf-8\") as f:\n    for line in f:\n        if line.startswith(\"ERROR\"):\n            print(\"发现问题行：\", line.strip())","stdin":[],"explain":"用 a 模式追加，所以多次运行会不断往同一个文件里加内容；用 startswith 只挑出错误行。","runnable":true,"notes":[]},"exercises":[{"title":"练习：追加并读回","task":"<p>向 <code>todo.txt</code> <strong>追加</strong>两行内容：</p>\n<pre class=\"snippet\"><code>1. 学文件读写\n2. 写练习</code></pre>\n<p>然后用逐行读取的方式打印出来（不要多打印空行）。</p>","starter":"# 用 open(..., \"w\", encoding=\"utf-8\") 写入两行\n# 再用 for line in f 逐行打印","stdin":[],"check":{"type":"output","expect":"1. 学文件读写\n2. 写练习"},"hint":"写入时每行结尾加换行符；打印时用 print(line.strip())，否则每行会多一个空行。","walkthrough":[],"solution":"with open(\"todo.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"1. 学文件读写\\n\")\n    f.write(\"2. 写练习\\n\")\n\nwith open(\"todo.txt\", encoding=\"utf-8\") as f:\n    for line in f:\n        print(line.strip())"}],"quiz":{"q":"打开文件时为什么要写 encoding=\"utf-8\"？","options":["速度快","避免中文乱码或报错","必须写，否则语法错误","让文件变小"],"answer":1,"explain":"不指定编码时会用系统默认编码，跨平台读写中文很容易出错。"},"localOnly":false},{"id":"c9l3","title":"JSON：和外部世界交换数据","chapter_title":"第 9 章 · 数据与文件进阶","chapter_id":"c9","minutes":15,"level":"进阶","goal":"会用 json 模块读写 JSON，理解序列化和反序列化。","theory":"<h3>JSON 长什么样</h3>\n<pre class=\"snippet\"><code>{\n  \"name\": \"小明\",\n  \"age\": 18,\n  \"hobbies\": [\"编程\", \"篮球\"],\n  \"address\": {\"city\": \"杭州\"}\n}</code></pre>\n<p>它和 Python 的字典、列表长得几乎一样，是互联网上最通用的数据格式（网页接口、配置文件都用它）。</p>\n<h3>字符串 ↔ Python 对象</h3>\n<pre class=\"snippet\"><code>import json\n\nstudent = {\"name\": \"小明\", \"age\": 18}\n\n# Python 对象 → JSON 字符串（序列化）\ntext = json.dumps(student, ensure_ascii=False, indent=2)\nprint(text)\n\n# JSON 字符串 → Python 对象（反序列化）\ndata = json.loads(text)\nprint(data[\"name\"])</code></pre>\n<ul><li><code>ensure_ascii=False</code>：让中文原样显示，而不是变成 <code>\\u5c0f\\u660e</code>。</li><li><code>indent=2</code>：格式化成好看的缩进版本。</li></ul>\n<h3>读写 JSON 文件</h3>\n<pre class=\"snippet\"><code># 写\nwith open(\"data.json\", \"w\", encoding=\"utf-8\") as f:\n    json.dump(student, f, ensure_ascii=False, indent=2)\n\n# 读\nwith open(\"data.json\", encoding=\"utf-8\") as f:\n    data = json.load(f)\nprint(data)</code></pre>\n<p>记忆窍门：带 <code>s</code> 的是处理<strong>字符串</strong>（dumps / loads），不带 <code>s</code> 的是处理<strong>文件</strong>（dump / load）。</p>\n<table><thead><tr><th>Python 类型</th><th>JSON 类型</th></tr></thead><tbody><tr><td>dict</td><td>object</td></tr><tr><td>list / tuple</td><td>array</td></tr><tr><td>str</td><td>string</td></tr><tr><td>int / float</td><td>number</td></tr><tr><td>True / False</td><td>true / false</td></tr><tr><td>None</td><td>null</td></tr></tbody></table>\n<div class=\"callout warn\"><p>注意：JSON 的键只能是字符串。字典里用数字当键，<code>json.dumps</code> 会自动转成字符串。</p></div>","example":{"title":"把成绩存成 JSON 再读回来","code":"import json\n\nstudents = [\n    {\"name\": \"小明\", \"score\": 88},\n    {\"name\": \"小红\", \"score\": 95},\n]\n\nwith open(\"students.json\", \"w\", encoding=\"utf-8\") as f:\n    json.dump(students, f, ensure_ascii=False, indent=2)\n\nwith open(\"students.json\", encoding=\"utf-8\") as f:\n    loaded = json.load(f)\n\nprint(type(loaded))\nfor s in loaded:\n    print(f\"{s['name']}：{s['score']}\")","stdin":[],"explain":"读回来依然是列表里装字典，可以像普通数据一样遍历。","runnable":true,"notes":[]},"exercises":[{"title":"练习：序列化与反序列化","task":"<p>已有字典 <code>student = {\"name\": \"小明\", \"age\": 18, \"hobbies\": [\"编程\", \"篮球\"]}</code>。</p>\n<p>用 <code>json.dumps</code> 把它转成字符串存进变量 <code>text</code>（中文要原样显示，用 ensure_ascii=False），然后 <code>print(json.loads(text)[\"name\"])</code>。</p>","starter":"import json\n\nstudent = {\"name\": \"小明\", \"age\": 18, \"hobbies\": [\"编程\", \"篮球\"]}\n# 转成字符串存进 text\n\n# 再转回字典，打印 name","stdin":[],"check":{"type":"test","code":"assert \"text\" in globals(), \"请把 dumps 的结果存进变量 text\"\nassert isinstance(text, str), \"text 应该是字符串\"\nassert \"小明\" in text, \"中文要原样显示，记得 ensure_ascii=False\"\ndata = json.loads(text)\nassert data[\"age\"] == 18, \"转回来的字典里 age 应该是 18\"\nassert data[\"hobbies\"] == [\"编程\", \"篮球\"], \"列表也应该被正确还原\""},"hint":"text = json.dumps(student, ensure_ascii=False)，然后 print(json.loads(text)[\"name\"])。","walkthrough":[],"solution":"import json\n\nstudent = {\"name\": \"小明\", \"age\": 18, \"hobbies\": [\"编程\", \"篮球\"]}\ntext = json.dumps(student, ensure_ascii=False)\nprint(json.loads(text)[\"name\"])"}],"quiz":{"q":"json.dumps 和 json.dump 的区别是？","options":["没区别","dumps 返回字符串，dump 写进文件","dumps 只能处理列表","dump 只能处理字典"],"answer":1,"explain":"带 s 的（dumps/loads）处理字符串，不带 s 的（dump/load）处理文件对象。"},"localOnly":false},{"id":"c9l4","title":"CSV：处理表格数据","chapter_title":"第 9 章 · 数据与文件进阶","chapter_id":"c9","minutes":14,"level":"进阶","goal":"会用 csv 模块读写表格数据，并做简单统计。","theory":"<h3>CSV 就是「逗号分隔的表格」</h3>\n<pre class=\"snippet\"><code>name,score\n小明,88\n小红,92</code></pre>\n<p>Excel 能直接打开它，Python 也能直接处理它，是交换表格数据最省事的格式。</p>\n<h3>读 CSV</h3>\n<pre class=\"snippet\"><code>import csv\n\nwith open(\"scores.csv\", encoding=\"utf-8\") as f:\n    reader = csv.reader(f)\n    for row in reader:\n        print(row)          # ['name', 'score'] / ['小明', '88']</code></pre>\n<p>也可以从字符串列表读，方便测试：</p>\n<pre class=\"snippet\"><code>lines = [\"name,score\", \"小明,88\"]\nfor row in csv.reader(lines):\n    print(row)</code></pre>\n<h3>用字典方式读：DictReader</h3>\n<pre class=\"snippet\"><code>with open(\"scores.csv\", encoding=\"utf-8\") as f:\n    for row in csv.DictReader(f):\n        print(row[\"name\"], row[\"score\"])     # 用列名取值，比记下标舒服</code></pre>\n<h3>写 CSV</h3>\n<pre class=\"snippet\"><code>import csv\n\nwith open(\"out.csv\", \"w\", encoding=\"utf-8\", newline=\"\") as f:\n    writer = csv.writer(f)\n    writer.writerow([\"name\", \"score\"])\n    writer.writerows([[\"小明\", 88], [\"小红\", 92]])</code></pre>\n<p>写文件时加 <code>newline=\"\"</code>，否则 Windows 上会出现多余的空行。</p>\n<div class=\"callout warn\"><p>注意：CSV 读出来<strong>全是字符串</strong>，要计算必须自己用 <code>int()</code> 转换。</p></div>","example":{"title":"从 CSV 字符串算出平均分","code":"import csv\n\nlines = [\"name,score\", \"小明,88\", \"小红,92\", \"小刚,75\"]\n\ntotal = 0\ncount = 0\nfor row in csv.reader(lines):\n    if row[0] == \"name\":       # 跳过表头\n        continue\n    total += int(row[1])\n    count += 1\n\nprint(f\"平均分 {total / count:.1f}\")","stdin":[],"explain":"csv.reader 会帮我们处理引号、逗号等细节，比自己写 split(\",\") 更可靠。","runnable":true,"notes":[]},"exercises":[{"title":"练习：统计最高分","task":"<p>用 <code>csv.reader</code> 处理下面的数据，找出最高分并打印：</p>\n<pre class=\"snippet\"><code>最高分 92 小红</code></pre>","starter":"import csv\n\nlines = [\"name,score\", \"小明,88\", \"小红,92\", \"小刚,75\"]\n# 遍历每一行，记录最高分","stdin":[],"check":{"type":"output","expect":"最高分 92 小红"},"hint":"先设 best_score = -1、best_name = \"\"，遇到更大的就更新这两个变量。","walkthrough":[],"solution":"import csv\n\nlines = [\"name,score\", \"小明,88\", \"小红,92\", \"小刚,75\"]\n\nbest_score = -1\nbest_name = \"\"\nfor row in csv.reader(lines):\n    if row[0] == \"name\":\n        continue\n    score = int(row[1])\n    if score > best_score:\n        best_score = score\n        best_name = row[0]\n\nprint(f\"最高分 {best_score} {best_name}\")"}],"quiz":{"q":"用 csv.reader 读出来的数字是什么类型？","options":["int","float","str","自动判断"],"answer":2,"explain":"CSV 里所有内容都是文本，读出来都是字符串，要参与计算必须自己转换。"},"localOnly":false},{"id":"c9l5","title":"项目：生成成绩报表","chapter_title":"第 9 章 · 数据与文件进阶","chapter_id":"c9","minutes":20,"level":"综合","goal":"把前面学的文件、JSON、CSV、函数组合起来，做一个真正有用的小工具。","theory":"<h3>需求</h3>\n<p>手里有一份成绩数据（程序里写死），要生成两个文件：</p>\n<ul><li><code>report.csv</code>：每行一位学生，「姓名,分数,等级」</li><li><code>summary.json</code>：平均分、最高分、及格人数</li></ul>\n<h3>拆解成函数</h3>\n<pre class=\"snippet\"><code>def level_of(score):\n    if score &gt;= 90:\n        return \"优秀\"\n    if score &gt;= 60:\n        return \"及格\"\n    return \"不及格\"\n\ndef build_rows(students):\n    return [[s[\"name\"], s[\"score\"], level_of(s[\"score\"])] for s in students]\n\ndef build_summary(students):\n    scores = [s[\"score\"] for s in students]\n    return {\n        \"平均分\": round(sum(scores) / len(scores), 1),\n        \"最高分\": max(scores),\n        \"及格人数\": sum(1 for s in students if s[\"score\"] &gt;= 60),\n    }</code></pre>\n<h3>写文件</h3>\n<pre class=\"snippet\"><code>import csv, json\n\nwith open(\"report.csv\", \"w\", encoding=\"utf-8\", newline=\"\") as f:\n    writer = csv.writer(f)\n    writer.writerow([\"姓名\", \"分数\", \"等级\"])\n    writer.writerows(build_rows(students))\n\nwith open(\"summary.json\", \"w\", encoding=\"utf-8\") as f:\n    json.dump(build_summary(students), f, ensure_ascii=False, indent=2)</code></pre>\n<h3>为什么要拆成小函数</h3>\n<ul><li><code>level_of</code> 只做一件事，好测试、好复用。</li><li><code>build_rows</code> 和 <code>build_summary</code> 只负责把数据变形状，不碰文件。</li><li>写文件的部分集中在最后几行，改格式时只需要动一处。</li></ul>\n<div class=\"callout\"><p>提示：这就是真实项目里的写法——<strong>数据加工</strong>和<strong>输入输出</strong>分开，中间用普通的数据结构（列表、字典）连接。</p></div>","example":{"title":"完整报表生成器","code":"import csv, json\n\nstudents = [\n    {\"name\": \"小明\", \"score\": 88},\n    {\"name\": \"小红\", \"score\": 95},\n    {\"name\": \"小刚\", \"score\": 55},\n]\n\ndef level_of(score):\n    if score >= 90:\n        return \"优秀\"\n    if score >= 60:\n        return \"及格\"\n    return \"不及格\"\n\nwith open(\"report.csv\", \"w\", encoding=\"utf-8\", newline=\"\") as f:\n    writer = csv.writer(f)\n    writer.writerow([\"姓名\", \"分数\", \"等级\"])\n    for s in students:\n        writer.writerow([s[\"name\"], s[\"score\"], level_of(s[\"score\"])])\n\nwith open(\"report.csv\", encoding=\"utf-8\") as f:\n    for row in csv.reader(f):\n        print(row)","stdin":[],"explain":"写完文件马上读回来打印一遍，是检查格式是否正确的好习惯。","runnable":true,"notes":[]},"exercises":[{"title":"练习：写出汇总文件","task":"<p>把 <code>students</code> 的平均分和最高分写进 <code>summary.json</code>，然后把文件读回来打印：</p>\n<pre class=\"snippet\"><code>平均分 79.3 最高分 95</code></pre>\n<p>（平均分保留 1 位小数）</p>","starter":"import json\n\nstudents = [\n    {\"name\": \"小明\", \"score\": 88},\n    {\"name\": \"小红\", \"score\": 95},\n    {\"name\": \"小刚\", \"score\": 55},\n]\n\n# 算出平均分和最高分，写进 summary.json，再读回来打印","stdin":[],"check":{"type":"output","expect":"平均分 79.3 最高分 95"},"hint":"scores = [s[\"score\"] for s in students]；平均分用 round(sum(scores) / len(scores), 1)，输出时按顺序打印两个数字即可。","walkthrough":[],"solution":"import json\n\nstudents = [\n    {\"name\": \"小明\", \"score\": 88},\n    {\"name\": \"小红\", \"score\": 95},\n    {\"name\": \"小刚\", \"score\": 55},\n]\n\nscores = [s[\"score\"] for s in students]\nsummary = {\n    \"平均分\": round(sum(scores) / len(scores), 1),\n    \"最高分\": max(scores),\n}\n\nwith open(\"summary.json\", \"w\", encoding=\"utf-8\") as f:\n    json.dump(summary, f, ensure_ascii=False)\n\nwith open(\"summary.json\", encoding=\"utf-8\") as f:\n    data = json.load(f)\n\nprint(f\"平均分 {data['平均分']} 最高分 {data['最高分']}\")"}],"quiz":{"q":"CSV 和 JSON 该怎么选？","options":["表格、行列数据用 CSV，层级复杂的数据用 JSON","永远用 JSON","永远用 CSV","随便，都一样"],"answer":0,"explain":"整齐的表格用 CSV（Excel 友好），嵌套结构用 JSON（表达力强）。"},"localOnly":false}]},{"id":"c10","title":"第 10 章 · 算法与解题训练","summary":"从「会写代码」到「会解决问题」：拆题四步法、经典题型、排序查找、递归和效率直觉。","lessons":[{"id":"c10l1","title":"把题目翻译成代码的四步法","chapter_title":"第 10 章 · 算法与解题训练","chapter_id":"c10","minutes":15,"level":"进阶","goal":"掌握拆解陌生问题的固定流程，遇到难题不再发慌。","theory":"<h3>四步法</h3>\n<ol><li><strong>找输入输出</strong>：给什么？要什么？先把类型写出来。</li><li><strong>手算一个例子</strong>：用纸笔写出中间步骤，这步最容易被跳过，也最关键。</li><li><strong>写伪代码</strong>：用中文或半成品代码把步骤写清楚。</li><li><strong>翻译成代码并测试</strong>：先跑最简单的例子，再试边界情况。</li></ol>\n<h3>例题：找出列表中第二大的数</h3>\n<p><strong>第一步</strong>：输入是数字列表，输出是一个数字。</p>\n<p><strong>第二步</strong>：手算 <code>[3, 1, 4, 4, 2]</code>。</p>\n<ul><li>去重后是 <code>[3, 1, 4, 2]</code></li><li>排序后是 <code>[1, 2, 3, 4]</code></li><li>倒数第二个是 <code>3</code>。</li></ul>\n<p><strong>第三步伪代码</strong>：</p>\n<pre class=\"snippet\"><code>去掉重复\n从小到大排序\n如果只剩一个元素 → 说明没有第二大\n返回倒数第二个</code></pre>\n<p><strong>第四步代码</strong>：</p>\n<pre class=\"snippet\"><code>def second_largest(nums):\n    unique = sorted(set(nums))\n    if len(unique) &lt; 2:\n        return None\n    return unique[-2]</code></pre>\n<h3>边界情况：高手和新手的差距在这</h3>\n<ul><li>空列表怎么办？</li><li>只有一个元素怎么办？</li><li>全都是同一个数字怎么办？</li><li>有重复的最大值怎么办？</li></ul>\n<p>写完代码前先问自己这四个问题，能挡掉大部分 bug。</p>\n<div class=\"callout\"><p>提示：先写「能跑通最简单例子」的版本，再补边界处理。不要一开始就想着写最优解。</p></div>","example":{"title":"同一个问题，三种写法","code":"def second_largest_v1(nums):\n    unique = sorted(set(nums))\n    if len(unique) < 2:\n        return None\n    return unique[-2]\n\ndef second_largest_v2(nums):\n    \"\"\"不排序，用一次遍历记录最大和次大\"\"\"\n    first = second = None\n    for n in nums:\n        if first is None or n > first:\n            first, second = n, first\n        elif n != first and (second is None or n > second):\n            second = n\n    return second\n\nfor data in ([3, 1, 4, 4, 2], [5], [], [7, 7]):\n    print(data, second_largest_v1(data), second_largest_v2(data))","stdin":[],"explain":"v1 好懂，v2 快一些但更容易写错。先写 v1，性能不够再优化——这是正确的顺序。","runnable":true,"notes":[]},"exercises":[{"title":"练习：第二大（去重后）","task":"<p>实现 <code>second_largest(nums)</code>：</p>\n<ul><li>返回<strong>去重之后</strong>第二大的数</li><li>不足两个不同的数时返回 <code>None</code></li></ul>","starter":"def second_largest(nums):\n    # 去掉重复 → 排序 → 取倒数第二个\n","stdin":[],"check":{"type":"test","code":"assert \"second_largest\" in globals(), \"没有找到 second_largest 函数\"\nassert second_largest([3, 1, 4, 4, 2]) == 3, \"[3, 1, 4, 4, 2] 的答案是 3\"\nassert second_largest([1, 2]) == 1, \"[1, 2] 的答案是 1\"\nassert second_largest([1, 1, 1]) is None, \"只有一个不同的数时应该返回 None\"\nassert second_largest([]) is None, \"空列表应该返回 None\"\nassert second_largest([-1, -5, -3]) == -3, \"负数也要正确\""},"hint":"unique = sorted(set(nums))，然后判断 len(unique) < 2 时 return None。","walkthrough":[],"solution":"def second_largest(nums):\n    unique = sorted(set(nums))\n    if len(unique) < 2:\n        return None\n    return unique[-2]"}],"quiz":{"q":"四步法里最容易被跳过、却最关键的是哪一步？","options":["找输入输出","手算一个例子","写伪代码","翻译成代码"],"answer":1,"explain":"手算能暴露你对问题的理解漏洞，比盯着屏幕空想有效得多。"},"localOnly":false},{"id":"c10l2","title":"字符串与列表经典题","chapter_title":"第 10 章 · 算法与解题训练","chapter_id":"c10","minutes":16,"level":"进阶","goal":"掌握反转、回文、去重、计数这些高频小题的套路。","theory":"<h3>反转</h3>\n<pre class=\"snippet\"><code>s = \"python\"\nprint(s[::-1])              # nohtyp     切片翻转\nnums = [1, 2, 3]\nprint(nums[::-1])           # [3, 2, 1]\nnums.reverse()              # 原地翻转</code></pre>\n<p><code>[::-1]</code> 的意思是「从头到尾、步长为 -1」，也就是倒着取。</p>\n<h3>回文：正着读反着读一样</h3>\n<pre class=\"snippet\"><code>def is_palindrome(text):\n    cleaned = text.lower().replace(\" \", \"\")\n    return cleaned == cleaned[::-1]\n\nprint(is_palindrome(\"上海自来水来自海上\"))    # True</code></pre>\n<h3>去重但保持原顺序</h3>\n<pre class=\"snippet\"><code>def unique_in_order(items):\n    seen = set()\n    result = []\n    for x in items:\n        if x not in seen:\n            seen.add(x)\n            result.append(x)\n    return result</code></pre>\n<p>这里用集合 <code>seen</code> 记录见过的元素：集合查找是\"瞬间\"完成的，比用列表查找快得多。这个「用集合记住见过的」套路在算法题里非常常见。</p>\n<h3>计数</h3>\n<pre class=\"snippet\"><code>text = \"banana\"\ncounts = {}\nfor ch in text:\n    counts[ch] = counts.get(ch, 0) + 1\nprint(counts)              # {'b': 1, 'a': 3, 'n': 2}</code></pre>\n<table><thead><tr><th>需求</th><th>套路</th></tr></thead><tbody><tr><td>反转</td><td><code>s[::-1]</code></td></tr><tr><td>回文</td><td>洗干净后和反转比较</td></tr><tr><td>去重保序</td><td>集合记录 + 列表收集</td></tr><tr><td>计数</td><td>字典 + <code>get(x, 0) + 1</code></td></tr><tr><td>找最大</td><td><code>max(数据, key=...)</code></td></tr></tbody></table>\n<div class=\"callout\"><p>提示：切片、字典、集合是这类题的三板斧。想不出来的时候，先问自己「能不能用字典记点什么」。</p></div>","example":{"title":"三个套路一次看完","code":"def is_palindrome(text):\n    cleaned = text.lower().replace(\" \", \"\")\n    return cleaned == cleaned[::-1]\n\ndef unique_in_order(items):\n    seen = set()\n    result = []\n    for x in items:\n        if x not in seen:\n            seen.add(x)\n            result.append(x)\n    return result\n\nprint(is_palindrome(\"上海自来水来自海上\"))\nprint(is_palindrome(\"Python\"))\nprint(unique_in_order([3, 1, 3, 2, 1]))","stdin":[],"explain":"注意 unique_in_order 返回的顺序是 3, 1, 2——保留了第一次出现的顺序，而不是排序。","runnable":true,"notes":[]},"exercises":[{"title":"练习：写两个工具函数","task":"<p>实现两个函数：</p>\n<ol><li><code>is_palindrome(text)</code>：忽略大小写和空格后判断回文</li><li><code>count_chars(text)</code>：返回一个字典，统计每个字符出现的次数</li></ol>","starter":"def is_palindrome(text):\n    # 忽略大小写和空格\n\ndef count_chars(text):\n    # 返回 {字符: 次数}\n","stdin":[],"check":{"type":"test","code":"assert is_palindrome(\"level\") is True, \"level 是回文\"\nassert is_palindrome(\"Hello\") is False, \"Hello 不是回文\"\nassert is_palindrome(\"A man a plan\") is False, \"空格要忽略，但内容本身不是回文\"\nassert is_palindrome(\"Was it a car or a cat I saw\") is True, \"句子回文应该返回 True\"\nassert count_chars(\"aba\") == {\"a\": 2, \"b\": 1}, \"统计结果不对\"\nassert count_chars(\"\") == {}, \"空字符串应该返回空字典\""},"hint":"is_palindrome 里先 text.lower().replace(\" \", \"\")，再和 [::-1] 比较；count_chars 用字典 + get(ch, 0) + 1。","walkthrough":[],"solution":"def is_palindrome(text):\n    cleaned = text.lower().replace(\" \", \"\")\n    return cleaned == cleaned[::-1]\n\ndef count_chars(text):\n    counts = {}\n    for ch in text:\n        counts[ch] = counts.get(ch, 0) + 1\n    return counts"}],"quiz":{"q":"s[::-1] 的作用是？","options":["复制字符串","反转字符串","排序","删除第一个字符"],"answer":1,"explain":"步长 -1 表示倒着取，所以得到反转后的序列。"},"localOnly":false},{"id":"c10l3","title":"查找与排序","chapter_title":"第 10 章 · 算法与解题训练","chapter_id":"c10","minutes":16,"level":"进阶","goal":"会写线性查找、二分查找和冒泡排序，知道它们各自的适用场景。","theory":"<h3>线性查找：一个一个看</h3>\n<pre class=\"snippet\"><code>def linear_search(nums, target):\n    for i, n in enumerate(nums):\n        if n == target:\n            return i\n    return -1</code></pre>\n<p>简单，但数据多的时候慢。</p>\n<h3>二分查找：必须是有序的</h3>\n<p>每次砍掉一半：</p>\n<pre class=\"snippet\"><code>def binary_search(nums, target):\n    low, high = 0, len(nums) - 1\n    while low &lt;= high:\n        mid = (low + high) // 2\n        if nums[mid] == target:\n            return mid\n        if nums[mid] &lt; target:\n            low = mid + 1\n        else:\n            high = mid - 1\n    return -1</code></pre>\n<p>10 亿个数据，二分查找最多比较 30 次。前提是数据<strong>已经排好序</strong>。</p>\n<h3>冒泡排序：理解排序是怎么发生的</h3>\n<pre class=\"snippet\"><code>def bubble_sort(nums):\n    arr = nums[:]                      # 复制一份，不改动原列表\n    for i in range(len(arr)):\n        for j in range(len(arr) - 1 - i):\n            if arr[j] &gt; arr[j + 1]:\n                arr[j], arr[j + 1] = arr[j + 1], arr[j]\n    return arr</code></pre>\n<p>相邻两个比较，大的往后挪，一轮下来最大的就沉到末尾了。</p>\n<h3>实际写代码时</h3>\n<pre class=\"snippet\"><code>nums.sort()                 # 原地排序，最快\nsorted(nums)                # 返回新列表</code></pre>\n<p>Python 内置排序是高度优化的，日常写代码直接用它们；自己写排序是为了<strong>理解原理</strong>和应付面试。</p>\n<table><thead><tr><th>算法</th><th>前提</th><th>效率</th></tr></thead><tbody><tr><td>线性查找</td><td>无</td><td>慢，O(n)</td></tr><tr><td>二分查找</td><td>已排序</td><td>快，O(log n)</td></tr><tr><td>冒泡排序</td><td>无</td><td>慢，O(n²)</td></tr><tr><td>内置 sort</td><td>无</td><td>快，O(n log n)</td></tr></tbody></table>\n<div class=\"callout\"><p>提示：<code>a, b = b, a</code> 是 Python 交换两个变量的写法，不需要中间变量。</p></div>","example":{"title":"三种算法同台","code":"def linear_search(nums, target):\n    for i, n in enumerate(nums):\n        if n == target:\n            return i\n    return -1\n\ndef binary_search(nums, target):\n    low, high = 0, len(nums) - 1\n    while low <= high:\n        mid = (low + high) // 2\n        if nums[mid] == target:\n            return mid\n        if nums[mid] < target:\n            low = mid + 1\n        else:\n            high = mid - 1\n    return -1\n\ndata = [11, 23, 35, 47, 59, 62]\nprint(linear_search(data, 47))\nprint(binary_search(data, 47))\nprint(binary_search(data, 100))","stdin":[],"explain":"两个函数返回的下标都是 3；找不到时返回 -1。","runnable":true,"notes":[]},"exercises":[{"title":"练习：实现二分查找","task":"<p>实现 <code>binary_search(nums, target)</code>：</p>\n<ul><li><code>nums</code> 已经从小到大排好序</li><li>找到就返回下标，找不到返回 <code>-1</code></li></ul>","starter":"def binary_search(nums, target):\n    low, high = 0, len(nums) - 1\n    # 每次砍掉一半\n","stdin":[],"check":{"type":"test","code":"assert \"binary_search\" in globals(), \"没有找到 binary_search 函数\"\ndata = [1, 3, 5, 7, 9, 11]\nassert binary_search(data, 1) == 0, \"找第一个元素\"\nassert binary_search(data, 11) == 5, \"找最后一个元素\"\nassert binary_search(data, 7) == 3, \"找中间的元素\"\nassert binary_search(data, 4) == -1, \"找不到要返回 -1\"\nassert binary_search([], 1) == -1, \"空列表要返回 -1\""},"hint":"循环里 mid = (low + high) // 2；相等就 return mid；目标更大就 low = mid + 1，否则 high = mid - 1；循环结束 return -1。","walkthrough":[],"solution":"def binary_search(nums, target):\n    low, high = 0, len(nums) - 1\n    while low <= high:\n        mid = (low + high) // 2\n        if nums[mid] == target:\n            return mid\n        if nums[mid] < target:\n            low = mid + 1\n        else:\n            high = mid - 1\n    return -1"}],"quiz":{"q":"二分查找的前提是？","options":["数据都是整数","数据已经排好序","数据不能重复","列表长度是偶数"],"answer":1,"explain":"二分靠「中间值比目标大还是小」来砍一半，没排序就无法判断方向。"},"localOnly":false},{"id":"c10l4","title":"递归：函数调用自己","chapter_title":"第 10 章 · 算法与解题训练","chapter_id":"c10","minutes":16,"level":"进阶","goal":"会写递归函数，理解终止条件的重要性。","theory":"<h3>递归的两个必备部分</h3>\n<pre class=\"snippet\"><code>def factorial(n):\n    if n &lt;= 1:              # 1. 终止条件\n        return 1\n    return n * factorial(n - 1)   # 2. 规模变小地调用自己\n\nprint(factorial(5))         # 120</code></pre>\n<p>展开看：</p>\n<pre class=\"snippet\"><code>factorial(5)\n= 5 * factorial(4)\n= 5 * 4 * factorial(3)\n= 5 * 4 * 3 * 2 * 1</code></pre>\n<p>少了终止条件就会「无限递归」，Python 会报 <code>RecursionError: maximum recursion depth exceeded</code>。</p>\n<h3>斐波那契：注意重复计算</h3>\n<pre class=\"snippet\"><code>def fib(n):\n    if n &lt;= 1:\n        return n\n    return fib(n - 1) + fib(n - 2)</code></pre>\n<p>这个写法好懂，但 <code>fib(35)</code> 会非常慢——同一个值被反复计算。改进办法是用循环，或者把算过的结果记下来（这叫记忆化）。</p>\n<pre class=\"snippet\"><code>def fib_fast(n):\n    a, b = 0, 1\n    for _ in range(n):\n        a, b = b, a + b\n    return a</code></pre>\n<h3>递归 vs 循环</h3>\n<table><thead><tr><th></th><th>递归</th><th>循环</th></tr></thead><tbody><tr><td>可读性</td><td>处理树、分治问题时更自然</td><td>一般更直观</td></tr><tr><td>效率</td><td>有函数调用开销，可能重复计算</td><td>通常更快</td></tr><tr><td>风险</td><td>层级太深会报错</td><td>容易写出死循环</td></tr></tbody></table>\n<div class=\"callout\"><p>提示：能一眼看懂用循环实现的，就用循环。递归留给「问题本身就是嵌套的」场景，比如目录树、JSON 嵌套结构、汉诺塔。</p></div>","example":{"title":"阶乘、斐波那契、汉诺塔","code":"def factorial(n):\n    if n <= 1:\n        return 1\n    return n * factorial(n - 1)\n\ndef fib(n):\n    if n <= 1:\n        return n\n    return fib(n - 1) + fib(n - 2)\n\ndef hanoi(n, start, middle, end, moves):\n    if n == 1:\n        moves.append(f\"{start} -> {end}\")\n        return\n    hanoi(n - 1, start, end, middle, moves)\n    moves.append(f\"{start} -> {end}\")\n    hanoi(n - 1, middle, start, end, moves)\n\nprint(factorial(5))\nprint([fib(i) for i in range(8)])\nmoves = []\nhanoi(3, \"A\", \"B\", \"C\", moves)\nprint(f\"3 层汉诺塔需要 {len(moves)} 步\")\nprint(moves[0], \"...\", moves[-1])","stdin":[],"explain":"汉诺塔是递归最经典的例子：n 层的解法里，正好包含两个 n-1 层的子问题。","runnable":true,"notes":[]},"exercises":[{"title":"练习：阶乘与斐波那契","task":"<p>用递归实现两个函数：</p>\n<ol><li><code>factorial(n)</code>：n 的阶乘（<code>factorial(0)</code> 是 1）</li><li><code>fib(n)</code>：斐波那契数列的第 n 项（<code>fib(0) = 0</code>、<code>fib(1) = 1</code>）</li></ol>","starter":"def factorial(n):\n    # 终止条件 + 调用自己\n\ndef fib(n):\n    # 终止条件 + 调用自己\n","stdin":[],"check":{"type":"test","code":"assert factorial(0) == 1, \"0 的阶乘是 1\"\nassert factorial(1) == 1, \"1 的阶乘是 1\"\nassert factorial(5) == 120, \"5 的阶乘是 120\"\nassert fib(0) == 0, \"fib(0) 是 0\"\nassert fib(1) == 1, \"fib(1) 是 1\"\nassert fib(10) == 55, \"fib(10) 是 55\""},"hint":"factorial：if n <= 1: return 1，否则 return n * factorial(n - 1)。fib：if n <= 1: return n，否则 return fib(n - 1) + fib(n - 2)。","walkthrough":[],"solution":"def factorial(n):\n    if n <= 1:\n        return 1\n    return n * factorial(n - 1)\n\ndef fib(n):\n    if n <= 1:\n        return n\n    return fib(n - 1) + fib(n - 2)"}],"quiz":{"q":"递归函数缺少终止条件会怎样？","options":["返回 None","自动停止","报 RecursionError","变成循环"],"answer":2,"explain":"递归层数超过限制会抛 RecursionError，程序必须有一个不再调用自己的出口。"},"localOnly":false},{"id":"c10l5","title":"算法效率直觉","chapter_title":"第 10 章 · 算法与解题训练","chapter_id":"c10","minutes":15,"level":"进阶","goal":"会看代码估算快慢，知道嵌套循环为什么危险。","theor
