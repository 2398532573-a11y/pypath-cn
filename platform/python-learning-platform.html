        "def _py_exec(src, stdin_lines, filename):",
        "    old_input = builtins.input",
        "    buf = io.StringIO()",
        "    prompts = []",
        "    lines_iter = iter(list(stdin_lines))",
        '    def fake_input(prompt=""):',
        "        try:",
        "            value = next(lines_iter)",
        "        except StopIteration:",
        '            raise EOFError("程序还需要输入，但输入框里的内容已经用完了")',
        "        # 像真实终端那样，把提示语和你填的输入一起回显出来",
        '        shown = str(prompt) + str(value) + chr(10)',
        "        prompts.append((len(buf.getvalue()), shown))",
        "        return value",
        "    builtins.input = fake_input",
        "    old_out = sys.stdout",
        "    sys.stdout = buf",
        '    ns = {"__name__": "__main__"}',
        "    ok = True",
        '    etype = ""',
        '    err = ""',
        "    try:",
        '        exec(compile(src, filename, "exec"), ns)',
        "    except BaseException as e:",
        "        ok = False",
        "        etype = type(e).__name__",
        "        err = traceback.format_exc()",
        "    finally:",
        "        sys.stdout = old_out",
        "        builtins.input = old_input",
        '    user_text = buf.getvalue()',
        '    display = user_text',
        "    for pos, text in reversed(prompts):",
        "        display = display[:pos] + text + display[pos:]",
        "    return ns, ok, user_text, display, err, etype",
        "",
        "def _norm(text):",
        '    lines = [ln.rstrip() for ln in str(text).replace(chr(13) + chr(10), chr(10)).split(chr(10))]',
        '    while lines and lines[-1] == "":',
        "        lines.pop()",
        "    return chr(10).join(lines)",
        "",
        "def _py_run(src, stdin_lines):",
        '    ns, ok, user, display, err, etype = _py_exec(src, stdin_lines, "你的代码.py")',
        '    return json.dumps({"ok": ok, "stdout": display, "error": err, "etype": etype})',
        "",
        "def _py_check(src, test_src, kind, expect, stdin_lines):",
        '    ns, ok, user, display, err, etype = _py_exec(src, stdin_lines, "你的代码.py")',
        "    if not ok:",
        '        return json.dumps({"ok": False, "phase": "code", "stdout": display, "error": err, "etype": etype})',
        '    if kind == "output":',
        "        good = _norm(user) == _norm(expect)",
        '        return json.dumps({"ok": good, "phase": "output", "stdout": display, "expect": expect, "etype": ""})',
        "    buf = io.StringIO()",
        "    old_out = sys.stdout",
        "    sys.stdout = buf",
        '    msg = ""',
        "    good = True",
        '    etype2 = ""',
        "    try:",
        '        exec(compile(test_src, "检查.py", "exec"), ns)',
        "    except AssertionError as e:",
        "        good = False",
        '        msg = str(e) or "结果不符合要求"',
        "    except BaseException as e:",
        "        good = False",
        "        etype2 = type(e).__name__",
        '        msg = "检查时出错：" + type(e).__name__ + ": " + str(e)',
        "    finally:",
        "        sys.stdout = old_out",
        '    return json.dumps({"ok": good, "phase": "test", "stdout": display, "error": msg, "etype": etype2})',
        "",
    ].join("\n");

    function loadScript(url) {
        return new Promise(function (resolve, reject) {
            var s = document.createElement("script");
            s.src = url;
            s.async = true;
            s.onload = function () {
                resolve();
            };
            s.onerror = function () {
                reject(new Error("无法加载 " + url));
            };
            document.head.appendChild(s);
        });
    }

    function ensurePyodide(onProgress) {
        if (PY.ready) return Promise.resolve(PY.py);
        if (PY.promise) return PY.promise;
        PY.promise = (async function () {
            var lastErr = null;
            for (var i = 0; i < CDN_LIST.length; i++) {
                var base = CDN_LIST[i];
                try {
                    if (onProgress) onProgress("正在下载 Python 引擎（第 " + (i + 1) + " 个镜像）...");
                    await loadScript(base + "pyodide.js");
                    if (onProgress) onProgress("正在启动 Python...");
                    var py = await window.loadPyodide({ indexURL: base });
                    py.runPython(PY_HARNESS);
                    PY.py = py;
                    PY.ready = true;
                    return py;
                } catch (e) {
                    lastErr = e;
                }
            }
            PY.promise = null;
            throw lastErr || new Error("所有镜像都加载失败");
        })();
        return PY.promise;
    }

    function stdinLines(text) {
        var arr = String(text || "").split(/\r?\n/);
        while (arr.length && arr[arr.length - 1].trim() === "") arr.pop();
        return arr;
    }

    async function runPython(code, stdinText, onProgress) {
        var py = await ensurePyodide(onProgress);
        py.globals.set("__src", code);
        py.globals.set("__stdin", py.toPy(stdinLines(stdinText)));
        return JSON.parse(py.runPython("_py_run(__src, __stdin)"));
    }

    async function checkPython(code, stdinText, check, onProgress) {
        var py = await ensurePyodide(onProgress);
        py.globals.set("__src", code);
        py.globals.set("__stdin", py.toPy(stdinLines(stdinText)));
        if (check.type === "output") {
            py.globals.set("__kind", "output");
            py.globals.set("__expect", check.expect);
            py.globals.set("__test", "");
        } else {
            py.globals.set("__kind", "test");
            py.globals.set("__expect", "");
            py.globals.set("__test", check.code);
        }
        return JSON.parse(py.runPython("_py_check(__src, __test, __kind, __expect, __stdin)"));
    }

    function escapeRegExp(text) {
        return String(text).replace(/[.*+?^$\{\}()|[\]\\]/g, "\\$&");
    }
    function renderLessonTerms(lesson) {
        var terms = DATA.glossary.filter(function (item) {
            return item.lesson === lesson.id;
        });
        if (!terms.length) return null;
        var card = el("div", "card term-card");
        var head = el("div", "term-card-head");
        head.appendChild(el("h3", "", "本课术语"));
        var link = el("a", "term-link", "查看完整术语表");
        link.href = "#/glossary";
        head.appendChild(link);
        card.appendChild(head);
        var list = el("dl", "term-list");
        terms.forEach(function (item) {
            var row = el("div", "term-row");
            row.appendChild(el("dt", "", esc(item.term) + (item.en ? " · " + esc(item.en) : "")));
            row.appendChild(el("dd", "", esc(item.desc)));
            list.appendChild(row);
        });
        card.appendChild(list);
        return card;
    }

    function decorateTerms(root, lesson) {
        var terms = DATA.glossary.filter(function (item) {
            return item.lesson === lesson.id;
        });
        if (!terms.length) return;
        terms.sort(function (a, b) { return b.term.length - a.term.length; });
        var byTerm = {};
        terms.forEach(function (item) { byTerm[item.term] = item; });
        var pattern = terms.map(function (item) { return escapeRegExp(item.term); }).join("|");
        if (!pattern) return;
        var regex = new RegExp("(" + pattern + ")", "g");
        var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
            acceptNode: function (node) {
                var parent = node.parentNode;
                if (!parent) return NodeFilter.FILTER_REJECT;
                var tag = parent.nodeName;
                if (tag === "CODE" || tag === "PRE" || tag === "SCRIPT" || tag === "STYLE" || tag === "A" || tag === "BUTTON") {
                    return NodeFilter.FILTER_REJECT;
                }
                return node.nodeValue && node.nodeValue.trim() ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
            }
        });
        var nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        nodes.forEach(function (node) {
            var text = node.nodeValue;
            regex.lastIndex = 0;
            if (!regex.test(text)) return;
            regex.lastIndex = 0;
            var frag = document.createDocumentFragment();
            var last = 0, match;
            while ((match = regex.exec(text))) {
                if (match.index > last) frag.appendChild(document.createTextNode(text.slice(last, match.index)));
                var span = document.createElement("span");
                span.className = "term-inline";
                span.setAttribute("title", byTerm[match[1]] ? byTerm[match[1]].desc : match[1]);
                span.setAttribute("tabindex", "0");
                span.textContent = match[1];
                frag.appendChild(span);
                last = match.index + match[1].length;
            }
            if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
            node.parentNode.replaceChild(frag, node);
        });
    }

                table.appendChild(thead);
                var tbody = el("tbody");
                items.forEach(function (it) {

                    var td1 = el("td", "");

    var exam = null;

    function quizLessons() {
        return LESSONS.filter(function (l) {
            return !!l.quiz;
        });
    }

    function shuffle(list) {
        var arr = list.slice();
        for (var i = arr.length - 1; i > 0; i--) {
            var j = Math.floor(Math.random() * (i + 1));
            var tmp = arr[i];
            arr[i] = arr[j];
            arr[j] = tmp;
        }
        return arr;
    }

    function startExam(mode) {
        var pool = quizLessons();
        if (mode === "wrong") pool = pool.filter(function (l) { return state.wrong[l.id]; });
        var picked = shuffle(pool).slice(0, 20);
        exam = {
            mode: mode,
            items: picked.map(function (l) {
                return { lesson: l, choice: null, right: false };
            }),
            done: false,
        };
        if (location.hash === "#/exam") render();
        else location.hash = "#/exam";
    }

    /* --------------------------------------------------------- 学习计划 */

    function chapterById(id) {
        for (var i = 0; i < CHAPTERS.length; i++) if (CHAPTERS[i].id === id) return CHAPTERS[i];
        return null;
    }

    function renderPlan() {
        var wrap = el("div");
        wrap.appendChild(el("h1", "page-title", "六周学习计划"));
        var p = progress();
        var done = p.done;

        var weekSizes = DATA.plan.map(function (w) {
            return w.chapters.reduce(function (n, cid) {
                var ch = chapterById(cid);
                return n + (ch ? ch.lessons.length : 0);
            }, 0);
        });
        var cumulative = 0;
        var current = 0;
        for (var i = 0; i < weekSizes.length; i++) {
            cumulative += weekSizes[i];
            if (done < cumulative) {
                current = i;
                break;
            }
            current = i;
        }

        wrap.appendChild(
            el(
                "p",
                "status",
                "按每天 40~60 分钟设计，六周可以完整过一遍。你已经完成 " +
                    done +
                    " 节课，按进度现在应该在「" +
                    esc(DATA.plan[current].week) +
                    "」。当然，按自己的节奏来最重要。"
            )
        );

        DATA.plan.forEach(function (w, wi) {
            var chapters = w.chapters.map(chapterById).filter(Boolean);
            var total = 0;
            var finished = 0;
            chapters.forEach(function (ch) {
                ch.lessons.forEach(function (l) {
                    total++;
                    if (state.completed[l.id]) finished++;
                });
            });
            var pct = total ? Math.round((finished / total) * 100) : 0;
            var card = el("div", "card" + (wi === current ? " current-week" : ""));
            card.appendChild(
                el("h3", "", esc(w.week) + " · " + esc(w.theme) + (wi === current ? " ← 你在这里" : ""))
            );
            card.appendChild(el("p", "status", esc(w.hours) + " · 本章节 " + finished + " / " + total + " 课"));
            var bar = el("div", "bar");
            var fill = el("i", "");
            fill.style.width = pct + "%";
            bar.appendChild(fill);
            card.appendChild(bar);
            var ul = el("ul", "");
            w.points.forEach(function (t) {
                ul.appendChild(el("li", "", esc(t)));
            });
            card.appendChild(ul);
            var names = el("p", "status", "涉及章节：" + esc(chapters.map(function (c) { return c.title; }).join("、")));
            card.appendChild(names);
            var first = chapters.length ? chapters[0].lessons[0] : null;
            if (first) {
                var btn = el("button", "btn small primary", wi === current ? "继续学习" : "从这一周开始");
                btn.type = "button";
                btn.addEventListener("click", function () {
                    location.hash = "#/lesson/" + first.id;
                });
                card.appendChild(btn);
            }
            wrap.appendChild(card);
        });

        var tip = el("div", "card");
        tip.appendChild(el("h3", "", "怎么用这份计划"));
        var ol = el("ol", "");
        [
            "每天固定一段时间，比如晚饭后 40 分钟，比周末突击效果好得多。",
            "一节课的流程：读讲解 → 跑示例 → 做练习 → 看小测验解析。",
            "当天没完成不要紧，第二天接着做，别把计划表当成压力。",
            "每学完一章，回到「错题本」把错题再做一遍。",
            "第 3 周和第 6 周末尾各安排一次「自测考试」，检验掌握程度。",
        ].forEach(function (t) {
            ol.appendChild(el("li", "", esc(t)));
        });
        tip.appendChild(ol);
        wrap.appendChild(tip);
        return wrap;
    }

    /* --------------------------------------------------------- 练习题库 */

    function renderDrills() {
        var wrap = el("div");
        wrap.appendChild(el("h1", "page-title", "练习题库"));
        var total = totalExercises();
        var passed = 0;
        LESSONS.forEach(function (l) {
            l.exercises.forEach(function (ex, i) {
                if (state.ex[l.id + ":" + i]) passed++;
            });
        });
        wrap.appendChild(
            el(
                "p",
                "status",
                "全部 " + total + " 道练习，已通过 " + passed + " 道。点「去做题」会跳到对应课程里的那一题。"
            )
        );
        var bar = el("div", "bar");
        var fill = el("i", "");
        fill.style.width = Math.round((passed / total) * 100) + "%";
        bar.appendChild(fill);
        wrap.appendChild(bar);

        var filterBox = el("div", "presets");
        [
            { label: "全部", value: "all" },
            { label: "还没做", value: "todo" },
            { label: "已通过", value: "done" },
        ].forEach(function (f, fi) {
            var btn = el("button", "btn small" + (fi === 0 ? " primary" : ""), f.label);
            btn.type = "button";
            btn.addEventListener("click", function () {
                draw(f.value);
                Array.prototype.forEach.call(filterBox.children, function (c, ci) {
                    c.className = "btn small" + (ci === fi ? " primary" : "");
                });
            });
            filterBox.appendChild(btn);
        });
        wrap.appendChild(filterBox);
        var host = el("div", "");
        wrap.appendChild(host);

        function draw(mode) {
            host.innerHTML = "";
            CHAPTERS.forEach(function (ch) {
                var list = [];
                ch.lessons.forEach(function (l) {
                    l.exercises.forEach(function (ex, i) {
                        var ok = !!state.ex[l.id + ":" + i];
                        if (mode === "todo" && ok) return;
                        if (mode === "done" && !ok) return;
                        list.push({ lesson: l, index: i, title: ex.title.replace(/^练习[：:]\s*/, ""), ok: ok });
                    });
                });
                if (!list.length) return;
                var card = el("div", "card");
                card.appendChild(el("h3", "", esc(ch.title)));
                list.forEach(function (it) {
                    var row = el("div", "task-row");
                    row.appendChild(
                        el(
                            "span",
                            "",
                            (it.ok ? "✅ " : "⬜ ") + esc(it.lesson.title) + " · " + esc(it.title)
                        )
                    );
                    var btn = el("button", "btn small", "去做题");
                    btn.type = "button";
                    btn.addEventListener("click", function () {
                        location.hash = "#/lesson/" + it.lesson.id;
                    });
                    row.appendChild(btn);
                    card.appendChild(row);
                });
                host.appendChild(card);
            });
        }

        draw("all");
        return wrap;
    }

    function renderFaq() {
        var wrap = el("div");
        wrap.appendChild(el("h1", "page-title", "常见问题"));
        FAQ.forEach(function (item) {
            var d = document.createElement("details");
            d.className = "faq";
            var s = document.createElement("summary");
            s.textContent = item.q;
            d.appendChild(s);
            var p = document.createElement("p");
            p.textContent = item.a;
            d.appendChild(p);
            wrap.appendChild(d);
        });
        var card = el("div", "card");
        card.appendChild(el("h3", "", "想在自己电脑上运行代码？"));
        var ol = el("ol", "");
        [
            "你的电脑已经装好了 Python 3.12。",
            "在「开始菜单」搜索 IDLE，打开它就是 Python 自带的编辑器。",
            "新建文件，写下 print(\"你好\")，按 F5 运行。",
            "想更专业一点，可以安装 VS Code，并选择 Python 扩展。",
        ].forEach(function (t) {
            ol.appendChild(el("li", "", esc(t)));
        });
        card.appendChild(ol);
        wrap.appendChild(card);
        wrap.appendChild(
            el(
                "div",
                "footer-note",
                "还有别的问题？把你不懂的地方写在聊天里问我，我会解释给你听。"
            )
        );
        return wrap;
    }

    /* ------------------------------------------------------------- 路由 */

    function currentLessonId() {
        var m = location.hash.match(/^#\/lesson\/([\w-]+)/);
        return m ? m[1] : null;
    }

    function currentRoute() {
        var parts = location.hash.replace(/^#\/?/, "").split("/");
        return parts[0] || "home";
    }

    function render() {
        var host = document.getElementById("content");
        host.innerHTML = "";
        editors = [];
        var route = currentRoute();
        var id = currentLessonId();
        var viewKey = route + ":" + (id || "");
        var shouldScroll = viewKey !== lastViewKey;
        lastViewKey = viewKey;
        var view;
        if (id) {
            var lesson = lessonById(id);
            view = lesson ? renderLesson(lesson) : el("div", "card", "没有找到这一课，请从左侧目录重新进入。");
        } else if (route === "ref") {
            view = renderReference();
        } else if (route === "play") {
            view = renderPlayground();
        } else if (route === "exam") {
            view = renderExam();
        } else if (route === "review") {
            view = renderReview();
        } else if (route === "glossary") {
            view = renderGlossary();
        } else if (route === "drills") {
            view = renderDrills();
        } else if (route === "plan") {
            view = renderPlan();
        } else if (route === "faq") {
            view = renderFaq();
        } else {
            view = renderHome();
        }
        host.appendChild(view);
        renderSidebar();
        if (shouldScroll) window.scrollTo(0, 0);
    }

    function applyTheme() {
        document.documentElement.setAttribute("data-theme", state.theme === "light" ? "light" : "dark");
        var btn = document.getElementById("theme-btn");
        if (btn) btn.textContent = state.theme === "light" ? "深色模式" : "浅色模式";
    }

    function closeDrawer() {
        document.getElementById("sidebar").classList.remove("open");
        document.getElementById("drawer-mask").classList.remove("show");
    }

    function boot() {
        try {
            applyTheme();
            var themeBtn = document.getElementById("theme-btn");
            themeBtn.addEventListener("click", function () {
                state.theme = state.theme === "light" ? "dark" : "light";
                saveState(true);
                applyTheme();
            });
            var menuBtn = document.getElementById("menu-btn");
            menuBtn.addEventListener("click", function () {
                document.getElementById("sidebar").classList.toggle("open");
                document.getElementById("drawer-mask").classList.toggle("show");
            });
            document.getElementById("drawer-mask").addEventListener("click", closeDrawer);
            var sideSearch = document.getElementById("side-search");
            if (sideSearch) {
                sideSearch.addEventListener("input", function () {
                    renderSidebar();
                });
            }
            window.addEventListener("hashchange", render);
            if (!location.hash) location.hash = "#/home";
            render();
        } catch (err) {
            showFatal(err && err.message ? err.message : String(err));
        }
    }

    function showFatal(msg) {
        try {
            var host = document.getElementById("content");
            if (host && !host.textContent.trim()) {
                host.appendChild(
                    el(
                        "div",
                        "card",
                        "<h3>页面启动出错了</h3><p>请按 F5 刷新重试。如果一直出错，把下面这段信息发给我，我来修：</p>" +
                            '<pre class="snippet"><code>' +
                            esc(msg) +
                            "</code></pre>"
                    )
                );
            }
        } catch (e) {}
    }

    window.addEventListener("error", function (e) {
        showFatal(e && e.message ? e.message : "未知错误");
    });

    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
    else boot();
})();

</script>
</body>
</html>
