<style>
:root {
    --bg: #0d1117;
    --bg-soft: #111823;
    --panel: #161d28;
    --panel-2: #1b2431;
    --text: #e6edf3;
    --muted: #93a1b1;
    --border: #263141;
    --accent: #4da3ff;
    --accent-soft: rgba(77, 163, 255, 0.14);
    --green: #3ddc97;
    --green-soft: rgba(61, 220, 151, 0.14);
    --red: #ff6b6b;
    --yellow: #f0c674;
    --code-bg: #0a0f16;
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    --radius: 12px;
}

html[data-theme="light"] {
    --bg: #f4f6fa;
    --bg-soft: #ffffff;
    --panel: #ffffff;
    --panel-2: #f0f3f8;
    --text: #1b2330;
    --muted: #5b6878;
    --border: #dde3ec;
    --accent: #1f6feb;
    --accent-soft: rgba(31, 111, 235, 0.1);
    --green: #1a7f4b;
    --green-soft: rgba(26, 127, 75, 0.1);
    --red: #c92a2a;
    --yellow: #9a6700;
    --code-bg: #f6f8fa;
    --shadow: 0 6px 18px rgba(20, 30, 50, 0.08);
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    padding: 0;
}

body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    font-size: 16px;
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
}

a {
    color: var(--accent);
    text-decoration: none;
}

a:hover {
    text-decoration: underline;
}

code {
    font-family: "Cascadia Code", Consolas, "Courier New", monospace;
    font-size: 0.92em;
    background: var(--panel-2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 1px 5px;
    white-space: nowrap;
}

pre.snippet {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    overflow-x: auto;
    line-height: 1.65;
}

pre.snippet code {
    background: none;
    border: none;
    padding: 0;
    white-space: pre;
    font-size: 14px;
}

.app {
    display: flex;
    min-height: 100vh;
}

/* ---------- 侧边栏 ---------- */
.sidebar {
    width: 292px;
    flex: 0 0 292px;
    background: var(--bg-soft);
    border-right: 1px solid var(--border);
    height: 100vh;
    position: sticky;
    top: 0;
    display: flex;
    flex-direction: column;
}

.brand {
    padding: 16px 18px 12px;
    border-bottom: 1px solid var(--border);
}

.brand-title {
    font-size: 17px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 8px;
}

.brand-title .logo {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--green));
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: #06121f;
    font-weight: 800;
}

.brand-title .logo-img {
    width: 26px;
    height: 26px;
    border-radius: 8px;
    display: block;
    flex: 0 0 26px;
}

.brand-sub {
    color: var(--muted);
    font-size: 12.5px;
    margin-top: 4px;
}

.side-progress {
    padding: 12px 18px;
    border-bottom: 1px solid var(--border);
}

.progress-line {
    display: flex;
    justify-content: space-between;
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 6px;
}

.bar {
    height: 7px;
    border-radius: 99px;
    background: var(--panel-2);
    overflow: hidden;
}

.bar > i {
    display: block;
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--green));
    width: 0;
    transition: width 0.3s ease;
}

.side-nav {
    padding: 10px 10px 24px;
    overflow-y: auto;
    flex: 1;
}

.side-tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 6px;
    padding: 0 8px 10px;
}

.side-tab {
    text-align: center;
    font-size: 12.5px;
    padding: 6px 8px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
}

.side-tab.active {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
}

.side-search-wrap {
    padding: 0 16px 8px;
    border-bottom: 1px solid var(--border);
}

.side-search {
    width: 100%;
    padding: 7px 10px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-size: 13px;
}

.side-search:focus {
    outline: 2px solid var(--accent-soft);
    border-color: var(--accent);
}

.side-result-info {
    font-size: 12.5px;
    color: var(--muted);
    padding: 8px 10px;
}

/* ---------- 打卡日历 ---------- */
.calendar {
    display: grid;
    grid-template-columns: repeat(14, 1fr);
    gap: 5px;
    margin-top: 6px;
}

.cal-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 6px 2px;
    border-radius: 8px;
    background: var(--panel-2);
    border: 1px solid var(--border);
    font-size: 11px;
    color: var(--muted);
}

.cal-cell b {
    font-size: 12px;
    color: var(--text);
}

.cal-cell.on {
    background: var(--accent-soft);
    border-color: var(--accent);
    color: var(--accent);
}

.cal-cell.hot {
    background: var(--green-soft);
    border-color: var(--green);
    color: var(--green);
}

.task-row {
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: space-between;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--panel);
    margin-bottom: 6px;
    font-size: 14px;
}

.quiz-option.selected {
    border-color: var(--accent);
    background: var(--accent-soft);
    color: var(--accent);
}

.card.current-week {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent-soft);
}

@media (max-width: 700px) {
    .calendar {
        grid-template-columns: repeat(7, 1fr);
    }
}

@media print {
    .sidebar,
    .topbar,
    .drawer-mask,
    .editor-head,
    .stdin-row,
    .console,
    .hero-actions,
    .lesson-nav,
    .toast,
    .result,
    .answer-box,
    .side-search-wrap {
        display: none !important;
    }

    .content {
        max-width: none;
        padding: 0;
    }

    .editor-block,
    .card {
        border-color: #ccc;
        box-shadow: none;
    }

    .code-area textarea {
        position: static;
        height: auto;
        color: #000;
        -webkit-text-fill-color: #000;
    }

    .editor-wrap {
        height: auto !important;
    }
}

.chapter {
    margin-bottom: 6px;
}

.chapter-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 9px 10px;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    color: var(--text);
}

.chapter-head:hover {
    background: var(--panel);
}

.chapter-head .caret {
    color: var(--muted);
    font-size: 11px;
    transition: transform 0.2s ease;
}

.chapter.collapsed .caret {
    transform: rotate(-90deg);
}

.chapter.collapsed .lesson-list {
    display: none;
}

.chapter-head .count {
    margin-left: auto;
    font-size: 11.5px;
    color: var(--muted);
    font-weight: 400;
}

.lesson-list {
    list-style: none;
    margin: 2px 0 6px;
    padding: 0 0 0 8px;
}

.lesson-link {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border-radius: 8px;
    font-size: 13.5px;
    color: var(--muted);
    cursor: pointer;
    line-height: 1.4;
}

.lesson-link:hover {
    background: var(--panel);
    color: var(--text);
}

.lesson-link.active {
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 600;
}

.lesson-link .tick {
    width: 16px;
    height: 16px;
    flex: 0 0 16px;
    border-radius: 50%;
    border: 1px solid var(--border);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: transparent;
}

.lesson-link.done .tick {
    background: var(--green);
    border-color: var(--green);
    color: #06121f;
}

/* ---------- 主区域 ---------- */
.main {
    flex: 1;
    min-width: 0;
}

.topbar {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-soft);
    position: sticky;
    top: 0;
    z-index: 30;
}

.content {
    max-width: 940px;
    margin: 0 auto;
    padding: 28px 30px 90px;
}

h1,
h2,
h3 {
    line-height: 1.35;
}

.page-title {
    font-size: 26px;
    margin: 0 0 6px;
}

.crumbs {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 12px;
}

.meta-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: 10px 0 4px;
}

.pill {
    font-size: 12px;
    padding: 2px 10px;
    border-radius: 99px;
    border: 1px solid var(--border);
    color: var(--muted);
}

.pill.accent {
    color: var(--accent);
    border-color: var(--accent);
    background: var(--accent-soft);
}

.card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin: 18px 0;
}

.card h3 {
    margin: 0 0 10px;
    font-size: 17px;
}

.card .goal {
    margin: 0;
    color: var(--text);
}

.card .goal b {
    color: var(--accent);
}

.card.goal-card {
    border-color: rgba(77, 163, 255, 0.28);
}

.term-card {
    border-color: rgba(77, 163, 255, 0.32);
    background: linear-gradient(180deg, var(--accent-soft), var(--panel));
}

.term-card-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
}

.term-card-head h3 {
    margin: 0;
}

.term-link {
    color: var(--accent);
    font-size: 13px;
    white-space: nowrap;
}

.term-list {
    display: grid;
    gap: 10px;
    margin: 14px 0 0;
}

.term-row {
    padding: 10px 12px;
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.045);
}

.term-row dt {
    color: var(--text);
    font-weight: 700;
}

.term-row dd {
    margin: 4px 0 0;
    color: var(--muted);
    font-size: 14px;
}

.term-inline {
    border-bottom: 1px dotted var(--accent);
    cursor: help;
}

.note-details summary {
    cursor: pointer;
    color: var(--accent);
    font-weight: 700;
}

.note-details[open] summary {
    margin-bottom: 10px;
}

html[data-theme="light"] .term-row {
    background: #f4f7fb;
}

.hero {
    background: radial-gradient(1200px 300px at 10% -40%, var(--accent-soft), transparent),
        var(--panel);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 26px 26px 22px;
    margin-bottom: 20px;
}

.hero h1 {
    margin: 0 0 8px;
    font-size: 27px;
}

.hero p {
    color: var(--muted);
    margin: 0 0 16px;
}

.hero-actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

.btn {
    font: inherit;
    font-size: 14px;
    padding: 8px 16px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    cursor: pointer;
    transition: transform 0.06s ease, background 0.15s ease;
}

.btn:hover {
    background: var(--border);
}

.btn:active {
    transform: translateY(1px);
}

.btn:disabled {
    opacity: 0.55;
    cursor: not-allowed;
}

.btn.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #06121f;
    font-weight: 600;
}

.btn.primary:hover {
    filter: brightness(1.08);
}

.btn.green {
    background: var(--green);
    border-color: var(--green);
    color: #06121f;
    font-weight: 600;
}

.btn.ghost {
    background: transparent;
}

.btn.small {
    font-size: 13px;
    padding: 5px 11px;
    border-radius: 8px;
}

.stats {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin: 16px 0;
}

.stat {
    flex: 1 1 150px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
}

.stat .num {
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
}

.stat .label {
    font-size: 12.5px;
    color: var(--muted);
}

.grid-chapters {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
}

.chapter-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
}

.chapter-card h4 {
    margin: 0 0 6px;
    font-size: 15px;
}

.chapter-card p {
    margin: 0 0 10px;
    font-size: 13px;
    color: var(--muted);
}

.chapter-card ul {
    margin: 0;
    padding-left: 18px;
    font-size: 13.5px;
    color: var(--muted);
}

.chapter-card li {
    margin: 2px 0;
    cursor: pointer;
}

.chapter-card li:hover {
    color: var(--accent);
}

.theory h2,
.theory h3 {
    font-size: 18px;
    margin: 26px 0 8px;
}

.theory p {
    margin: 10px 0;
}

.theory ul,
.theory ol {
    margin: 10px 0;
    padding-left: 22px;
}

.theory li {
    margin: 4px 0;
}

.theory table,
.ref-table {
    width: 100%;
    border-collapse: collapse;
    margin: 12px 0;
    font-size: 14px;
}

.theory th,
.theory td,
.ref-table th,
.ref-table td {
    border-bottom: 1px solid var(--border);
    padding: 7px 10px;
    text-align: left;
    vertical-align: top;
}

.theory th,
.ref-table th {
    color: var(--muted);
    font-weight: 600;
    font-size: 13px;
}

.theory tr:last-child td {
    border-bottom: none;
}

.callout {
    border-left: 3px solid var(--accent);
    background: var(--accent-soft);
    padding: 10px 14px;
    border-radius: 0 8px 8px 0;
    margin: 14px 0;
    font-size: 14.5px;
}

.callout.warn {
    border-color: var(--yellow);
    background: rgba(240, 198, 116, 0.12);
}

.callout p {
    margin: 0;
}

/* ---------- 代码编辑器 ---------- */
.editor-block {
    border: 1px solid var(--border);
    border-radius: var(--radius);
    background: var(--code-bg);
    margin: 14px 0;
    overflow: hidden;
}

.editor-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
}

.editor-head .title {
    font-size: 13px;
    color: var(--muted);
    margin-right: auto;
}

.editor-wrap {
    display: flex;
    font-family: "Cascadia Code", Consolas, "Courier New", monospace;
    font-size: 14px;
    line-height: 22.4px;
    position: relative;
}

.gutter {
    flex: 0 0 42px;
    padding: 12px 8px 12px 0;
    text-align: right;
    color: var(--muted);
    opacity: 0.55;
    user-select: none;
    background: var(--code-bg);
    border-right: 1px solid var(--border);
    font-size: 13px;
    white-space: pre;
    overflow: hidden;
}

.code-area {
    position: relative;
    flex: 1;
    min-width: 0;
    height: 100%;
}

.code-area pre.hl {
    margin: 0;
    padding: 12px 14px;
    height: 100%;
    overflow: auto;
    pointer-events: none;
    white-space: pre;
    tab-size: 4;
    color: var(--text);
}

.code-area textarea {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 12px 14px;
    border: 0;
    outline: none;
    resize: none;
    background: transparent;
    color: transparent;
    caret-color: var(--accent);
    font: inherit;
    white-space: pre;
    overflow: auto;
    tab-size: 4;
}

.code-area textarea::selection {
    background: rgba(77, 163, 255, 0.35);
}

.tok-key {
    color: #ff7b72;
}

.tok-str {
    color: #a5d6ff;
}

.tok-com {
    color: #8b949e;
    font-style: italic;
}

.tok-num {
    color: #79c0ff;
}

.tok-fn {
    color: #d2a8ff;
}

html[data-theme="light"] .tok-key {
    color: #cf222e;
}

html[data-theme="light"] .tok-str {
    color: #0a3069;
}

html[data-theme="light"] .tok-com {
    color: #6e7781;
}

html[data-theme="light"] .tok-num {
    color: #0550ae;
}

html[data-theme="light"] .tok-fn {
    color: #8250df;
}

.stdin-row {
    display: flex;
    gap: 10px;
    align-items: flex-start;
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    flex-wrap: wrap;
}

.stdin-row label {
    font-size: 12.5px;
    color: var(--muted);
    padding-top: 5px;
    flex: 0 0 auto;
}

.stdin-label {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
}

.input-badge {
    font-size: 11.5px;
    line-height: 1.5;
    padding: 1px 8px;
    border-radius: 99px;
    border: 1px solid currentColor;
}

.input-badge.muted {
    color: var(--muted);
    opacity: 0.75;
}

.input-badge.ok {
    color: var(--green);
    background: var(--green-soft);
}

.input-badge.warn {
    color: var(--yellow);
}

.input-badge.bad {
    color: var(--red);
}

.stdin-row textarea {
    flex: 1 1 220px;
    min-height: 42px;
    background: var(--code-bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 10px;
    font-family: inherit;
    font-size: 13.5px;
    resize: vertical;
}

.stdin-row textarea:focus {
    outline: 2px solid var(--accent-soft);
    border-color: var(--accent);
}

.input-hint {
    flex: 1 1 100%;
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--muted);
}

.input-hint.warn {
    color: var(--yellow);
}

.input-hint.bad {
    color: var(--red);
}

.console {
    border-top: 1px solid var(--border);
    background: var(--code-bg);
}

.console-head {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    font-size: 12px;
    color: var(--muted);
    background: var(--panel-2);
    border-bottom: 1px solid var(--border);
}

.console-body {
    padding: 10px 14px;
    font-family: "Cascadia Code", Consolas, "Courier New", monospace;
    font-size: 13.5px;
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 320px;
    overflow: auto;
    min-height: 48px;
    margin: 0;
}

.console-body.err {
    color: var(--red);
}

.console-body.ok {
    color: var(--green);
}

.console-body .hint {
    color: var(--muted);
    font-family: inherit;
}

.status {
    font-size: 12.5px;
    color: var(--muted);
}

.status.ok {
    color: var(--green);
}

.status.err {
    color: var(--red);
}

.status.busy {
    color: var(--accent);
}

.result {
    margin: 10px 0 0;
    padding: 10px 14px;
    border-radius: 10px;
    font-size: 14px;
    border: 1px solid var(--border);
    background: var(--panel);
}

.result.ok {
    border-color: var(--green);
    background: var(--green-soft);
}

.result.bad {
    border-color: var(--red);
    background: rgba(255, 107, 107, 0.12);
}

.result .detail {
    margin-top: 6px;
    font-size: 13px;
    color: var(--muted);
    white-space: pre-wrap;
    font-family: "Cascadia Code", Consolas, monospace;
}

.answer-box {
    margin-top: 10px;
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    background: var(--panel);
}

.answer-box .label {
    font-size: 12.5px;
    color: var(--muted);
    margin-bottom: 6px;
}

ol.steps {
    margin: 0;
    padding-left: 22px;
    font-size: 14.5px;
}

ol.steps li {
    margin: 5px 0;
}

.quiz-options {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
}

.quiz-option {
    text-align: left;
    padding: 9px 13px;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    cursor: pointer;
    font: inherit;
    font-size: 14px;
}

.quiz-option:hover {
    border-color: var(--accent);
}

.quiz-option.right {
    border-color: var(--green);
    background: var(--green-soft);
}

.quiz-option.wrong {
    border-color: var(--red);
    background: rgba(255, 107, 107, 0.12);
}

.lesson-nav {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    margin-top: 34px;
    padding-top: 18px;
    border-top: 1px solid var(--border);
    flex-wrap: wrap;
}

.search {
    width: 100%;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font: inherit;
    font-size: 15px;
    margin: 14px 0 18px;
}

.search:focus {
    outline: 2px solid var(--accent-soft);
    border-color: var(--accent);
}

.ref-group {
    margin-bottom: 22px;
}

.ref-group h3 {
    font-size: 16px;
    margin: 0 0 8px;
    color: var(--accent);
}

.presets {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
}

details.faq {
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 14px;
    background: var(--panel);
    margin-bottom: 10px;
}

details.faq summary {
    cursor: pointer;
    font-weight: 600;
    font-size: 15px;
}

details.faq p {
    color: var(--muted);
    font-size: 14.5px;
    margin: 8px 0 2px;
}

.footer-note {
    margin-top: 40px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    color: var(--muted);
    font-size: 13px;
}

.toast {
    position: fixed;
    right: 20px;
    bottom: 22px;
    background: var(--panel-2);
    border: 1px solid var(--accent);
    color: var(--text);
    padding: 10px 16px;
    border-radius: 10px;
    box-shadow: var(--shadow);
    font-size: 14px;
    z-index: 60;
    opacity: 0;
    transform: translateY(10px);
    transition: all 0.25s ease;
    pointer-events: none;
}

.toast.show {
    opacity: 1;
    transform: translateY(0);
}

.drawer-mask {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.55);
    z-index: 40;
}

@media (max-width: 900px) {
    .topbar {
        display: flex;
    }

    .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 50;
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        box-shadow: var(--shadow);
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .drawer-mask.show {
        display: block;
    }

    .content {
        padding: 20px 16px 80px;
    }

    .page-title {
        font-size: 22px;
    }
}

<script type="application/json" id="curriculum-data">{"meta":{"title":"Python 零基础学习平台","subtitle":"62 节课 + 66 道自动判分练习 + 自测考试，从零基础到能独立写出自己的小程序","tips":["先在代码框里改一改、按 Ctrl+Enter 运行，再看结果。编程是练出来的，不是看出来的。","每节课只要 10~20 分钟：看讲解、跑示例、做练习、点「检查答案」。","看到红色报错不要慌，那是 Python 在告诉你哪里不懂。第 5 章教你读报错、第 12 章教你写测试。","卡住超过 15 分钟就先看提示，再不行直接看答案，然后关掉答案自己重写一遍。","每学完两三章，去「自测考试」考一次 20 题，错题会自动进「错题本」。"]},"chapters":[{"id":"c1","title":"第 1 章 · 让电脑开口说话","summary":"认识代码、学会输出，理解变量和类型，这是程序世界的字母表。","lessons":[{"id":"c1l1","title":"写代码是怎么回事","chapter_title":"第 1 章 · 让电脑开口说话","chapter_id":"c1","minutes":10,"level":"入门","goal":"搞懂代码是什么，并亲手让电脑打印一句话。","theory":"<h3>程序就是给电脑的指令清单</h3>\n<p>我们用中文说「去倒杯水」，电脑看不懂。要让电脑做事，就得用它认识的写法写出每一步：</p>\n<pre class=\"snippet\"><code>print(\"你好\")</code></pre>\n<p>这一行叫一条<strong>语句</strong>。<code>print</code> 的意思是打印出来，括号里引号包住的内容就是你要它说的话。</p>\n<h3>三条新手规则</h3>\n<ul><li>代码从上往下、一行一行执行。</li><li>括号和引号都要<strong>成对</strong>出现，而且必须是英文半角符号，中文的 <code>（ ）</code> 会报错。</li><li>行首的空格（缩进）在 Python 里不是排版，是语法。刚开始先记住：不要随便加空格。</li></ul>\n<h3>怎么在这个平台练习</h3>\n<ul><li>每个代码框都能直接编辑，按 <code>Ctrl + Enter</code> 或点「运行」看结果。</li><li>需要 <code>input()</code> 输入的程序，把要输入的内容填在代码框上方的「输入」框里，一行一个。</li><li>做完练习点「检查答案」，会立刻告诉你是对是错。</li></ul>\n<div class=\"callout warn\"><p>注意：第一次打开页面需要联网下载 Python 引擎（约 10MB），稍等几秒，之后浏览器会缓存它。</p></div>","example":{"title":"你的第一个程序","code":"print(\"Hello, Python!\")\nprint(\"我可以让电脑替我说话了\")\nprint(1 + 1)","stdin":[],"explain":"第三行没有引号，所以 Python 不把它当文字，而是真的去算 1 加 1。","runnable":true,"notes":["第一行 print(\"Hello, Python!\")：括号里的英文引号表示「这是一段文字」，屏幕会原样输出 Hello, Python!","第二行还是一条 print，只是把文字换成了中文——中文当然也可以写在引号里。","第三行 print(1 + 1) 没有引号：没有引号，Python 就把它当算式算出来，输出 2 而不是 1 + 1。","三行代码从上往下依次执行，所以输出也是三行。","记住这条：有引号 = 文字，没引号 = 算式（代码）。这是这一课最重要的一句话。"]},"exercises":[{"title":"练习：让电脑说出你的目标","task":"<p>让程序输出一行字：<code>我要学会 Python</code></p>\n<p>把代码框里的文字改掉就可以。</p>","starter":"# 把引号里的内容改成：我要学会 Python\nprint(\"我要学习\")","stdin":[],"check":{"type":"output","expect":"我要学会 Python"},"hint":"只需要改引号里面的文字，print、括号、引号都保留。","walkthrough":["读题：屏幕上要出现一行字「我要学会 Python」。","决定用哪个函数：要显示文字，就用 print。","括号里的文字必须用英文引号包起来，所以这一行的形状是 print(\"...\")。","把原来那行里的「我要学习」替换成「我要学会 Python」，print、括号、引号都别动。","按 Ctrl+Enter 运行，输出面板出现那一行字就算对了；再点「检查答案」确认。"],"solution":"print(\"我要学会 Python\")"}],"quiz":{"q":"下面哪一行写法是正确的？","options":["print(\"你好\")","print（你好）","print\"你好\"","Print('你好')"],"answer":0,"explain":"要用英文括号和英文引号，函数名必须是小写的 print。"},"localOnly":false},{"id":"c1l2","title":"print 的多种玩法","chapter_title":"第 1 章 · 让电脑开口说话","chapter_id":"c1","minutes":12,"level":"入门","goal":"学会一次输出多个内容，控制分隔符号和换行。","theory":"<h3>一次输出多个内容</h3>\n<pre class=\"snippet\"><code>print(\"姓名\", \"小明\", \"年龄\", 18)</code></pre>\n<p>用逗号分隔，Python 会自动在它们之间补一个<strong>空格</strong>。</p>\n<h3>sep 和 end：控制细节</h3>\n<pre class=\"snippet\"><code>print(\"2026\", \"01\", \"01\", sep=\"-\")   # 2026-01-01\nprint(\"正在加载\", end=\"...\")\nprint(\"完成\")</code></pre>\n<ul><li><code>sep=\"-\"</code>：把逗号之间的空格换成短横线。</li><li><code>end=\"...\"</code>：把结尾默认的换行换成别的字符，所以下一句会接在同一行。</li></ul>\n<table><thead><tr><th>写法</th><th>输出</th></tr></thead><tbody><tr><td><code>print(\"a\", \"b\")</code></td><td>a b</td></tr><tr><td><code>print(\"a\", \"b\", sep=\"\")</code></td><td>ab</td></tr><tr><td><code>print(\"a\", end=\"!\")</code></td><td>a!</td></tr></tbody></table>\n<h3>引号可以嵌套，但不能打架</h3>\n<pre class=\"snippet\"><code>print(\"他说：'你好'\")    # 外面双引号，里面单引号，没问题</code></pre>\n<div class=\"callout\"><p>提示：想省心就统一用双引号写字符串，需要引号时里面用单引号。</p></div>","example":{"title":"做一个简单的成绩单","code":"print(\"== 期末成绩单 ==\")\nprint(\"语文\", 92)\nprint(\"数学\", 88)\nprint(\"单号\", \"2026\", \"A\", \"001\", sep=\"-\")\nprint(\"总分\", 92 + 88, \"分\")","stdin":[],"explain":"最后一行同时用了 sep 和 end，两个参数都在引号里写。","runnable":true,"notes":["第一行 print(\"== 期末成绩单 ==\")：输出一行标题，等号只是普通文字，用来做装饰。","print(\"语文\", 92)：一个文字、一个数字，用逗号隔开，输出时中间自动补一个空格 → 语文 92。","print(\"单号\", \"2026\", \"A\", \"001\", sep=\"-\")：sep=\"-\" 把逗号之间的空格换成短横线 → 单号-2026-A-001。","最后一行里的 92 + 88 没有引号，所以会先算成 180 再输出 → 总分 180 分。","逗号适合快速拼一句话；想像写句子一样插入变量，用第 6 课的 f-string 更顺手。"]},"exercises":[{"title":"练习：三行自我介绍","task":"<p>用三行 <code>print</code> 输出下面三行，内容要完全一致：</p>\n<pre class=\"snippet\"><code>我叫 小明\n我在学 Python\n第一天</code></pre>","starter":"# 第一行：用逗号让「我叫」和名字之间自动出现空格\n\n# 第二行\n\n# 第三行","stdin":[],"check":{"type":"output","expect":"我叫 小明\n我在学 Python\n第一天"},"hint":"第二行直接 print(\"我在学 Python\") 就行，第三行别多输出空格。","walkthrough":["题目要三行，所以要写三条 print，每条单独占一行。","第一行用逗号让空格自动出现：print(\"我叫\", \"小明\")。","第二行整句都在引号里：print(\"我在学 Python\")。","第三行 print(\"第一天\")，引号里不要多打空格。","运行看看输出是不是正好三行，然后点「检查答案」。"],"solution":"print(\"我叫\", \"小明\")\nprint(\"我在学 Python\")\nprint(\"第一天\")"}],"quiz":{"q":"print(\"A\", \"B\", sep=\"+\") 的输出是什么？","options":["A B","A+B","A\"+\"B","报错"],"answer":1,"explain":"sep 会把多个内容之间的分隔符换成加号。"},"localOnly":false},{"id":"c1l3","title":"注释与缩进","chapter_title":"第 1 章 · 让电脑开口说话","chapter_id":"c1","minutes":10,"level":"入门","goal":"学会给代码写备注，理解 Python 为什么对缩进这么严格。","theory":"<h3>注释：写给人看的话</h3>\n<p><code>#</code> 后面的内容会被 Python 完全忽略，用来解释你的思路：</p>\n<pre class=\"snippet\"><code># 计算圆的面积\nradius = 3            # 半径\narea = 3.14 * radius ** 2\nprint(area)           # 打印结果</code></pre>\n<p>注释的三个用处：说明<strong>为什么</strong>这么写、临时关掉某行代码来排查问题、记录你还没搞懂的地方。</p>\n<h3>缩进：Python 的门牌号</h3>\n<p>很多语言用花括号表示「这些代码属于一起」，Python 用缩进：</p>\n<pre class=\"snippet\"><code>if 3 &gt; 2:\n    print(\"3 比 2 大\")\n    print(\"这两行都属于 if\")\nprint(\"这一行不属于 if，一定会执行\")</code></pre>\n<p>规则很简单：<strong>冒号后面要缩进</strong>，同一组的缩进必须一样多。业界标准是 4 个空格，不要用 Tab。</p>\n<div class=\"callout warn\"><p>注意：<code>IndentationError: expected an indented block</code> 意思是「这里该缩进却没缩进」；<code>unexpected indent</code> 意思是「这里不该缩进」。</p></div>","example":{"title":"注释和缩进一起用","code":"# 这个小程序判断今天要不要带伞\nrain = True          # 假设今天下雨\n\nif rain:\n    print(\"出门记得带伞\")\n    print(\"顺便穿双防水的鞋\")\nprint(\"祝你今天愉快\")","stdin":[],"explain":"前两行 print 缩进了 4 个空格，属于 if；最后一行没有缩进，所以无论如何都会执行。","runnable":true,"notes":["以 # 开头的两处是注释：Python 完全忽略它们，那是写给人看的笔记。","rain = True 是赋值，把「真」这个值存进变量 rain；注意 True 的首字母要大写。","if rain: 末尾的冒号表示「下面缩进的代码属于这个条件」。","缩进 4 个空格的两行属于 if：只有 rain 是 True 的时候才会执行。","最后一行 print(\"祝你今天愉快\") 顶格写，不属于 if，所以不管条件真假都会执行。","动手试一下：把第一行的 True 改成 False 再运行，缩进的两行会消失，最后一行还在。"]},"exercises":[{"title":"练习：修好这段缩进","task":"<p>下面这段代码运行会报错，请修好它，让它输出：</p>\n<pre class=\"snippet\"><code>开始学习\n正在学缩进\n结束</code></pre>","starter":"print(\"开始学习\")\nif True:\nprint(\"正在学缩进\")\nprint(\"结束\")","stdin":[],"check":{"type":"output","expect":"开始学习\n正在学缩进\n结束"},"hint":"if 冒号下面的那一行需要缩进 4 个空格。","walkthrough":["先运行一次，看到 IndentationError 就说明确实是缩进的问题。","找到 if True: 这一行：冒号下面的代码必须缩进，才算 if 的内容。","给 print(\"正在学缩进\") 这一行加 4 个空格（在编辑器里按 Tab 会自动补 4 个空格）。","另外两行保持顶格、不缩进。","再运行，输出三行就对了，然后点「检查答案」。"],"solution":"print(\"开始学习\")\nif True:\n    print(\"正在学缩进\")\nprint(\"结束\")"}],"quiz":{"q":"Python 里缩进的作用是什么？","options":["让代码好看","表示哪些代码属于同一组","没有作用，可有可无","加快运行速度"],"answer":1,"explain":"缩进是语法的一部分，它决定代码的层级关系。"},"localOnly":false},{"id":"c1l4","title":"变量：给数据取个名字","chapter_title":"第 1 章 · 让电脑开口说话","chapter_id":"c1","minutes":12,"level":"入门","goal":"会用变量保存数据、修改变量，掌握变量命名规则。","theory":"<h3>变量就是一个贴了标签的盒子</h3>\n<pre class=\"snippet\"><code>name = \"小明\"\nage = 18</code></pre>\n<p>这里的 <code>=</code> 不是数学里的相等，而是<strong>赋值</strong>：把右边的值放进左边的名字里。之后提到 <code>name</code>，Python 就会取出里面的内容。</p>\n<pre class=\"snippet\"><code>print(name)\nname = \"小红\"      # 同一个名字可以装新值，旧值被覆盖\nprint(name)</code></pre>\n<h3>变量名怎么起</h3>\n<ul><li>只能用字母、数字、下划线组成，而且<strong>不能以数字开头</strong>。</li><li>区分大小写：<code>age</code> 和 <code>Age</code> 是两个不同的变量。</li><li>不能用 Python 的保留字，比如 <code>if</code>、<code>for</code>、<code>class</code>、<code>True</code>。</li><li>用有意义的名字：<code>total_price</code> 比 <code>a1</code> 好得多。</li></ul>\n<h3>常用写法</h3>\n<pre class=\"snippet\"><code>x, y = 1, 2          # 一次给多个变量赋值\ncount = count + 1    # 在原来的基础上加 1</code></pre>\n<div class=\"callout\"><p>提示：报 <code>NameError: name 'xxx' is not defined</code>，几乎总是变量名拼错，或者还没赋值就拿来用了。变量必须先赋值才能使用。</p></div>","example":{"title":"用变量讲一个会变化的故事","code":"name = \"小明\"\nage = 8\nprint(name, \"今年\", age, \"岁\")\n\nage = age + 1      # 长大一岁\nprint(name, \"明年\", age, \"岁\")","stdin":[],"explain":"age + 1 先算出 9，再放回 age 这个盒子里，所以第二句打印的是 9。","runnable":true,"notes":["name = \"小明\"：把文字存进变量 name（右边有引号）。","age = 8：把数字存进变量 age（右边没有引号）。","print(name, \"今年\", age, \"岁\")：变量和文字混着用逗号拼起来 → 小明 今年 8 岁。","age = age + 1：先算右边 8 + 1 得 9，再把 9 存回 age 这个盒子。","第二句打印 age 时，用的是更新后的 9，所以看起来像「长大了一岁」。"]},"exercises":[{"title":"练习：把信息装进变量","task":"<p>创建两个变量并输出一行：</p>\n<ul><li><code>city</code> 里装 <code>杭州</code></li><li><code>weather</code> 里装 <code>晴</code></li></ul>\n<p>输出：<code>杭州 今天 晴</code></p>","starter":"# 在这里创建 city 和 weather 两个变量\n\n\n# 然后用 print 输出一行","stdin":[],"check":{"type":"output","expect":"杭州 今天 晴"},"hint":"city = \"杭州\"，注意引号是英文的。","walkthrough":["两个数据要存起来，所以先写两行赋值：city = \"杭州\"，weather = \"晴\"。","文字要加英文引号；变量名 city、weather 本身不加引号。","打印时用逗号分隔：print(city, \"今天\", weather)。","逗号会自动补一个空格，所以结果正好是「杭州 今天 晴」。","运行确认，再点「检查答案」。"],"solution":"city = \"杭州\"\nweather = \"晴\"\nprint(city, \"今天\", weather)"}],"quiz":{"q":"执行 x = 5 之后再执行 x = x + 3，x 的值是多少？","options":["5","3","8","报错"],"answer":2,"explain":"先算右边 5 + 3 = 8，再把 8 存回 x。"},"localOnly":false},{"id":"c1l5","title":"数字与运算","chapter_title":"第 1 章 · 让电脑开口说话","chapter_id":"c1","minutes":14,"level":"入门","goal":"掌握四则运算、整除、取余、幂运算，分清整数和小数。","theory":"<h3>Python 是一台听话的计算器</h3>\n<pre class=\"snippet\"><code>print(7 + 2)      # 9\nprint(7 - 2)      # 5\nprint(7 * 2)      # 14\nprint(7 / 2)      # 3.5   除法一定得到小数\nprint(7 // 2)     # 3     整除：只要整数部分\nprint(7 % 2)      # 1     取余：只要剩下的零头\nprint(7 ** 2)     # 49    幂：7 的 2 次方</code></pre>\n<h3>整数和小数</h3>\n<ul><li><code>int</code> 整数：<code>3</code>、<code>-10</code>、<code>0</code></li><li><code>float</code> 小数：<code>3.14</code>、<code>0.5</code></li><li>整数之间做 <code>+ - *</code> 还是整数；只要出现 <code>/</code> 或小数，结果就是小数。</li></ul>\n<h3>运算顺序</h3>\n<p>先乘除后加减，有括号先算括号，<code>**</code> 优先级最高。</p>\n<pre class=\"snippet\"><code>print((1 + 2) * 3)     # 9，不是 7\nprint(10 % 2)          # 0 → 偶数\nprint(125 % 60)        # 5 → 125 分钟是 2 小时 5 分钟</code></pre>\n<div class=\"callout\"><p>提示：<code>1 / 0</code> 会报 <code>ZeroDivisionError</code>，除以 0 在数学上没有意义，Python 直接拒绝执行。</p></div>","example":{"title":"把秒数换算成时分秒","code":"total = 3725\nhour = total // 3600\nminute = total % 3600 // 60\nsecond = total % 60\nprint(total, \"秒 =\", hour, \"小时\", minute, \"分\", second, \"秒\")","stdin":[],"explain":"先用整除算出有几个整小时，再用取余把剩下的部分继续往下分。","runnable":true,"notes":["total = 3725：要换算的总秒数。","hour = total // 3600：一小时 3600 秒，整除拿到整小时数 → 1。","minute = total % 3600 // 60：先用 % 拿到不足一小时的秒数，再整除 60 换成分钟 → 2。","second = total % 60：最后剩下的秒数 → 5。","最后把四个变量拼进一句话输出 → 3725 秒 = 1 小时 2 分 5 秒。"]},"exercises":[{"title":"练习：算水果账单","task":"<p>苹果 5.5 元一个买 3 个，香蕉 2 元一个买 4 个。</p>\n<p>算出总价，输出一行：<code>总价 24.5 元</code></p>","starter":"apple_price = 5.5\napple_count = 3\n# 接着写香蕉的数量、单价，以及总价的计算","stdin":[],"check":{"type":"output","expect":"总价 24.5 元"},"hint":"总价 = 苹果单价 * 数量 + 香蕉单价 * 数量，然后 print(\"总价\", total, \"元\")。","walkthrough":["先补上香蕉的价格和数量：banana_price = 2、banana_count = 4。","苹果的钱 = apple_price * apple_count。","香蕉的钱 = banana_price * banana_count。","两部分相加存进 total，再按题目格式打印：print(\"总价\", total, \"元\")。","运行看到「总价 24.5 元」就对了，再点「检查答案」。"],"solution":"apple_price = 5.5\napple_count = 3\nbanana_price = 2\nbanana_count = 4\ntotal = apple_price * apple_count + banana_price * banana_count\nprint(\"总价\", total, \"元\")"}],"quiz":{"q":"17 // 5 和 17 % 5 分别是多少？","options":["3.4 和 2","3 和 2","3 和 3","2 和 3"],"answer":1,"explain":"17 = 5 × 3 + 2，所以整除得 3，取余得 2。"},"localOnly":false},{"id":"c1l6","title":"字符串与 f-string","chapter_title":"第 1 章 · 让电脑开口说话","chapter_id":"c1","minutes":14,"level":"入门","goal":"会拼接字符串、量长度，并用 f-string 优雅地把变量塞进句子里。","theory":"<h3>字符串就是一段文字</h3>\n<p>引号包起来的都是字符串（str），单双引号都行，只要成对。</p>\n<pre class=\"snippet\"><code>name = \"小明\"\ngreeting = \"你好，\" + name + \"！\"    # 加号可以拼接两段文字\nprint(greeting)                      # 你好，小明！\nprint(len(greeting))                 # 7，len 数的是字符个数</code></pre>\n<h3>f-string：最推荐的写法</h3>\n<p>在引号前加一个 <code>f</code>，就能把变量直接放进花括号里：</p>\n<pre class=\"snippet\"><code>name = \"小明\"\nage = 8\nprint(f\"{name}今年{age}岁，明年{age + 1}岁\")</code></pre>\n<table><thead><tr><th>写法</th><th>代码</th><th>说明</th></tr></thead><tbody><tr><td>加号拼接</td><td><code>\"你好\" + name</code></td><td>只能拼字符串</td></tr><tr><td>逗号分隔</td><td><code>print(\"你好\", name)</code></td><td>自动加空格</td></tr><tr><td>f-string</td><td><code>f\"你好{name}\"</code></td><td>最灵活，推荐</td></tr></tbody></table>\n<h3>字符串常用小操作</h3>\n<pre class=\"snippet\"><code>s = \"Python\"\nprint(s.upper())        # PYTHON\nprint(s[0])             # P      下标从 0 开始数\nprint(s[0:3])           # Pyt    取第 0、1、2 个字符\nprint(\"Py\" in s)        # True   判断是否包含\nprint(\"  hi  \".strip()) # hi     去掉两头的空格</code></pre>\n<div class=\"callout\"><p>提示：数字和字符串不能直接相加，<code>\"我\" + 18</code> 会报 <code>TypeError</code>。请用 f-string 或 <code>str(18)</code>。</p></div>","example":{"title":"用 f-string 生成一句话","code":"name = \"小红\"\nscore = 92.5\nprint(f\"{name}的期末成绩是{score}分\")\nprint(f\"比及格线高出 {score - 60} 分\")\nprint(f\"名字长度 {len(name)}，第一个字是 {name[0]}\")","stdin":[],"explain":"花括号里不只能放变量，还能直接写算式、调用 len()。","runnable":true,"notes":["name = \"小红\" 和 score = 92.5：先准备两个变量。","f\"...\" 前面那个 f 表示「这是格式化字符串」：花括号 {} 里会换成变量的值。","{score - 60}：花括号里可以直接写算式，Python 先算出 32.5 再放进去。","{len(name)}：会先算出名字长度 2 再放进去。","{name[0]}：取第一个字符 → 小。下标 0 就是第一个，第 3 章会讲。"]},"exercises":[{"title":"练习：制作一行名片","task":"<p>已有变量 <code>name</code> 和 <code>job</code>。</p>\n<p>用一行 f-string 输出：<code>我是小明，我的职业是程序员</code></p>","starter":"name = \"小明\"\njob = \"程序员\"\n# 用 f-string 打印一句话","stdin":[],"check":{"type":"output","expect":"我是小明，我的职业是程序员"},"hint":"print(f\"我是{name}，我的职业是{job}\")，注意逗号是中文逗号。","walkthrough":["要输出的句子里嵌了变量的值，所以用 f-string 最省事。","f-string 的写法：引号前面加一个 f，变量放进花括号 {} 里。","照题目格式写：print(f\"我是{name}，我的职业是{job}\")。","注意逗号是中文的「，」，前后不要加空格。","运行看到「我是小明，我的职业是程序员」，再点「检查答案」。"],"solution":"name = \"小明\"\njob = \"程序员\"\nprint(f\"我是{name}，我的职业是{job}\")"}],"quiz":{"q":"name = \"Amy\"，那么 f\"你好{name}\" 的结果是？","options":["你好{name}","你好Amy","你好 name","报错"],"answer":1,"explain":"f-string 会把花括号里的变量替换成它的值。"},"localOnly":false},{"id":"c1l7","title":"input：让程序听你说话","chapter_title":"第 1 章 · 让电脑开口说话","chapter_id":"c1","minutes":14,"level":"入门","goal":"会用 input 接收输入，并记住它拿到的永远是字符串。","theory":"<h3>input 会暂停程序，等用户打字</h3>\n<pre class=\"snippet\"><code>name = input(\"你叫什么名字？\")\nprint(f\"你好，{name}！\")</code></pre>\n<p>括号里的内容会先显示给用户看，用户按下回车后，输入的内容就装进了左边的变量。</p>\n<h3>在这个平台怎么测试 input 程序</h3>\n<p>代码框上方有一个「输入」框，把要输入的内容<strong>一行一个</strong>写进去，例如：</p>\n<pre class=\"snippet\"><code>小明\n18</code></pre>\n<p>程序第一次 <code>input()</code> 拿到 <code>小明</code>，第二次拿到 <code>18</code>。如果程序还要输入但你给的不够，就会报 <code>EOFError</code>。</p>\n<div class=\"callout warn\"><p>注意：<code>input()</code> 拿到的<strong>永远是字符串</strong>。所以输入 18 得到的是文字 \"18\"，不能直接做数学运算。下一课专门讲怎么转换。</p></div>","example":{"title":"会打招呼的程序","code":"name = input(\"请输入你的名字：\")\nhobby = input(\"你的爱好是什么？\")\nprint(f\"{name}，原来你喜欢{hobby}，很棒！\")","stdin":["小明","打篮球"],"explain":"点「运行」，程序会依次从输入框读两行。试试把输入框的内容改成你自己的。","runnable":true,"notes":["name = input(\"请输入你的名字：\")：先显示提示语，再读一行输入，把结果存进 name。","在这个平台上，输入不是当场打字，而是从代码框上方的「输入」框里按顺序读——示例已经帮你填了两行。","hobby = input(\"你的爱好是什么？\")：第二次 input，读走第二行。","最后用 f-string 把两个变量拼进一句话输出 → 小明，原来你喜欢打篮球，很棒！","把输入框里的两行换成你自己的内容，再运行一次试试。"]},"exercises":[{"title":"练习：点餐机","task":"<p>依次问「要点什么菜？」和「要几份？」，然后输出一行：</p>\n<p><code>已下单 3 份 饺子</code></p>\n<p>（输入框里给的是 <code>饺子</code> 和 <code>3</code> 两行）</p>","starter":"# 第一步：用两个 input 拿到菜名和份数\n\n\n# 第二步：打印 已下单 x 份 y","stdin":["饺子","3"],"check":{"type":"output","expect":"已下单 3 份 饺子"},"hint":"dish = input(\"要点什么菜？\")，然后 print(f\"已下单 {count} 份 {dish}\")。","walkthrough":["要读两次输入，所以写两个 input()：dish = input(\"要点什么菜？\")。","第二个是 count = input(\"要几份？\")。","这里只是把内容打印出来，不需要转换类型。","按题目的顺序打印：print(f\"已下单 {count} 份 {dish}\")。","输入框里已经填了「饺子」和「3」两行，分别对应两次 input；运行确认后点「检查答案」。"],"solution":"dish = input(\"要点什么菜？\")\ncount = input(\"要几份？\")\nprint(f\"已下单 {count} 份 {dish}\")"}],"quiz":{"q":"程序里有两次 input()，但输入框只填了一行，会发生什么？","options":["第二行自动用第一行的内容","得到空字符串","报 EOFError","程序卡住不动"],"answer":2,"explain":"输入内容用完了就没有东西可读，Python 会抛出 EOFError。"},"localOnly":false},{"id":"c1l8","title":"数据类型与转换","chapter_title":"第 1 章 · 让电脑开口说话","chapter_id":"c1","minutes":16,"level":"入门","goal":"认识 int、float、str、bool，学会处理输入进来的数字。","theory":"<h3>四种最常见的数据类型</h3>\n<table><thead><tr><th>类型</th><th>名字</th><th>例子</th></tr></thead><tbody><tr><td><code>int</code></td><td>整数</td><td><code>3</code>、<code>-7</code></td></tr><tr><td><code>float</code></td><td>小数</td><td><code>3.14</code>、<code>0.5</code></td></tr><tr><td><code>str</code></td><td>字符串</td><td><code>\"你好\"</code>、<code>\"3\"</code></td></tr><tr><td><code>bool</code></td><td>真假值</td><td><code>True</code>、<code>False</code></td></tr></tbody></table>\n<p>用 <code>type()</code> 可以查看类型：</p>\n<pre class=\"snippet\"><code>print(type(3), type(\"3\"), type(3.0), type(True))</code></pre>\n<h3>转换函数</h3>\n<pre class=\"snippet\"><code>age = int(\"18\")         # 字符串 → 整数\nprice = float(\"3.5\")    # 字符串 → 小数\ntext = str(99)          # 数字 → 字符串</code></pre>\n<h3>新手最容易踩的坑</h3>\n<pre class=\"snippet\"><code>a = input(\"第一个数：\")   # a 是字符串 \"7\"\nprint(a + 1)              # 报错 TypeError</code></pre>\n<p>正确写法是把输入立刻转成数字：</p>\n<pre class=\"snippet\"><code>a = int(input(\"第一个数：\"))\nprint(a + 1)</code></pre>\n<div class=\"callout\"><p>提示：<code>True</code> 和 <code>False</code> 本质上就是 1 和 0，<code>print(True + 1)</code> 会输出 2。</p></div>\n<div class=\"callout warn\"><p>注意：<code>int(\"abc\")</code> 会报 <code>ValueError</code>，因为 int 只能转换长得像整数的字符串。</p></div>","example":{"title":"能算数的计算器","code":"a = int(input(\"第一个数：\"))\nb = int(input(\"第二个数：\"))\nprint(f\"{a} + {b} = {a + b}\")\nprint(f\"{a} / {b} = {a / b:.2f}\")   # :.2f 表示保留两位小数","stdin":["7","3"],"explain":"把输入框的两个数改一改再运行。试试输入小数会怎样？会报错，因为这里用的是 int。","runnable":true,"notes":["a = int(input(\"第一个数：\"))：input 读到的永远是文字，int() 把它变成整数，才能参与数学运算。","b 同理，这样 a 和 b 都是数字而不是文字。","print(f\"{a} + {b} = {a + b}\")：花括号里直接写算式，Python 算出 10 再显示。","{a / b:.2f}：:.2f 的意思是「保留两位小数」，所以 7 / 3 显示成 2.33。","把输入框改成 1.5 这种小数再运行，会报 ValueError——因为 int 只认整数，这时要改用 float。"]},"exercises":[{"title":"练习：BMI 计算器","task":"<p>读取身高（米）和体重（公斤），计算 BMI，保留 1 位小数。</p>\n<p>公式：<code>BMI = 体重 / 身高²</code></p>\n<p>输出：<code>BMI 21.6</code></p>\n<p>输入框给的是 <code>1.75</code> 和 <code>66</code></p>","starter":"# 提示：可能要用到 float() 和 ** 运算符\n\n","stdin":["1.75","66"],"check":{"type":"output","expect":"BMI 21.6"},"hint":"height = float(input(\"身高(米)：\"))，输出时用 f\"BMI {bmi:.1f}\" 保留一位小数。","walkthrough":["身高、体重可能是小数，所以用 float() 转换：height = float(input(\"身高(米)：\"))。","体重同理：weight = float(input(\"体重(公斤)：\"))。","套公式算 BMI：bmi = weight / height ** 2（** 表示平方）。","要保留 1 位小数，用 f\"{bmi:.1f}\" 这种写法。","最后 print(f\"BMI {bmi:.1f}\")；输入框给的是 1.75 和 66，运行应该得到「BMI 21.6」。"],"solution":"height = float(input(\"身高(米)：\"))\nweight = float(input(\"体重(公斤)：\"))\nbmi = weight / height ** 2\nprint(f\"BMI {bmi:.1f}\")"},{"title":"挑战：两位数拆开","task":"<p>读入一个两位数（比如 58），用整除和取余把十位、个位分开，输出：</p>\n<p><code>十位是 5，个位是 8</code></p>","starter":"n = int(input(\"请输入一个两位数：\"))\n# 用 // 和 % 取出十位和个位","stdin":["58"],"check":{"type":"output","expect":"十位是 5，个位是 8"},"hint":"十位 = n // 10，个位 = n % 10。","walkthrough":["先读入一个整数：n = int(input(\"请输入一个两位数：\"))。","十位用整除拿到：ten = n // 10。","个位用取余拿到：one = n % 10。","按格式打印：print(f\"十位是 {ten}，个位是 {one}\")。","输入框里给的是 58，运行应该得到「十位是 5，个位是 8」，再点「检查答案」。"],"solution":"n = int(input(\"请输入一个两位数：\"))\nten = n // 10\none = n % 10\nprint(f\"十位是 {ten}，个位是 {one}\")"}],"quiz":{"q":"a = input()，输入 5 之后 type(a) 是什么？","options":["int","str","float","bool"],"answer":1,"explain":"input 永远返回字符串，要做数学运算必须先转换。"},"localOnly":false}]},{"id":"c2","title":"第 2 章 · 让程序会思考、会重复","summary":"条件判断和循环是编程的两台发动机，学会它们就能写真正的逻辑了。","lessons":[{"id":"c2l1","title":"比较运算与 if","chapter_title":"第 2 章 · 让程序会思考、会重复","chapter_id":"c2","minutes":12,"level":"基础","goal":"会用比较运算符得到 True/False，并用 if 让程序做选择。","theory":"<h3>比较运算的结果是 True 或 False</h3>\n<pre class=\"snippet\"><code>print(3 &gt; 2)     # True\nprint(3 &lt; 2)     # False\nprint(3 == 3)    # True    判断相等要用两个等号\nprint(3 != 2)    # True    不等于\nprint(3 &gt;= 3)    # True    大于等于</code></pre>\n<div class=\"callout warn\"><p>注意：一个 <code>=</code> 是赋值，两个 <code>==</code> 才是比较。写成 <code>if a = 3:</code> 一定报 SyntaxError。</p></div>\n<h3>if 让程序做选择</h3>\n<pre class=\"snippet\"><code>age = 20\nif age &gt;= 18:\n    print(\"你成年了\")\nprint(\"这句话一定执行\")</code></pre>\n<p>读法：如果 <code>age &gt;= 18</code> 成立（结果是 True），就执行缩进的那一行；不成立就跳过。</p>\n<h3>字符串和文字也能比较</h3>\n<pre class=\"snippet\"><code>password = \"123456\"\nif password == \"123456\":\n    print(\"密码正确\")</code></pre>\n<div class=\"callout\"><p>提示：条件不成立时程序什么都不做，直接往下走，这是完全正常的。</p></div>","example":{"title":"游乐园的身高检查","code":"height = int(input(\"你的身高(cm)？\"))\nif height >= 140:\n    print(\"可以玩过山车，祝你玩得开心！\")\nprint(\"排队请拿好号码牌\")","stdin":["152"],"explain":"把输入框改成 130 再运行一次，看看哪一行不再出现。","runnable":true,"notes":[]},"exercises":[{"title":"练习：判断奇偶","task":"<p>读入一个整数，偶数就输出 <code>偶数</code>，否则输出 <code>奇数</code>。</p>\n<p>输入框给的是 <code>8</code>。</p>","starter":"n = int(input(\"请输入一个整数：\"))\n# 用 n % 2 == 0 判断是不是偶数","stdin":["8"],"check":{"type":"output","expect":"偶数"},"hint":"需要 if 和 else 两部分，照着示例里的写法套进去就行。","walkthrough":[],"solution":"n = int(input(\"请输入一个整数：\"))\nif n % 2 == 0:\n    print(\"偶数\")\nelse:\n    print(\"奇数\")"}],"quiz":{"q":"下面哪个表达式的结果是 True？","options":["5 != 5","5 = 5","5 >= 5","5 < 5"],"answer":2,"explain":"5 >= 5 表示大于或等于，成立；5 = 5 是语法错误。"},"localOnly":false},{"id":"c2l2","title":"if / elif / else 多分支","chapter_title":"第 2 章 · 让程序会思考、会重复","chapter_id":"c2","minutes":12,"level":"基础","goal":"处理三种以上的情况，理解分支只会执行其中一个。","theory":"<h3>三条以上的路</h3>\n<pre class=\"snippet\"><code>score = 85\nif score &gt;= 90:\n    print(\"优秀\")\nelif score &gt;= 60:\n    print(\"及格\")\nelse:\n    print(\"需要努力\")</code></pre>\n<p><code>elif</code> 是 else if 的缩写。Python 会<strong>从上往下</strong>检查，遇到第一个成立的就把它的代码执行掉，剩下的<strong>全部跳过</strong>。</p>\n<h3>顺序很重要</h3>\n<pre class=\"snippet\"><code># 错误示范：95 分会先撞上 &gt;= 60，永远轮不到「优秀」\nif score &gt;= 60:\n    print(\"及格\")\nelif score &gt;= 90:\n    print(\"优秀\")</code></pre>\n<p>所以写多分支时，把条件最严格的放最前面。</p>\n<h3>可以嵌套</h3>\n<p>分支里面还能再写 if，每一层都要缩进：</p>\n<pre class=\"snippet\"><code>if age &gt;= 18:\n    if has_ticket:\n        print(\"请入场\")\n    else:\n        print(\"请先买票\")\nelse:\n    print(\"未成年人在家长陪同下入场\")</code></pre>\n<div class=\"callout\"><p>提示：嵌套超过两层就该换个写法了，后面学完函数和逻辑运算符会发现更漂亮的写法。</p></div>","example":{"title":"成绩等级评定","code":"score = int(input(\"请输入成绩(0-100)：\"))\nif score >= 90:\n    level = \"优秀\"\nelif score >= 80:\n    level = \"良好\"\nelif score >= 60:\n    level = \"及格\"\nelse:\n    level = \"不及格\"\nprint(f\"你的等级：{level}\")","stdin":["85"],"explain":"先把结果存进 level，最后只打印一次，代码更整洁也更容易改。","runnable":true,"notes":[]},"exercises":[{"title":"练习：买票价格","task":"<p>按年龄决定票价：</p>\n<ul><li>6 岁以下：输出 <code>免费</code></li><li>6 到 17 岁：输出 <code>半价</code></li><li>18 岁及以上：输出 <code>全价</code></li></ul>\n<p>输入框给的是 <code>15</code>。</p>","starter":"age = int(input(\"请输入年龄：\"))\n# 用 if / elif / else 判断","stdin":["15"],"check":{"type":"output","expect":"半价"},"hint":"第一个条件写 age < 6，第二个写 age < 18，剩下的交给 else。","walkthrough":[],"solution":"age = int(input(\"请输入年龄：\"))\nif age < 6:\n    print(\"免费\")\nelif age < 18:\n    print(\"半价\")\nelse:\n    print(\"全价\")"}],"quiz":{"q":"score = 95，如果把 `if score >= 60` 写在前面，`elif score >= 90` 写在后面，会输出什么？","options":["优秀","及格","两个都输出","什么都不输出"],"answer":1,"explain":"95 满足第一个条件就执行并跳过后面了。分支顺序必须由严到宽。"},"localOnly":false},{"id":"c2l3","title":"逻辑运算符 and / or / not","chapter_title":"第 2 章 · 让程序会思考、会重复","chapter_id":"c2","minutes":12,"level":"基础","goal":"会组合多个条件，写出「同时满足」和「满足其一」的判断。","theory":"<h3>三个小词，让条件变强大</h3>\n<pre class=\"snippet\"><code>age = 20\nhas_id = True\n\nprint(age &gt;= 18 and has_id)   # 两个都真 → True\nprint(age &gt;= 18 or has_id)    # 有一个真 → True\nprint(not has_id)             # 取反 → False</code></pre>\n<table><thead><tr><th>运算符</th><th>含义</th><th>什么时候成立</th></tr></thead><tbody><tr><td><code>and</code></td><td>并且</td><td>两边都成立</td></tr><tr><td><code>or</code></td><td>或者</td><td>至少一边成立</td></tr><tr><td><code>not</code></td><td>不是</td><td>后面的不成立</td></tr></tbody></table>\n<h3>区间判断要写完整</h3>\n<pre class=\"snippet\"><code># 正确：两个比较都要写出来\nif 18 &lt;= age and age &lt;= 60:\n    print(\"劳动年龄人口\")\n\n# 更短的等价写法\nif 18 &lt;= age &lt;= 60:\n    print(\"劳动年龄人口\")</code></pre>\n<h3>短路：聪明但不总是好事</h3>\n<p><code>and</code> 左边已经是 False，右边就不会再算；<code>or</code> 左边已经是 True，右边也不会再算。利用这一点可以做保护：</p>\n<pre class=\"snippet\"><code>if count != 0 and total / count &gt; 10:\n    print(\"平均值偏大\")</code></pre>\n<div class=\"callout\"><p>提示：<code>not in</code> 常用来判断「不在里面」：<code>if name not in banned:</code> 表示这个名字不在黑名单中。</p></div>","example":{"title":"能不能进网吧","code":"age = int(input(\"年龄：\"))\nhas_id = input(\"带身份证了吗(y/n)：\") == \"y\"\n\nif age >= 18 and has_id:\n    print(\"可以进入\")\nelif age >= 18 and not has_id:\n    print(\"年龄够了，但需要身份证\")\nelse:\n    print(\"未成年人禁止进入\")","stdin":["20","y"],"explain":"第二行把输入和 y 做比较，得到 True 或 False，直接存进 has_id。","runnable":true,"notes":[]},"exercises":[{"title":"练习：闰年判断（简化版）","task":"<p>读入年份，是闰年输出 <code>闰年</code>，否则输出 <code>平年</code>。</p>\n<p>规则（简化版）：能被 4 整除<strong>并且</strong>不能被 100 整除。</p>\n<p>输入框给的是 <code>2024</code>。</p>","starter":"year = int(input(\"请输入年份：\"))\n# 条件里同时用到 % 和 and","stdin":["2024"],"check":{"type":"output","expect":"闰年"},"hint":"if year % 4 == 0 and year % 100 != 0:","walkthrough":[],"solution":"year = int(input(\"请输入年份：\"))\nif year % 4 == 0 and year % 100 != 0:\n    print(\"闰年\")\nelse:\n    print(\"平年\")"}],"quiz":{"q":"a = 5，b = 10，(a > 3 and b < 5) or a == 5 的结果是？","options":["True","False","报错","None"],"answer":0,"explain":"括号里是 False，但 or 右边的 a == 5 成立，所以整体是 True。"},"localOnly":false},{"id":"c2l4","title":"while 循环","chapter_title":"第 2 章 · 让程序会思考、会重复","chapter_id":"c2","minutes":15,"level":"基础","goal":"会用 while 让代码重复执行，并且不会写出死循环。","theory":"<h3>要重复一百遍？交给循环</h3>\n<pre class=\"snippet\"><code>count = 1\nwhile count &lt;= 5:\n    print(count)\n    count = count + 1\nprint(\"循环结束\")</code></pre>\n<p>执行顺序：判断条件 → 成立就执行循环体 → 回到条件再判断，直到条件不成立。</p>\n<h3>循环的三个零件</h3>\n<ol><li><strong>起点</strong>：循环之前给 count 一个初值。</li><li><strong>条件</strong>：<code>while count &lt;= 5</code>。</li><li><strong>变化</strong>：循环体里必须有让条件最终不成立的操作。</li></ol>\n<p>少了第 3 步就是<strong>死循环</strong>，程序永远停不下来。</p>\n<div class=\"callout\"><p>提示：写死循环时一定要搭配 break 才能出来：<code>while True:</code> 一定要在某处跳出。</p></div>\n<h3>复合赋值：写得更短</h3>\n<table><thead><tr><th>短写法</th><th>等于</th></tr></thead><tbody><tr><td><code>count += 1</code></td><td><code>count = count + 1</code></td></tr><tr><td><code>total -= 5</code></td><td><code>total = total - 5</code></td></tr><tr><td><code>n *= 2</code></td><td><code>n = n * 2</code></td></tr></tbody></table>\n<div class=\"callout warn\"><p>注意：这个平台的代码在浏览器里跑。万一写出死循环页面会卡住，你的代码会自动保存，刷新页面就能恢复。</p></div>","example":{"title":"倒计时和求和","code":"n = 5\nwhile n > 0:\n    print(f\"倒计时 {n}\")\n    n -= 1\nprint(\"发射！\")\n\ntotal = 0\ni = 1\nwhile i <= 10:\n    total += i\n    i += 1\nprint(f\"1 到 10 的和是 {total}\")","stdin":[],"explain":"两个 while 之间用空行分开，注意每个循环都有自己的变量。","runnable":true,"notes":[]},"exercises":[{"title":"练习：累加到 n","task":"<p>读入一个正整数 n，用 while 算出 1 + 2 + ... + n，输出：</p>\n<p><code>和是 55</code></p>\n<p>输入框给的是 <code>10</code>。</p>","starter":"n = int(input(\"请输入 n：\"))\ntotal = 0\ni = 1\n# 用 while 累加","stdin":["10"],"check":{"type":"output","expect":"和是 55"},"hint":"循环条件写 i <= n，循环体里 total += i 和 i += 1 两个都要写。","walkthrough":[],"solution":"n = int(input(\"请输入 n：\"))\ntotal = 0\ni = 1\nwhile i <= n:\n    total += i\n    i += 1\nprint(f\"和是 {total}\")"}],"quiz":{"q":"下面哪段代码会变成死循环？","options":["i = 0; while i < 3: i += 1","i = 0; while i < 3: print(i)","i = 5; while i > 0: i -= 1","i = 0; while i < 3: i += 1; print(i)"],"answer":1,"explain":"循环体里 i 一直没变，条件永远成立，于是永远循环。"},"localOnly":false},{"id":"c2l5","title":"for 循环与 range","chapter_title":"第 2 章 · 让程序会思考、会重复","chapter_id":"c2","minutes":14,"level":"基础","goal":"掌握最常用的循环：遍历一串数字或一组数据。","theory":"<h3>for + range：重复固定次数</h3>\n<pre class=\"snippet\"><code>for i in range(5):\n    print(i)          # 0 1 2 3 4，从 0 开始，不含 5</code></pre>\n<table><thead><tr><th>写法</th><th>产生的数字</th></tr></thead><tbody><tr><td><code>range(5)</code></td><td>0, 1, 2, 3, 4</td></tr><tr><td><code>range(1, 6)</code></td><td>1, 2, 3, 4, 5</td></tr><tr><td><code>range(1, 10, 2)</code></td><td>1, 3, 5, 7, 9</td></tr><tr><td><code>range(5, 0, -1)</code></td><td>5, 4, 3, 2, 1</td></tr></tbody></table>\n<p>口诀：<strong>含头不含尾</strong>。<code>range(1, 6)</code> 里面没有 6。</p>\n<h3>for 和 while 怎么选</h3>\n<ul><li>知道要重复几次，或者要挨个处理一串东西，用 <code>for</code>。</li><li>不知道要循环多久，要等条件变化，用 <code>while</code>。</li></ul>\n<h3>循环里也能写 if</h3>\n<pre class=\"snippet\"><code>for i in range(1, 11):\n    if i % 2 == 0:\n        print(f\"{i} 是偶数\")</code></pre>\n<div class=\"callout\"><p>提示：第 3 章会学到 <code>for 名字 in 列表:</code>，那才是 for 最强大的用法。</p></div>","example":{"title":"乘法口诀和求和","code":"for i in range(1, 10):\n    print(f\"7 x {i} = {7 * i}\")\n\ntotal = 0\nfor i in range(1, 101):\n    total += i\nprint(f\"1 到 100 的和是 {total}\")","stdin":[],"explain":"第二个循环是 for 最经典的用法：求和。","runnable":true,"notes":[]},"exercises":[{"title":"练习：数出偶数的个数","task":"<p>用 for 循环统计 1 到 50 之间有多少个偶数，输出：</p>\n<p><code>1 到 50 之间有 25 个偶数</code></p>","starter":"count = 0\nfor i in range(1, 51):\n    # 是偶数就让 count 加 1\n","stdin":[],"check":{"type":"output","expect":"1 到 50 之间有 25 个偶数"},"hint":"循环里写 if i % 2 == 0: count += 1，最后再打印。","walkthrough":[],"solution":"count = 0\nfor i in range(1, 51):\n    if i % 2 == 0:\n        count += 1\nprint(f\"1 到 50 之间有 {count} 个偶数\")"}],"quiz":{"q":"range(2, 8) 会产生哪些数字？","options":["2 到 8（含 8）","2 到 7","3 到 8","0 到 7"],"answer":1,"explain":"含头不含尾，从 2 开始，到 8 之前停止。"},"localOnly":false},{"id":"c2l6","title":"break 与 continue","chapter_title":"第 2 章 · 让程序会思考、会重复","chapter_id":"c2","minutes":12,"level":"基础","goal":"会用 break 提前结束循环，用 continue 跳过某一次。","theory":"<h3>break：立刻跳出整个循环</h3>\n<pre class=\"snippet\"><code>for i in range(1, 100):\n    if i * i &gt; 50:\n        print(i)      # 8\n        break         # 找到就停，后面的数字不再检查</code></pre>\n<h3>continue：跳过这一次，继续下一次</h3>\n<pre class=\"snippet\"><code>for i in range(1, 6):\n    if i == 3:\n        continue      # 3 被跳过，不打印\n    print(i)</code></pre>\n<table><thead><tr><th>语句</th><th>作用</th></tr></thead><tbody><tr><td><code>break</code></td><td>整个循环结束，直接执行循环后面的代码</td></tr><tr><td><code>continue</code></td><td>只结束这一轮，马上开始下一轮</td></tr></tbody></table>\n<h3>经典组合</h3>\n<pre class=\"snippet\"><code>while True:\n    answer = input(\"输入 quit 退出：\")\n    if answer == \"quit\":\n        break\n    print(f\"你输入了 {answer}\")</code></pre>\n<div class=\"callout\"><p>提示：break 和 continue 只对<strong>它们所在的那一层</strong>循环有效，多层嵌套时要特别小心。</p></div>","example":{"title":"找第一个能被 7 整除的数","code":"for i in range(20, 100):\n    if i % 7 != 0:\n        continue          # 不是 7 的倍数就跳过\n    print(f\"第一个能被 7 整除的数是 {i}\")\n    break","stdin":[],"explain":"continue 让不满足条件的数字快速跳过，break 让找到之后马上停下。","runnable":true,"notes":[]},"exercises":[{"title":"练习：累加到超过 100","task":"<p>从 1 开始一直累加，总和<strong>超过</strong> 100 就停止，输出：</p>\n<p><code>加到 14 时总和是 105</code></p>","starter":"total = 0\ni = 0\nwhile True:\n    # 每次加一个数，超过 100 就 break\n","stdin":[],"check":{"type":"output","expect":"加到 14 时总和是 105"},"hint":"先 i += 1，再 total += i，然后 if total > 100: break，最后打印。","walkthrough":[],"solution":"total = 0\ni = 0\nwhile True:\n    i += 1\n    total += i\n    if total > 100:\n        break\nprint(f\"加到 {i} 时总和是 {total}\")"}],"quiz":{"q":"循环里遇到 continue 会发生什么？","options":["退出整个循环","跳过本轮剩下的代码，进入下一轮","结束程序","重新开始程序"],"answer":1,"explain":"continue 只是跳过当前这一轮的剩余部分，循环本身还会继续。"},"localOnly":false}]},{"id":"c3","title":"第 3 章 · 装数据的盒子","summary":"列表、字典、元组、集合——学会一次处理一大批数据。","lessons":[{"id":"c3l1","title":"列表入门：一串数据装在一起","chapter_title":"第 3 章 · 装数据的盒子","chapter_id":"c3","minutes":14,"level":"基础","goal":"会创建列表、用下标取值、切片，并知道下标从 0 开始。","theory":"<h3>列表就是一排编了号的格子</h3>\n<pre class=\"snippet\"><code>fruits = [\"苹果\", \"香蕉\", \"橘子\"]\nprint(fruits)        # ['苹果', '香蕉', '橘子']\nprint(len(fruits))   # 3，一共几个\nprint(fruits[0])     # 苹果   第 0 个（第一个）\nprint(fruits[2])     # 橘子   第 2 个（第三个）\nprint(fruits[-1])    # 橘子   负数表示从后往前数</code></pre>\n<h3>切片：一次取一段</h3>\n<pre class=\"snippet\"><code>nums = [10, 20, 30, 40, 50]\nprint(nums[1:3])     # [20, 30]   含头不含尾\nprint(nums[:2])      # [10, 20]   从头开始\nprint(nums[2:])      # [30, 40, 50]  一直取到最后</code></pre>\n<h3>列表里可以放任何东西</h3>\n<pre class=\"snippet\"><code>mixed = [\"小明\", 18, True, 92.5]\nscores = [88, 92, 79]\nprint(scores[1] + 1)     # 93</code></pre>\n<div class=\"callout warn\"><p>注意：<code>IndexError: list index out of range</code> 意思是下标超出范围了。三个元素的列表，最大下标是 2，写 <code>fruits[3]</code> 就会报这个错。</p></div>","example":{"title":"我的播放列表","code":"songs = [\"稻香\", \"晴天\", \"夜曲\", \"告五人\"]\nprint(len(songs))\nprint(songs[0])\nprint(songs[-1])\nprint(songs[:2])\nprint(f\"最后一首是 {songs[-1]}\")","stdin":[],"explain":"试试把 songs 换成你自己的歌单，再运行看看。","runnable":true,"notes":[]},"exercises":[{"title":"练习：取出想要的内容","task":"<p>已有列表 <code>nums = [10, 20, 30, 40, 50]</code>，输出三行：</p>\n<pre class=\"snippet\"><code>第一个是 10\n最后一个是 50\n中间两个是 [20, 30]</code></pre>","starter":"nums = [10, 20, 30, 40, 50]\n# 用下标和切片取出来打印","stdin":[],"check":{"type":"output","expect":"第一个是 10\n最后一个是 50\n中间两个是 [20, 30]"},"hint":"用 nums[0]、nums[-1]、nums[1:3]，放进 f-string 里打印。","walkthrough":[],"solution":"nums = [10, 20, 30, 40, 50]\nprint(f\"第一个是 {nums[0]}\")\nprint(f\"最后一个是 {nums[-1]}\")\nprint(f\"中间两个是 {nums[1:3]}\")"}],"quiz":{"q":"列表 a = [1, 2, 3]，a[-1] 是多少？","options":["1","2","3","报错"],"answer":2,"explain":"-1 表示倒数第一个元素，也就是 3。"},"localOnly":false},{"id":"c3l2","title":"列表的增删改查","chapter_title":"第 3 章 · 装数据的盒子","chapter_id":"c3","minutes":14,"level":"基础","goal":"会用 append、insert、remove、pop、sort，以及判断元素是否存在。","theory":"<h3>常用操作一览</h3>\n<pre class=\"snippet\"><code>todo = [\"买菜\", \"写作业\"]\n\ntodo.append(\"运动\")        # 末尾加一个\ntodo.insert(0, \"起床\")     # 插到第 0 位\ntodo.remove(\"买菜\")        # 删掉指定的内容\nlast = todo.pop()          # 取出并删掉最后一个\ntodo[0] = \"早睡\"           # 改第 0 个\n\nprint(todo)\nprint(last)</code></pre>\n<table><thead><tr><th>操作</th><th>作用</th></tr></thead><tbody><tr><td><code>列表.append(x)</code></td><td>末尾添加 x</td></tr><tr><td><code>列表.insert(i, x)</code></td><td>插入到下标 i</td></tr><tr><td><code>列表.remove(x)</code></td><td>删除第一个等于 x 的元素</td></tr><tr><td><code>列表.pop()</code></td><td>取出并删除最后一个（可指定下标）</td></tr><tr><td><code>列表.sort()</code></td><td>从小到大排序</td></tr><tr><td><code>x in 列表</code></td><td>判断 x 在不在列表里</td></tr></tbody></table>\n<h3>排序和反转</h3>\n<pre class=\"snippet\"><code>scores = [88, 92, 79]\nscores.sort()                # 原地从小到大\nprint(scores)                # [79, 88, 92]\nprint(max(scores), min(scores), sum(scores))\nscores.sort(reverse=True)    # 从大到小</code></pre>\n<div class=\"callout\"><p>提示：<code>remove</code> 删除的是<strong>内容</strong>，<code>pop</code> 删除的是<strong>位置</strong>。删不存在的元素会报错，所以删除前常先判断 <code>if x in 列表:</code>。</p></div>","example":{"title":"管理一张待办清单","code":"todo = [\"买菜\", \"写作业\"]\ntodo.append(\"运动\")\ntodo.insert(0, \"起床\")\nprint(\"现在有：\", todo)\n\nif \"写作业\" in todo:\n    todo.remove(\"写作业\")\n    print(\"作业做完了，删掉它\")\n\ntodo.sort()\nprint(\"整理后：\", todo)\nprint(f\"还剩 {len(todo)} 件事\")","stdin":[],"explain":"注意 if 里面既能写 print 也能写 remove，缩进保持一致就可以。","runnable":true,"notes":[]},"exercises":[{"title":"练习：整理购物清单","task":"<p>已有 <code>cart = [\"牛奶\", \"面包\"]</code>，请：</p>\n<ol><li>在末尾加入 <code>\"鸡蛋\"</code></li><li>把第一项改成 <code>\"酸奶\"</code></li><li>排序后打印整个列表，再打印一行个数</li></ol>\n<p>输出：</p>\n<pre class=\"snippet\"><code>['酸奶', '面包', '鸡蛋']\n一共 3 件</code></pre>","starter":"cart = [\"牛奶\", \"面包\"]\n# 依次执行三个操作","stdin":[],"check":{"type":"output","expect":"['酸奶', '面包', '鸡蛋']\n一共 3 件"},"hint":"append、cart[0] = \"酸奶\"、sort()，打印用 print(cart) 和 f-string。","walkthrough":[],"solution":"cart = [\"牛奶\", \"面包\"]\ncart.append(\"鸡蛋\")\ncart[0] = \"酸奶\"\ncart.sort()\nprint(cart)\nprint(f\"一共 {len(cart)} 件\")"}],"quiz":{"q":"scores = [70, 80, 90]，执行 scores.pop() 之后 scores 是什么？","options":["[70, 80, 90]","[70, 80]","[80, 90]","[90]"],"answer":1,"explain":"pop() 会把最后一个元素取出来并删掉，所以剩下 [70, 80]。"},"localOnly":false},{"id":"c3l3","title":"遍历列表与统计","chapter_title":"第 3 章 · 装数据的盒子","chapter_id":"c3","minutes":14,"level":"基础","goal":"会用 for 遍历列表，算出总和、平均值、最大值，并学会筛选。","theory":"<h3>for 直接遍历列表</h3>\n<pre class=\"snippet\"><code>scores = [88, 92, 79]\nfor s in scores:\n    print(s)</code></pre>\n<p>读作：「对 scores 里的每一个元素，把它叫做 s，然后执行下面的代码。」</p>\n<h3>累加和平均</h3>\n<pre class=\"snippet\"><code>scores = [88, 92, 79]\ntotal = 0\nfor s in scores:\n    total += s\nprint(f\"总分 {total}，平均 {total / len(scores)}\")</code></pre>\n<h3>同时拿到下标和内容：enumerate</h3>\n<pre class=\"snippet\"><code>for i, s in enumerate(scores):\n    print(f\"第 {i + 1} 位同学：{s} 分\")</code></pre>\n<h3>筛选</h3>\n<pre class=\"snippet\"><code>passed = []\nfor s in scores:\n    if s &gt;= 80:\n        passed.append(s)\nprint(passed)</code></pre>\n<div class=\"callout\"><p>提示：如果只想知道总和、最大、最小，Python 已经准备好了：<code>sum(scores)</code>、<code>max(scores)</code>、<code>min(scores)</code>。自己写循环是为了理解原理。</p></div>","example":{"title":"班级成绩小统计","code":"scores = [88, 92, 79, 95, 60]\ntotal = 0\nfor s in scores:\n    total += s\naverage = total / len(scores)\nprint(f\"平均分 {average:.1f}\")\nprint(f\"最高 {max(scores)}，最低 {min(scores)}\")\n\nfor i, s in enumerate(scores):\n    mark = \"及格\" if s >= 60 else \"不及格\"\n    print(f\"第 {i + 1} 位：{s} 分 {mark}\")","stdin":[],"explain":"倒数第二行是一种简写：把 if 和 else 写在一行里给变量赋值。","runnable":true,"notes":[]},"exercises":[{"title":"练习：统计及格人数","task":"<p>已有列表 <code>scores = [45, 88, 72, 90, 55, 99]</code>。</p>\n<p>统计及格（大于等于 60）的人数，并输出：</p>\n<pre class=\"snippet\"><code>及格 4 人\n平均分 74.8</code></pre>","starter":"scores = [45, 88, 72, 90, 55, 99]\ncount = 0\n# 用 for 循环统计及格人数\n# 再算平均分（可以复用内置函数 sum）","stdin":[],"check":{"type":"output","expect":"及格 4 人\n平均分 74.8"},"hint":"循环里 if s >= 60: count += 1；平均分用 sum(scores) / len(scores) 并按 :.1f 输出。","walkthrough":[],"solution":"scores = [45, 88, 72, 90, 55, 99]\ncount = 0\nfor s in scores:\n    if s >= 60:\n        count += 1\nprint(f\"及格 {count} 人\")\nprint(f\"平均分 {sum(scores) / len(scores):.1f}\")"}],"quiz":{"q":"想同时拿到下标和元素，应该用哪个函数？","options":["range","enumerate","len","index"],"answer":1,"explain":"enumerate(列表) 每次给出 (下标, 元素)。"},"localOnly":false},{"id":"c3l4","title":"字典：用名字找数据","chapter_title":"第 3 章 · 装数据的盒子","chapter_id":"c3","minutes":15,"level":"基础","goal":"会用字典存成对的「键和值」，并做增删改查。","theory":"<h3>字典是带标签的储物柜</h3>\n<p>列表用 0、1、2 找东西，字典用<strong>名字（键）</strong>找东西：</p>\n<pre class=\"snippet\"><code>student = {\"name\": \"小明\", \"age\": 18, \"score\": 92}\nprint(student[\"name\"])       # 小明\nprint(student.get(\"score\"))  # 92\nprint(\"age\" in student)      # True</code></pre>\n<h3>增、改、删</h3>\n<pre class=\"snippet\"><code>student[\"city\"] = \"杭州\"     # 新增\nstudent[\"age\"] = 19          # 修改\ndel student[\"city\"]          # 删除</code></pre>\n<h3>遍历字典</h3>\n<pre class=\"snippet\"><code>for k in student:                 # 默认遍历键\n    print(k, student[k])\n\nfor k, v in student.items():      # 同时拿到键和值\n    print(f\"{k} → {v}\")</code></pre>\n<table><thead><tr><th>写法</th><th>说明</th></tr></thead><tbody><tr><td><code>d[\"key\"]</code></td><td>取值，键不存在会报 KeyError</td></tr><tr><td><code>d.get(\"key\")</code></td><td>取值，键不存在返回 None（更安全）</td></tr><tr><td><code>d.keys()</code> / <code>d.values()</code> / <code>d.items()</code></td><td>所有键 / 所有值 / 所有键值对</td></tr></tbody></table>\n<div class=\"callout\"><p>提示：字典的键必须是不可变的，一般用字符串或数字。列表不能当键。</p></div>","example":{"title":"一本小通讯录","code":"contacts = {\"小明\": \"13800000001\", \"小红\": \"13900000002\"}\nprint(contacts[\"小明\"])\n\ncontacts[\"小刚\"] = \"13700000003\"     # 新增\ncontacts[\"小明\"] = \"13800000009\"     # 修改\n\nname = \"小红\"\nif name in contacts:\n    print(f\"{name}的电话是 {contacts[name]}\")\nelse:\n    print(\"通讯录里没有这个人\")\n\nfor k, v in contacts.items():\n    print(f\"{k}: {v}\")","stdin":[],"explain":"字典最常用的场景就是这种「名字 → 信息」的查表操作。","runnable":true,"notes":[]},"exercises":[{"title":"练习：学生档案","task":"<p>创建字典 <code>student</code>，包含：</p>\n<ul><li><code>name</code> 是 <code>小明</code></li><li><code>age</code> 是 <code>18</code></li></ul>\n<p>然后新增 <code>score</code> 为 <code>92</code>，并把 age 改成 <code>19</code>，最后按下面的格式打印：</p>\n<pre class=\"snippet\"><code>小明 19 岁，成绩 92</code></pre>","starter":"# 创建字典，然后新增和修改，最后打印","stdin":[],"check":{"type":"output","expect":"小明 19 岁，成绩 92"},"hint":"student = {\"name\": \"小明\", \"age\": 18}，再用 student[\"score\"] = 92 新增。","walkthrough":[],"solution":"student = {\"name\": \"小明\", \"age\": 18}\nstudent[\"score\"] = 92\nstudent[\"age\"] = 19\nname = student[\"name\"]\nprint(f\"{name} {student['age']} 岁，成绩 {student['score']}\")"}],"quiz":{"q":"访问字典里不存在的键，想避免程序报错，应该用？","options":["d[key]","d.get(key)","d.find(key)","d.index(key)"],"answer":1,"explain":"get 在键不存在时返回 None，不会抛出 KeyError。"},"localOnly":false},{"id":"c3l5","title":"元组与集合","chapter_title":"第 3 章 · 装数据的盒子","chapter_id":"c3","minutes":12,"level":"基础","goal":"知道什么时候用不可变的元组，以及怎么用集合去重。","theory":"<h3>元组：不能改的列表</h3>\n<pre class=\"snippet\"><code>point = (3, 5)\nprint(point[0])       # 3\npoint[0] = 9          # 报错！元组不能修改</code></pre>\n<p>元组用圆括号，适合表示<strong>天生一组、不该被改</strong>的数据，比如坐标、日期、一条数据库记录：</p>\n<pre class=\"snippet\"><code>birthday = (2008, 5, 12)\nyear, month, day = birthday      # 拆包：一次分给三个变量\nprint(f\"生日是 {year} 年 {month} 月 {day} 日\")</code></pre>\n<h3>集合：自动去重、能快速查</h3>\n<pre class=\"snippet\"><code>nums = {1, 2, 2, 3, 3, 3}\nprint(nums)              # {1, 2, 3}  自动去掉重复\nprint(2 in nums)         # True\n\na = {1, 2, 3}\nb = {3, 4}\nprint(a &amp; b)             # {3}      交集\nprint(a | b)             # {1,2,3,4} 并集\nprint(a - b)             # {1, 2}   差集</code></pre>\n<h3>列表去重的常用技巧</h3>\n<pre class=\"snippet\"><code>names = [\"小明\", \"小红\", \"小明\"]\nunique = list(set(names))</code></pre>\n<table><thead><tr><th>类型</th><th>括号</th><th>能改吗</th><th>有序吗</th><th>用途</th></tr></thead><tbody><tr><td>列表 list</td><td><code>[ ]</code></td><td>能</td><td>有顺序</td><td>通用容器</td></tr><tr><td>元组 tuple</td><td><code>( )</code></td><td>不能</td><td>有顺序</td><td>固定的一组数据</td></tr><tr><td>集合 set</td><td><code>{ }</code></td><td>能</td><td>无顺序</td><td>去重、集合运算</td></tr><tr><td>字典 dict</td><td><code>{k: v}</code></td><td>能</td><td>有顺序</td><td>按键查值</td></tr></tbody></table>\n<div class=\"callout\"><p>提示：<code>list(set(...))</code> 之后顺序是随机的；如果要求排序，再补一句 <code>sort()</code>。</p></div>","example":{"title":"点名去重","code":"names = [\"小明\", \"小红\", \"小明\", \"小刚\", \"小红\"]\nunique = list(set(names))\nunique.sort()\nprint(f\"一共有 {len(unique)} 个人：{unique}\")\n\npoint = (3, 5)\nx, y = point\nprint(f\"x 坐标 {x}，y 坐标 {y}\")","stdin":[],"explain":"集合负责去重，list() 负责变回列表，sort() 负责排序，三步走。","runnable":true,"notes":[]},"exercises":[{"title":"练习：两个班的共同成员","task":"<p>班级 A 和班级 B 的名单如下，找出<strong>同时参加</strong>两个班的人（交集），排序后输出：</p>\n<pre class=\"snippet\"><code>共同成员 2 人：小明, 小红</code></pre>","starter":"class_a = {\"小明\", \"小红\", \"小刚\"}\nclass_b = {\"小红\", \"小明\", \"小李\"}\n# 用交集找出共同成员","stdin":[],"check":{"type":"output","expect":"共同成员 2 人：小明, 小红"},"hint":"both = class_a & class_b，再 list() 转成列表、sort() 排序，用 \", \".join(both) 拼成字符串。","walkthrough":[],"solution":"class_a = {\"小明\", \"小红\", \"小刚\"}\nclass_b = {\"小红\", \"小明\", \"小李\"}\nboth = list(class_a & class_b)\nboth.sort()\nsep = \", \"\nprint(f\"共同成员 {len(both)} 人：{sep.join(both)}\")"}],"quiz":{"q":"想快速去掉一列数据里的重复项，最方便的是？","options":["list","tuple","set","int"],"answer":2,"explain":"集合自动去重，所以 list(set(数据)) 是最常见的写法。"},"localOnly":false},{"id":"c3l6","title":"字符串进阶：拆分、连接与查找","chapter_title":"第 3 章 · 装数据的盒子","chapter_id":"c3","minutes":14,"level":"基础","goal":"会用 split、join、replace 处理文本，为后面的项目打基础。","theory":"<h3>split：把一句话拆成列表</h3>\n<pre class=\"snippet\"><code>line = \"小明,18,92\"\nparts = line.split(\",\")\nprint(parts)         # ['小明', '18', '92']\nprint(parts[0])      # 小明</code></pre>\n<p>不写参数时会按空白（空格、换行）拆分：</p>\n<pre class=\"snippet\"><code>print(\"我爱 学 Python\".split())    # ['我爱', '学', 'Python']</code></pre>\n<h3>join：把列表拼回字符串</h3>\n<pre class=\"snippet\"><code>words = [\"我\", \"爱\", \"Python\"]\nprint(\"-\".join(words))    # 我-爱-Python\nprint(\" \".join(words))    # 我 爱 Python</code></pre>\n<div class=\"callout warn\"><p>注意：join 的括号里必须是<strong>字符串列表</strong>。如果列表里是数字，要先用 str() 转换，否则报 TypeError。</p></div>\n<h3>查找与替换</h3>\n<pre class=\"snippet\"><code>s = \"今天天气不错，心情也不错\"\nprint(s.replace(\"不错\", \"很好\"))   # 今天天气很好，心情也很好\nprint(s.count(\"不错\"))             # 2\nprint(s.find(\"心情\"))              # 8（下标）\nprint(\"天气\" in s)                 # True\nprint(s.startswith(\"今天\"))        # True</code></pre>\n<h3>去掉多余空白</h3>\n<pre class=\"snippet\"><code>print(\"   hello   \".strip())    # hello      两头\nprint(\"   hello   \".lstrip())   # 只去左边\nprint(\"   hello   \".rstrip())   # 只去右边</code></pre>\n<div class=\"callout\"><p>提示：处理用户输入时先 <code>.strip()</code> 是好习惯，能避开「多了个空格就判断失败」的问题。</p></div>","example":{"title":"解析一行数据","code":"line = \"小明,18,92\"\nparts = line.split(\",\")\nprint(parts)\n\nname = parts[0]\nage = int(parts[1])\nscore = int(parts[2])\nprint(f\"{name} 今年 {age} 岁，成绩 {score} 分\")\n\nprint(\" / \".join(parts))","stdin":[],"explain":"split 出来的都是字符串，所以数字要用 int() 转换才能计算。","runnable":true,"notes":[]},"exercises":[{"title":"练习：统计单词","task":"<p>给出句子 <code>text = \"python is fun and python is easy\"</code>。</p>\n<p>用 split 把它变成单词列表，输出：</p>\n<pre class=\"snippet\"><code>一共 7 个单词\n单词里有 python 吗？True</code></pre>\n<p>（第二行要用 <code>in</code> 判断）</p>","starter":"text = \"python is fun and python is easy\"\nwords = text.split()\n# 打印单词个数，以及 python 是否在列表里","stdin":[],"check":{"type":"output","expect":"一共 7 个单词\n单词里有 python 吗？True"},"hint":"用 f\"一共 {len(words)} 个单词\"，再用 \"python\" in words 判断。","walkthrough":[],"solution":"text = \"python is fun and python is easy\"\nwords = text.split()\nprint(f\"一共 {len(words)} 个单词\")\nfound = \"python\" in words\nprint(f\"单词里有 python 吗？{found}\")"}],"quiz":{"q":"\"a,b,c\".split(\",\") 的结果是？","options":["'a,b,c'","['a', 'b', 'c']","'abc'","报错"],"answer":1,"explain":"split 会按指定字符切开，返回一个列表。"},"localOnly":false}]},{"id":"c4","title":"第 4 章 · 函数与模块","summary":"把代码打包成可以重复使用的积木，再学会借用 Python 自带的工具箱。","lessons":[{"id":"c4l1","title":"定义函数：给一段代码起名字","chapter_title":"第 4 章 · 函数与模块","chapter_id":"c4","minutes":14,"level":"基础","goal":"会用 def 定义函数、用 return 返回结果，理解参数的作用。","theory":"<h3>为什么要写函数</h3>\n<p>同一段计算写三遍，日后改就要改三处。函数把一段逻辑打包起来，起个名字，之后随时调用：</p>\n<pre class=\"snippet\"><code>def area(width, height):\n    return width * height\n\nprint(area(3, 4))     # 12\nprint(area(5, 2))     # 10</code></pre>\n<h3>读懂这几行</h3>\n<ul><li><code>def</code> 表示「定义函数」。</li><li><code>area</code> 是函数名，<code>width</code>、<code>height</code> 是<strong>参数</strong>（占位用的名字）。</li><li><code>return</code> 把结果交回给调用它的地方。</li><li>调用时把真正的值传进去，这叫<strong>实参</strong>。</li></ul>\n<h3>print 和 return 的区别（新手最容易混）</h3>\n<pre class=\"snippet\"><code>def add_print(a, b):\n    print(a + b)          # 只是显示出来，外面拿不到结果\n\ndef add_return(a, b):\n    return a + b          # 把结果交出去\n\nx = add_print(1, 2)       # 屏幕上显示 3，但 x 是 None\ny = add_return(1, 2)      # y 是 3\nprint(y + 10)             # 13</code></pre>\n<div class=\"callout\"><p>提示：一个函数没有写 return 时，它的返回值是 <code>None</code>（表示「什么都没有」）。</p></div>\n<div class=\"callout warn\"><p>注意：小数计算会出现长尾巴，比如 <code>100 * 1.1</code> 得到的是 <code>110.00000000000001</code>（这是所有编程语言的通病）。显示时用 <code>round(值, 2)</code> 或 f-string 的 <code>:.2f</code> 处理一下就好。</p></div>\n<h3>函数里也可以有 if 和循环</h3>\n<pre class=\"snippet\"><code>def grade(score):\n    if score &gt;= 90:\n        return \"优秀\"\n    elif score &gt;= 60:\n        return \"及格\"\n    return \"不及格\"        # 前面的条件都不满足时才会走到这里</code></pre>","example":{"title":"把计算打包成函数","code":"def area(width, height):\n    return width * height\n\ndef greeting(name):\n    return f\"你好，{name}！\"\n\nprint(area(3, 4))\nprint(area(5, 2))\nprint(greeting(\"小明\"))","stdin":[],"explain":"定义函数时缩进的两行属于函数体；不缩进的代码才是「主程序」。","runnable":true,"notes":[]},"exercises":[{"title":"练习：写一个加税函数","task":"<p>定义函数 <code>with_tax(price)</code>，返回价格加上 10% 税之后的金额。</p>\n<p>然后打印 <code>with_tax(100)</code>，输出：<code>含税价 110.0 元</code></p>","starter":"def with_tax(price):\n    # 在这里 return 结果\n\n# 打印结果","stdin":[],"check":{"type":"output","expect":"含税价 110.0 元"},"hint":"return round(price * 1.1, 2)，打印时用 print(f\"含税价 {with_tax(100)} 元\")。round 是为了去掉小数尾巴。","walkthrough":[],"solution":"def with_tax(price):\n    return round(price * 1.1, 2)\n\nprint(f\"含税价 {with_tax(100)} 元\")"}],"quiz":{"q":"函数里只写了 print 没有写 return，调用它的结果是？","options":["报错","None","空字符串","上一次的结果"],"answer":1,"explain":"没有 return 的函数返回 None，表示没有结果。"},"localOnly":false},{"id":"c4l2","title":"参数的进阶用法","chapter_title":"第 4 章 · 函数与模块","chapter_id":"c4","minutes":14,"level":"基础","goal":"会用默认参数、关键字参数，返回多个值。","theory":"<h3>默认参数：不传也能用</h3>\n<pre class=\"snippet\"><code>def greet(name, greeting=\"你好\"):\n    return f\"{greeting}，{name}\"\n\nprint(greet(\"小明\"))                  # 你好，小明\nprint(greet(\"Tom\", \"Hello\"))          # Hello，Tom</code></pre>\n<div class=\"callout warn\"><p>注意：有默认值的参数必须放在没有默认值的参数<strong>后面</strong>，否则报语法错误。</p></div>\n<h3>关键字参数：顺序随便，看得更清楚</h3>\n<pre class=\"snippet\"><code>def order(item, count=1, size=\"中杯\"):\n    return f\"{size} {item} x {count}\"\n\nprint(order(\"奶茶\", count=3, size=\"大杯\"))</code></pre>\n<h3>返回多个值</h3>\n<pre class=\"snippet\"><code>def min_max(nums):\n    return min(nums), max(nums)\n\nlow, high = min_max([3, 9, 1])\nprint(low, high)    # 1 9</code></pre>\n<p>其实返回的是元组 <code>(1, 9)</code>，拆包写法一次分给两个变量。</p>\n<h3>参数也可以是列表和字典</h3>\n<pre class=\"snippet\"><code>def total_price(prices):\n    return sum(prices)\n\nprint(total_price([10, 20, 30]))    # 60</code></pre>\n<div class=\"callout\"><p>提示：参数名起得清楚，函数就好用。<code>def f(a, b)</code> 谁也看不懂，<code>def f(price, count)</code> 一眼就明白。</p></div>","example":{"title":"带默认值的小工具","code":"def line(text, repeat=1, end=\"\\n\"):\n    return text * repeat + end\n\nprint(line(\"=\", 20))\nprint(line(\"好\", 3, end=\"！\\n\"))\n\ndef stats(nums):\n    return min(nums), max(nums), sum(nums) / len(nums)\n\nlow, high, avg = stats([88, 92, 79])\nprint(f\"最低 {low}，最高 {high}，平均 {avg:.1f}\")","stdin":[],"explain":"函数一次返回三个值，用三个变量接住，这就是拆包。","runnable":true,"notes":[]},"exercises":[{"title":"练习：写一个评分函数","task":"<p>定义 <code>describe(score, full=100)</code>：返回一段文字 <code>92 / 100</code>。</p>\n<p>然后输出两行：</p>\n<pre class=\"snippet\"><code>92 / 100\n45 / 50</code></pre>","starter":"def describe(score, full=100):\n    # 返回 f-string\n\n# 调用两次并打印","stdin":[],"check":{"type":"output","expect":"92 / 100\n45 / 50"},"hint":"return f\"{score} / {full}\"，第二次调用写 describe(45, 50)。","walkthrough":[],"solution":"def describe(score, full=100):\n    return f\"{score} / {full}\"\n\nprint(describe(92))\nprint(describe(45, 50))"}],"quiz":{"q":"def f(a, b=2) 这样定义，调用 f(1) 时 b 是多少？","options":["报错","None","2","1"],"answer":2,"explain":"没有传值时就使用默认值 2。"},"localOnly":false},{"id":"c4l3","title":"作用域：变量的活动范围","chapter_title":"第 4 章 · 函数与模块","chapter_id":"c4","minutes":12,"level":"基础","goal":"理解局部变量和全局变量，能解释 UnboundLocalError 的原因。","theory":"<h3>函数里面的变量，外面看不到</h3>\n<pre class=\"snippet\"><code>def f():\n    secret = 42        # 局部变量，出了函数就消失\n\nf()\nprint(secret)          # 报 NameError</code></pre>\n<h3>外面定义的变量，函数里可以读</h3>\n<pre class=\"snippet\"><code>rate = 1.1\n\ndef with_tax(price):\n    return price * rate    # 能读到外面的 rate</code></pre>\n<h3>但函数里直接改外面的变量会出问题</h3>\n<pre class=\"snippet\"><code>total = 0\n\ndef add(x):\n    total = total + x    # 报 UnboundLocalError</code></pre>\n<p>只要函数里出现了对 <code>total</code> 的<strong>赋值</strong>，Python 就认为它是局部变量，而局部变量在赋值前不能读，于是报错。</p>\n<p>正确做法有两种：</p>\n<pre class=\"snippet\"><code># 方法一（推荐）：用 return 把结果交出来\ndef add(total, x):\n    return total + x\n\ntotal = add(total, 5)</code></pre>\n<pre class=\"snippet\"><code># 方法二：声明成全局变量（少用，容易把代码搞乱）\ndef add(x):\n    global total\n    total = total + x</code></pre>\n<div class=\"callout\"><p>提示：函数的理想状态是「给什么算出来什么，不偷偷改外面的东西」，这样的函数最好测试和维护。</p></div>","example":{"title":"两种做法的对比","code":"hits = 0\n\ndef hit_bad():\n    global hits        # 直接改外面的变量\n    hits += 1\n\ndef hit_good(hits):\n    return hits + 1    # 把新值交出来\n\nhit_bad()\nhit_bad()\nprint(\"坏写法的结果：\", hits)\n\nhits = hit_good(hits)\nprint(\"好写法的结果：\", hits)","stdin":[],"explain":"两种写法结果一样，但第二种更容易看懂、也更好复用到别的地方。","runnable":true,"notes":[]},"exercises":[{"title":"练习：修好这个计分函数","task":"<p>下面这段代码会报 <code>UnboundLocalError</code>，请用 <code>return</code> 的方式修好它，让它输出：</p>\n<pre class=\"snippet\"><code>得分 15</code></pre>","starter":"score = 0\n\ndef add_points(points):\n    score = score + points   # 这里会报错\n    return score\n\nscore = add_points(10)\nscore = add_points(5)\nprint(f\"得分 {score}\")","stdin":[],"check":{"type":"output","expect":"得分 15"},"hint":"把函数改成 def add_points(score, points): return score + points，调用时写成 add_points(score, 10)。","walkthrough":[],"solution":"score = 0\n\ndef add_points(score, points):\n    return score + points\n\nscore = add_points(score, 10)\nscore = add_points(score, 5)\nprint(f\"得分 {score}\")"}],"quiz":{"q":"函数内部的变量，函数执行完之后还能访问吗？","options":["能，一直存在","不能，作用域已经结束","只有数字能","要看变量名长短"],"answer":1,"explain":"局部变量的生命只到函数结束，外面访问会报 NameError。"},"localOnly":false},{"id":"c4l4","title":"借用工具箱：import 模块","chapter_title":"第 4 章 · 函数与模块","chapter_id":"c4","minutes":14,"level":"基础","goal":"会 import 模块，使用 math 和 random 里的功能。","theory":"<h3>用别人写好的代码</h3>\n<p>Python 自带大量模块，导入就能用：</p>\n<pre class=\"snippet\"><code>import math\n\nprint(math.sqrt(16))     # 4.0  平方根\nprint(math.pi)           # 3.141592653589793\nprint(math.floor(3.7))   # 3    向下取整\nprint(math.ceil(3.2))    # 4    向上取整</code></pre>\n<h3>随机数：random</h3>\n<pre class=\"snippet\"><code>import random\n\nprint(random.randint(1, 6))       # 1~6 之间的整数，含两端\nprint(random.choice([\"石头\", \"剪刀\", \"布\"]))   # 随机挑一个\nnums = [1, 2, 3, 4]\nrandom.shuffle(nums)              # 打乱顺序（原地修改）\nprint(nums)</code></pre>\n<h3>只导入需要的部分</h3>\n<pre class=\"snippet\"><code>from math import sqrt, pi\nprint(sqrt(9), pi)</code></pre>\n<h3>给模块起个短名字</h3>\n<pre class=\"snippet\"><code>import random as rd\nprint(rd.randint(1, 10))</code></pre>\n<table><thead><tr><th>常用模块</th><th>能干什么</th></tr></thead><tbody><tr><td><code>math</code></td><td>平方根、三角函数、取整</td></tr><tr><td><code>random</code></td><td>随机数、随机选择、洗牌</td></tr><tr><td><code>datetime</code></td><td>日期和时间</td></tr><tr><td><code>json</code></td><td>读写 JSON 数据</td></tr><tr><td><code>collections</code></td><td>Counter 计数、defaultdict 等好用的容器</td></tr></tbody></table>\n<div class=\"callout\"><p>提示：函数名前面要带上模块名，写 <code>math.sqrt(16)</code> 而不是 <code>sqrt(16)</code>（除非用了 from 导入）。</p></div>\n<div class=\"callout warn\"><p>注意：<code>random</code> 每次结果都不一样，所以测试程序时别把随机结果写死在判断里。</p></div>","example":{"title":"掷骰子小程序","code":"import math\nimport random\n\nprint(f\"16 的平方根是 {math.sqrt(16)}\")\n\ndice = random.randint(1, 6)\nprint(f\"你掷出了 {dice} 点\")\n\ncolors = [\"红\", \"黄\", \"蓝\"]\nprint(random.choice(colors))","stdin":[],"explain":"多运行几次，random 的结果每次都不一样；math 的结果永远是确定的。","runnable":true,"notes":[]},"exercises":[{"title":"练习：四舍五入小助手","task":"<p>导入 <code>math</code>，用 <code>math.ceil</code> 和 <code>math.floor</code> 处理数字 <code>3.7</code>，输出两行：</p>\n<pre class=\"snippet\"><code>向上取整 4\n向下取整 3</code></pre>","starter":"# 第 1 步：导入 math\n\nn = 3.7\n# 用 math.ceil / math.floor 打印两行","stdin":[],"check":{"type":"output","expect":"向上取整 4\n向下取整 3"},"hint":"import math 之后调用 math.ceil(n) 和 math.floor(n)，结果放进 f-string 里打印。","walkthrough":[],"solution":"import math\n\nn = 3.7\nprint(f\"向上取整 {math.ceil(n)}\")\nprint(f\"向下取整 {math.floor(n)}\")"}],"quiz":{"q":"导入 math 后，求 9 的平方根应该写？","options":["sqrt(9)","math.sqrt(9)","math(sqrt, 9)","import.sqrt(9)"],"answer":1,"explain":"用 import math 时，要带上模块名 math. 才能调用。"},"localOnly":false}]},{"id":"c5","title":"第 5 章 · 面对错误和文件","summary":"看懂报错信息、学会兜住错误，并让程序把数据存进文件。","lessons":[{"id":"c5l1","title":"读懂报错与 try / except","chapter_title":"第 5 章 · 面对错误和文件","chapter_id":"c5","minutes":15,"level":"基础","goal":"会读 Python 的错误信息，并用 try/except 让程序不崩溃。","theory":"<h3>报错信息要从下往上看</h3>\n<pre class=\"snippet\"><code>Traceback (most recent call last):\n  File \"main.py\", line 3, in &lt;module&gt;\n    print(10 / 0)\nZeroDivisionError: division by zero</code></pre>\n<ul><li>最后一行：<strong>错误类型 + 原因</strong>，这是最重要的信息。</li><li>上面几行：出错的位置（文件和行号）。</li></ul>\n<table><thead><tr><th>报错</th><th>中文含义</th><th>常见原因</th></tr></thead><tbody><tr><td><code>SyntaxError</code></td><td>语法错误</td><td>括号/引号没配对、漏了冒号</td></tr><tr><td><code>IndentationError</code></td><td>缩进错误</td><td>该缩进没缩，或缩进不一致</td></tr><tr><td><code>NameError</code></td><td>名字不存在</td><td>变量名拼错、还没赋值</td></tr><tr><td><code>TypeError</code></td><td>类型不对</td><td>字符串和数字相加、参数个数不对</td></tr><tr><td><code>ValueError</code></td><td>值不对</td><td><code>int(\"abc\")</code></td></tr><tr><td><code>IndexError</code></td><td>下标越界</td><td>列表只有 3 个元素却取第 5 个</td></tr><tr><td><code>KeyError</code></td><td>键不存在</td><td>字典里没有这个键</td></tr><tr><td><code>ZeroDivisionError</code></td><td>除以零</td><td>除数是 0</td></tr></tbody></table>\n<h3>try / except：把错误兜住</h3>\n<pre class=\"snippet\"><code>try:\n    n = int(input(\"请输入一个数字：\"))\n    print(f\"两倍是 {n * 2}\")\nexcept ValueError:\n    print(\"这不是一个数字，请输入数字\")</code></pre>\n<p>程序先尝试执行 try 里的代码；一旦出错，就跳到 except 里，而不是直接崩溃。</p>\n<h3>常用配套：else 和 finally</h3>\n<pre class=\"snippet\"><code>try:\n    n = int(\"12\")\nexcept ValueError:\n    print(\"转换失败\")\nelse:\n    print(\"转换成功\", n)     # 没出错才执行\nfinally:\n    print(\"无论如何都会执行\")</code></pre>\n<div class=\"callout\"><p>提示：不要用 try 包住一大片代码。只包住<strong>你预想到会出错的那一句</strong>，出问题才容易定位。</p></div>","example":{"title":"安全地读数字","code":"text = input(\"请输入一个整数：\")\n\ntry:\n    n = int(text)\n    print(f\"你输入的是 {n}，两倍是 {n * 2}\")\nexcept ValueError:\n    print(f\"'{text}' 不是整数，请重新运行并输入数字\")","stdin":["42"],"explain":"把输入框改成 abc 再运行，看看程序怎样优雅地应对错误。","runnable":true,"notes":[]},"exercises":[{"title":"练习：不崩的除法","task":"<p>读入两个数（可能是 0），用 try/except 处理除以 0 的情况。</p>\n<p>输入框是 <code>10</code> 和 <code>0</cod
